name: Encore user guides and locale inventory (documentation only)
on:
  push:
    branches: [main]
    paths:
      - 'docs/i18n/**'
      - 'docs/PS5_SYSTEM_LANGUAGE_POLICY.md'
      - 'headless/prosperoeden/ui/lang/**'
      - 'tools/check-english-regional-variants.py'
      - 'tools/launcher/launcher.pot'
      - 'tools/launcher/english_variants.py'
      - 'headless/prosperoeden/pe/core/strings.cpp'
      - 'LANGUAGES.md'
      - 'README.md'
      - 'INSTALL.md'
      - 'SETTINGS.md'
      - 'TROUBLESHOOTING.md'
      - 'SUPPORT.md'
      - 'ACCESSIBILITY.md'
      - '.github/workflows/docs-user-guide-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  user-guide-coverage:
    name: Check 31 PS5 catalogs (including English variants) and 29 translated manuals
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout published documentation and locale catalogs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            docs/i18n
            LANGUAGES.md
            README.md
            INSTALL.md
            SETTINGS.md
            TROUBLESHOOTING.md
            SUPPORT.md
            ACCESSIBILITY.md
            headless/prosperoeden/ui/lang
            headless/prosperoeden/pe/core/strings.cpp
            tools/check-english-regional-variants.py
            tools/launcher
            assets
            LICENSE
            LICENSES
      - name: Validate available languages, localized safety guidance and links
        run: python3 -B docs/i18n/check_user_docs.py
      - name: Validate separate US and UK English catalog spellings
        run: python3 -B tools/check-english-regional-variants.py
