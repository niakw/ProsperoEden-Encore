name: NS1 NVDEC active owner receipt (host)
on:
  pull_request:
    paths:
      - "headless/CMakeLists.txt"
      - "tools/check-active-cmake-source-boundary.py"
      - "tools/check-nvdec-eagain-owner-selection-host.py"
      - ".github/workflows/ns1-nvdec-eagain-owner-pair-host.yml"
      - "vendor"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nvdec-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout engine and current vendor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Verify current encore-active FFmpeg owner and packet fixtures
        run: |
          set -euo pipefail
          python3 -B tools/check-active-cmake-source-boundary.py
          python3 -B tools/check-nvdec-eagain-owner-selection-host.py
          python3 -B vendor/tests/ns1-nvdec-eagain-source.py
          python3 -B vendor/tests/ns1_nvdec_eagain_lossless_host.py
          if test -f vendor/tests/fc27_nvdec_vic_witness_host.py; then
            python3 -B vendor/tests/fc27_nvdec_vic_witness_host.py
          fi
      - name: Boundary
        if: always()
        run: echo "Host-only; native PS5 FFmpeg/VIC and FC27 video still require console validation." >> "$GITHUB_STEP_SUMMARY"
