name: R09 neural Vulkan host / SPIR-V ABI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r09-vit-boundary-qualification.yml'
      - 'extras/graphics/rdna2_nr_*'
      - 'extras/graphics/test_rdna2_nr_*'
      - 'extras/graphics/fixtures/r09_nr_*'
      - 'tools/graphics/test-rdna2-*'
      - 'tools/graphics/check-rdna2-neural-vulkan-tus.py'
      - 'tools/graphics/r09_vulkan_io_smoke.cpp'
      - 'tools/graphics/r09_export_evidence.py'
      - 'tools/graphics/r09_vulkan_temporal_smoke.cpp'
      - 'tools/graphics/r09_*'
      - 'tools/graphics/test_r09_verify_model_pack.py'
      - 'tools/graphics/test-rdna2-proxy-features-spv.py'
      - 'headless/vulkan.cmake'
      - 'headless/vulkan_present_layer_r24.cpp'
      - 'headless/vulkan_present_layer_r24.h'
      - 'headless/main.cpp'
      - 'headless/neural_video_policy.h'
      - 'tools/graphics/test_neural_video_policy.cpp'
      - 'headless/neural_runtime_state.h'
      - 'headless/nr_dll_model_import.h'
      - 'headless/glyph_sha256.h'
      - 'extras/graphics/test_nr_dll_model_import.cpp'
      - 'headless/r09_native_plans.h'
      - 'headless/storage_paths.h'
      - 'headless/nr_dll_user_file.h'
      - 'headless/nr_dll_launch_preflight.h'
      - 'extras/graphics/test_nr_dll_launch_preflight.cpp'
      - 'headless/nr_dll_tensor_digests.h'
      - 'tools/graphics/test_r09_native_digest_inventory.py'
      - 'headless/prosperoeden/pe/ui/settings.cpp'
      - 'headless/prosperoeden/pe/ui/library.cpp'
      - 'headless/prosperoeden/pe/ui/services.hpp'
      - 'headless/prosperoeden/eden_services.cpp'
      - 'headless/prosperoeden/eden_services.h'
      - 'extras/graphics/test_nr_dll_user_file.cpp'
      - 'vendor'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r09-neural-host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  neural-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Audit authentic Original/Compact reference inventories and NRMODEL1 verifier
        run: |
          python3 -B tools/graphics/r09_verify_model_pack.py --check-reference
          python3 -B tools/graphics/test_r09_native_digest_inventory.py
          python3 -B tools/graphics/test_r09_verify_model_pack.py
      - name: Install host-only Vulkan 1.1 shader validators
        run: sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools spirv-tools
      - name: Compile and execute host graph boundary tests under UBSan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-r09-boundary
          for cxx in clang++ g++; do
            for unit in \
              test_rdna2_nr_vit_boundary_repack_policy \
              test_rdna2_nr_decoder_tile_to_linear_policy \
              test_rdna2_nr_decoder_projection_policy \
              test_rdna2_nr_decoder_upsample_policy \
              test_rdna2_nr_split_decoder_skip_repack_policy \
              test_rdna2_nr_bottleneck_route_policy \
              test_rdna2_nr_vit_native_route_policy \
              test_rdna2_nr_decoder_model_loader \
              test_rdna2_nr_image_feature_policy \
              test_rdna2_nr_image_feature_weights \
              test_rdna2_nr_proxy_feature_policy \
              test_rdna2_nr_proxy_lift_link_policy \
              test_rdna2_nr_proxy_fswin_link_policy \
              test_rdna2_nr_unet_down_sequence_policy \
              test_rdna2_nr_unet_up_sequence_policy \
              test_rdna2_nr_unet_bottleneck_link_policy \
              test_rdna2_nr_full_graph_owner_coverage \
              test_rdna2_nr_model_manifest \
              test_rdna2_nr_session_preflight \
              test_rdna2_nr_preblock_boundary_policy \
              test_rdna2_nr_postblock_mix_policy \
              test_rdna2_nr_postblock_mix_weights \
              test_rdna2_nr_preblock_pool_policy \
              test_rdna2_nr_nohistory_compose_policy \
              test_rdna2_nr_temporal_compose_policy \
              test_rdna2_nr_upsample_gain_reconstruction \
              test_rdna2_nr_hdr_proxy_policy \
              test_rdna2_nr_nohistory_present_policy \
              test_rdna2_nr_texture_proxy_policy \
              test_nr_display_capture_policy \
              test_nr_dll_model_import \
              test_neural_video_policy \
              test_nr_dll_user_file \
              test_nr_dll_launch_preflight \
              test_rdna2_nr_fswin_tensor_alias_policy
            do
              source="extras/graphics/${unit}.cpp"
              if [[ "$unit" == test_neural_video_policy ]]; then
                source="tools/graphics/${unit}.cpp"
              fi
              "$cxx" -std=c++20 -O1 -Wall -Wextra -Werror -UNDEBUG \
                -fsanitize=undefined -fno-sanitize-recover=all \
                -Ivendor/encore-active/eden-vulkan/include -Iextras/graphics -Iheadless \
                "$source" \
                -o ".build-r09-boundary/${unit}-$cxx"
              if [[ "$unit" == test_rdna2_nr_bottleneck_route_policy || \
                    "$unit" == test_rdna2_nr_vit_native_route_policy || \
                    "$unit" == test_rdna2_nr_unet_down_sequence_policy || \
                    "$unit" == test_rdna2_nr_unet_up_sequence_policy || \
                    "$unit" == test_rdna2_nr_unet_bottleneck_link_policy || \
                    "$unit" == test_rdna2_nr_full_graph_owner_coverage || \
                    "$unit" == test_rdna2_nr_session_preflight || \
                    "$unit" == test_rdna2_nr_preblock_boundary_policy || \
                    "$unit" == test_rdna2_nr_postblock_mix_policy || \
                    "$unit" == test_rdna2_nr_preblock_pool_policy ]]; then
                UBSAN_OPTIONS=halt_on_error=1 ".build-r09-boundary/${unit}-$cxx" \
                  extras/graphics/fixtures/r09_nr_original_1920x1080.txt \
                  extras/graphics/fixtures/r09_nr_small_1920x1080.txt
              else
                UBSAN_OPTIONS=halt_on_error=1 ".build-r09-boundary/${unit}-$cxx"
              fi
            done
          done
      - name: Compile and verify Vulkan 1.1 RDNA2 compute shader ABIs
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            test-rdna2-vit-boundary-repack-spv.py
            test-rdna2-decoder-tile-linear-spv.py
            test-rdna2-decoder-fp32-to-fp16-spv.py
            test-rdna2-decoder-spv.py
            test-rdna2-split-decoder-skip-spv.py
            test-rdna2-image-feature-spv.py
            test-rdna2-proxy-features-spv.py
            test-rdna2-postblock-mix-spv.py
            test-rdna2-preblock-pool-spv.py
            test-rdna2-nohistory-compose-spv.py
            test-rdna2-temporal-compose-spv.py
            test-rdna2-hdr-proxy-spv.py
            test-rdna2-nohistory-present-spv.py
            test-rdna2-texture-proxy-spv.py
            test-rdna2-fswin-dense-spv.py
          )
          for script in "${scripts[@]}"; do
            python3 -m py_compile "tools/graphics/$script"
            python3 "tools/graphics/$script" --vendor vendor
          done

  neural-syntax:
    name: Maintained neural Vulkan C++ owners (Clang syntax)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Install host-only Vulkan shader and FFmpeg declarations
        run: sudo apt-get install -y -o Acquire::Retries=3 --no-install-recommends glslang-tools spirv-tools libavcodec-dev libavutil-dev libswscale-dev
      - name: Syntax-check R09 maintained Vulkan C++ without PS5 build
        run: python3 -B tools/graphics/check-rdna2-neural-vulkan-tus.py

  neural-gpu-io:
    name: Real Vulkan GPU I/O smoke (Lavapipe, no PS5)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Install software Vulkan ICD and native headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libvulkan-dev mesa-vulkan-drivers glslang-tools spirv-tools
      - name: Run native image sampling and RGBA32F publication on Vulkan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-r09-gpu
          echo "Available ICD manifests:"
          find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -maxdepth 1 -name '*.json' -print 2>/dev/null || true
          mesa_icd="$(dpkg -L mesa-vulkan-drivers | grep -E '/[^/]*(lvp|lavapipe)[^/]*[.]json$' | head -n 1 || true)"
          if [[ -n "$mesa_icd" && -f "$mesa_icd" ]]; then
            export VK_ICD_FILENAMES="$mesa_icd"
            echo "R09 using Mesa software Vulkan ICD $mesa_icd"
          else
            echo "R09 Mesa ICD path not listed by package; testing available Vulkan drivers"
          fi
          glslangValidator -V --target-env vulkan1.1 -S comp \
            vendor/encore-active/eden-vulkan/r09_rdna2_nr/texture_proxy_rdna2.comp \
            -o .build-r09-gpu/texture_proxy.spv
          # Test the production first-frame 16-channel FP16 encoder, after
          # real texture sampling, with a separate CPU pixel-level oracle.
          glslangValidator -V --target-env vulkan1.1 -S comp \
            vendor/encore-active/eden-vulkan/r09_rdna2_nr/proxy_features_rdna2.comp \
            -o .build-r09-gpu/proxy_features.spv
          spirv-val --target-env vulkan1.1 .build-r09-gpu/proxy_features.spv
          # The actual learned 16->32 feature projection is exercised on
          # tiny matrices with synthetic one-hot FP16 weights, not as a
          # substitute for an authentic Original/Compact inference.
          glslangValidator -V --target-env vulkan1.1 -S comp \
            vendor/encore-active/eden-vulkan/r09_rdna2_nr/image_feature_rdna2.comp \
            -o .build-r09-gpu/image_feature.spv
          spirv-val --target-env vulkan1.1 .build-r09-gpu/image_feature.spv
          glslangValidator -V --target-env vulkan1.1 -S comp \
            vendor/encore-active/eden-vulkan/r09_rdna2_nr/nohistory_compose_rdna2.comp \
            -o .build-r09-gpu/nohistory_compose.spv
          glslangValidator -V --target-env vulkan1.1 -S comp \
            vendor/encore-active/eden-vulkan/r09_rdna2_nr/nohistory_present_rdna2.comp \
            -o .build-r09-gpu/nohistory_present.spv
          spirv-val --target-env vulkan1.1 .build-r09-gpu/texture_proxy.spv
          spirv-val --target-env vulkan1.1 .build-r09-gpu/nohistory_compose.spv
          glslangValidator -V --target-env vulkan1.1 -S comp \
            vendor/encore-active/eden-vulkan/r09_rdna2_nr/temporal_compose_rdna2.comp \
            -o .build-r09-gpu/temporal_compose.spv
          spirv-val --target-env vulkan1.1 .build-r09-gpu/temporal_compose.spv
          spirv-val --target-env vulkan1.1 .build-r09-gpu/nohistory_present.spv
          # Execute actual FSwin final learned C32 scalar GEMM both as
          # packed E4M3FN and pre-quantization FP16 RAW, with an independent
          # identity-matrix CPU oracle. No extracted/proprietary weights.
          glslangValidator -V --target-env vulkan1.1 -S comp \
            vendor/encore-active/eden-vulkan/r09_rdna2_nr/fswin_dense_rdna2.comp \
            -o .build-r09-gpu/fswin_dense.spv
          spirv-val --target-env vulkan1.1 .build-r09-gpu/fswin_dense.spv
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            tools/graphics/r09_vulkan_fswin_smoke.cpp -lvulkan \
            -o .build-r09-gpu/r09_vulkan_fswin_smoke
          .build-r09-gpu/r09_vulkan_fswin_smoke \
            .build-r09-gpu/fswin_dense.spv
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            tools/graphics/r09_vulkan_io_smoke.cpp -lvulkan \
            -o .build-r09-gpu/r09_vulkan_io_smoke
          .build-r09-gpu/r09_vulkan_io_smoke \
            .build-r09-gpu/texture_proxy.spv \
            .build-r09-gpu/proxy_features.spv \
            .build-r09-gpu/image_feature.spv \
            .build-r09-gpu/nohistory_compose.spv \
            .build-r09-gpu/nohistory_present.spv
          # Export this smaller non-square real-GPU readback as before/after.
          .build-r09-gpu/r09_vulkan_io_smoke \
            .build-r09-gpu/texture_proxy.spv \
            .build-r09-gpu/proxy_features.spv \
            .build-r09-gpu/image_feature.spv \
            .build-r09-gpu/nohistory_compose.spv \
            .build-r09-gpu/nohistory_present.spv \
            80 45
          python3 -B tools/graphics/r09_export_evidence.py
          # True native 1080p image-sized GPU capture, learned-head
          # compositing and image publication with 2,073,600 readbacks.
          .build-r09-gpu/r09_vulkan_io_smoke \
            .build-r09-gpu/texture_proxy.spv \
            .build-r09-gpu/proxy_features.spv \
            .build-r09-gpu/image_feature.spv \
            .build-r09-gpu/nohistory_compose.spv \
            .build-r09-gpu/nohistory_present.spv \
            1920 1080
          # Validate the fourth learned FP16 channel and actual next-history
          # on the same Vulkan compute stack, twice: history reset/valid.
          glslangValidator -V --target-env vulkan1.1 -S comp \
            vendor/encore-active/eden-vulkan/r09_rdna2_nr/temporal_compose_rdna2.comp \
            -o .build-r09-gpu/temporal_compose.spv
          spirv-val --target-env vulkan1.1 .build-r09-gpu/temporal_compose.spv
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            tools/graphics/r09_vulkan_temporal_smoke.cpp -lvulkan \
            -o .build-r09-gpu/r09_vulkan_temporal_smoke
          .build-r09-gpu/r09_vulkan_temporal_smoke \
            .build-r09-gpu/temporal_compose.spv
      - name: Preserve native R09 Vulkan before-and-after PNGs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r09-vulkan-before-after-real-gpu
          path: .build-r09-gpu/r09_*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
