name: NS2 research host guards

on:
  push:
    branches:
      - research/ns2-ps5-compatibility
      - main
    paths:
      - 'vendor'
      - 'vendor/**'
      - 'headless/CMakeLists.txt'
      - 'tools/ns2/**'
      - 'tools/check-ns2-*.py'
      - 'docs/NS2_GSV_NATIVE_MEMORY_REVIEW_2026-11-01.md'
      # A release sign-off changes its finite acceptance contract without
      # changing executable source. Requalify at the exact resulting SHA.
      - 'docs/NS2_P1_P2_EXIT_CONTRACT.json'
      - '.github/workflows/ns2-p1-p2-exit.yml'
      - '.github/workflows/ns2-research-host.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Research host checks supersede obsolete SHA work; the latest reviewed
  # vendor gitlink remains the sole release admission candidate.
  group: ns2-research-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  dynarmic-a64-syntax:
    name: Compile actual maintained A64 frontend with NS2 overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node 24
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 1
      - name: P2.4 cross-repo verified Ampere uniform shift, surface reduction and signed minmax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-ns2-a64
          for cxx in clang++ g++; do
            "${cxx}" -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all \
              -Ivendor/encore-active/ns2-runtime/ampere \
              -Ivendor/sources/eden/src \
              tools/ns2/test_lichii_nx2_generic_shader_regressions.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/probe.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/lower_bridge.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/maxwell_image.cpp \
              -o "build-ns2-a64/ampere-crossrepo-${cxx//+/}"
            "build-ns2-a64/ampere-crossrepo-${cxx//+/}"
          done
      - name: P4.2 deferred QMD3 completion faults cannot unwind GPU worker
        run: python3 -B tools/ns2/check_native_qmd_deferred_fence_host.py
      - name: P1.2/P4.2 verify dense GPU-only 214 ledger rollback before GMMU mapping
        run: python3 -B tools/ns2/check_native_dense_ledger_oom_host.py
      - name: P2.2 reject invalid TIC texture format aliases (source/host)
        run: python3 -B tools/ns2/check_native_texture_format_mapping.py
      - name: P2.2b prevent reentrant TextureCache readback deadlock in both renderers
        run: |
          python3 -B tools/ns2/check_native_texture_readback_lock_host.py
          python3 -B tools/ns2/check_native_texture_readback_lock_host.py --deferred
      - name: Host Boost, Vulkan and native video FFmpeg headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libboost-dev libvulkan-dev mesa-vulkan-drivers libavcodec-dev libavutil-dev libswscale-dev
      - name: H05 decode authentic FFmpeg frame through maintained native pixel renderer
        run: python3 -B tools/ns2/check_native_video_real_ffmpeg_frame_host.py
      - name: P2.3 validate real native SSBO write tracking only after final QMD/TIC admission
        run: python3 -B tools/ns2/check_native_compute_write_commit_host.py
      - name: P2.2b reject same-TIC GPU remaps before pinned Vulkan image dispatch
        run: python3 -B tools/ns2/check_native_image_physical_backing_host.py
      - name: P1.2/P2.7 C++20 syntax of real GPU worker with native kernel and NVDRV-AS overlays
        run: python3 -B tools/ns2/check_gpu_worker_source_syntax_host.py
      - name: N65 query actual sparse image tile/miptail memory requirements (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_egl_sparse_requirements_owner.py
      - name: N66/N67 execute native sparse queue submission and semaphore handoff (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_native_sparse_bind.py
      - name: N64 native PS5 VkImage sparse 2D array factory source and Vulkan driver mock
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_egl_sparse_image_owner.py
      - name: Verify native research CMake selector forwarding and release isolation
        run: python3 -B tools/ns2/check_native_research_selector.py
      - name: N76 per-title guest 31.25 MHz counter and NS1 reset (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_guest_counter_policy.py
          python3 tools/ns2/check_native_gpu_timestamp_host.py
      - name: N75 generation-independent shared GPU/CPU pool budget (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_shared_gpu_budget.py
      - name: N73 native sparse cache full-residency admission (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_sparse_cache_admission.py
      - name: N72 native scheduler sparse queue lock and submit ordering (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_native_sparse_scheduler.py
      - name: N69 native VMA sparse transaction and device-idle retirement (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_sparse_vma_bind.py
      - name: N63/N68 sparse layer budget and bounded tile/mip-tail coordinates (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_sparse_layer_budget.py
      - name: N62 PS5 native Vulkan sparse VMA allocation and rollback (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_egl_sparse_vma_owner.py
      - name: Pinned fmt 12.1.0 headers (match Eden cpmfile.json)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 12.1.0 https://github.com/fmtlib/fmt.git build-ns2-a64/fmt
          test "$(git -C build-ns2-a64/fmt rev-parse HEAD)" = "407c905e45ad75fc29bf0f9bb7c5c2fd3475976f"
      - name: Pinned Vulkan-Headers v1.4.345 (Eden cpmfile.json)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.4.345 \
            https://github.com/KhronosGroup/Vulkan-Headers.git build-ns2-a64/vulkan-headers
          test "$(git -C build-ns2-a64/vulkan-headers rev-parse HEAD)" = \
            "74d8a6cb930c68ef617b202c3ff3c59d919e086b"
      - name: Pinned VulkanMemoryAllocator v3.3.0 headers (Eden cpmfile.json)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v3.3.0 \
            https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git build-ns2-a64/vma
          test "$(git -C build-ns2-a64/vma rev-parse HEAD)" = \
            "1d8f600fd424278486eade7ed3e877c99f0846b1"
      - name: P2.2b compile real Vulkan texture and Compute owner ABI (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          for cxx in clang++ g++; do
            "$cxx" -std=c++20 -fsyntax-only -Wno-unused-parameter \
              -DPS5_NATIVE=1 -DEDEN_NS2_VULKAN_SHADER_BRIDGE_EXPERIMENTAL=1 \
              -Ibuild-ns2-a64/fmt/include \
              -Ibuild-ns2-a64/vulkan-headers/include \
              -Ibuild-ns2-a64/vma/include \
              -Ivendor/encore-active/eden-vulkan/vulkan-cache \
              -Ivendor/encore-active/eden-vulkan/include \
              -Ivendor/encore-active/ns2-astc/include \
              -Ivendor/encore-active/eden-vulkan \
              -Ivendor/encore-active/ns2-runtime/ampere \
              -Ivendor/encore-active/ns2-runtime/gpu_dispatch \
              -Ivendor/encore-active/ns2-runtime/nvdrv_gpu \
              -Ivendor/encore-active/ns2-runtime/hle \
              -Ivendor/encore-active/eden-header-hygiene/include \
              -Ivendor/sources/eden/src/dynarmic/src \
              -Ivendor/sources/eden/src \
              -Iheadless \
              tools/ns2/test_native_vulkan_texture_binding_header.cpp
          done
      - name: P2.2b compile ASTC-first Vulkan texture owner ABI (Clang/GCC)
        shell: bash
        run: |
          # Regression: the real ASTC owner must expose the same native cache
          # acquisition and GPU pin ABI, even when its headers shadow Vulkan.
          # Parse the full ASTC scratch + layer + cache combination selected
          # by the actual PS5 research profile, but never build a PS5 binary.
          set -euo pipefail
          for cxx in clang++ g++; do
            "$cxx" -std=c++20 -fsyntax-only -Wno-unused-parameter \
              -DPS5_NATIVE=1 -DEDEN_NS2_VULKAN_SHADER_BRIDGE_EXPERIMENTAL=1 \
              -DEDEN_NS2_ASTC_SCRATCH_TRIM=1 -DEDEN_NS2_ASTC_LAYER_DECODE=1 -DEDEN_NS2_ASTC_CACHE_BRIDGE=1 \
              -Ibuild-ns2-a64/fmt/include \
              -Ibuild-ns2-a64/vulkan-headers/include \
              -Ibuild-ns2-a64/vma/include \
              -Ivendor/encore-active/ns2-astc/include \
              -Ivendor/encore-active/ns2-helpers/include \
              -Ivendor/encore-active/eden-vulkan/vulkan-cache \
              -Ivendor/encore-active/eden-vulkan/include \
              -Ivendor/encore-active/eden-vulkan \
              -Ivendor/encore-active/ns2-runtime/ampere \
              -Ivendor/encore-active/ns2-runtime/gpu_dispatch \
              -Ivendor/encore-active/ns2-runtime/nvdrv_gpu \
              -Ivendor/encore-active/ns2-runtime/hle \
              -Ivendor/encore-active/eden-header-hygiene/include \
              -Ivendor/sources/eden/src/dynarmic/src \
              -Ivendor/sources/eden/src \
              -Iheadless \
              tools/ns2/test_native_vulkan_texture_binding_header.cpp
          done
      - name: P2.2b retire image/sampler owners after GPU fence (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          for cxx in clang++ g++; do
            for optimization in 0 2; do
              output="build-ns2-a64/native-texture-owners-${cxx//+/}-O${optimization}"
              "$cxx" -std=c++20 "-O${optimization}" -Wall -Wextra -Werror \
                -fsanitize=undefined -fno-sanitize-recover=all \
                -Ibuild-ns2-a64/fmt/include \
                -Ivendor/encore-active/ns2-runtime/ampere \
                -Ivendor/encore-active/ns2-runtime/gpu_dispatch \
                -Ivendor/sources/eden/src \
                tools/ns2/test_native_texture_gpu_owners.cpp -o "$output"
              UBSAN_OPTIONS=halt_on_error=1 "$output"
            done
          done
      - name: Copy selected experimental A64 sources like native CMake
        shell: bash
        run: |
          set -euo pipefail
          overlay=vendor/encore-active/ns2-a64/dynarmic
          base=build-ns2-a64/include/dynarmic
          mkdir -p "$base/frontend/A64/decoder" "$base/frontend/A64/translate/impl"
          cp "$overlay/frontend/A64/decoder/a64.h" "$base/frontend/A64/decoder/a64.h"
          cp "$overlay/frontend/A64/decoder/a64.inc" "$base/frontend/A64/decoder/a64.inc"
          for name in a64_branch.cpp impl.h load_store_exclusive.cpp; do
            cp "$overlay/frontend/A64/translate/impl/$name" "$base/frontend/A64/translate/impl/$name"
          done
      - name: Syntax-check actual Encore A64 translator
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
            -DEDEN_NS2_A64_EXPERIMENTAL=1 \
            -Ibuild-ns2-a64/fmt/include \
            -Ibuild-ns2-a64/include \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/encore-active/eden-core/src/dynarmic/frontend/A64/translate/a64_translate.cpp
      - name: Exercise real NS2 ExeFS NSO0 preflight with GCC and Clang
        shell: bash
        run: |
          set -euo pipefail
          for compiler in clang++ g++; do
            "${compiler}" -std=c++20 -O2 -Wall -Wextra -Werror \
              -fsanitize=undefined -fno-sanitize-recover=all \
              -Ivendor/encore-active/ns2-helpers/include -Ivendor/encore-active/ns2-runtime/metadata \
              tools/ns2/test_nso_preflight.cpp \
              -o "build-ns2-a64/nso-preflight-${compiler//+/}"
            "build-ns2-a64/nso-preflight-${compiler//+/}"
          done
      - name: Verify read-only NSO-to-KProcess handoff contract (Clang and GCC)
        shell: bash
        run: |
          set -euo pipefail
          for compiler in clang++ g++; do
            "${compiler}" -std=c++20 -O2 -Wall -Wextra -Werror \
              -fsanitize=undefined -fno-sanitize-recover=all \
              -Ivendor/encore-active/ns2-helpers/include -Ivendor/encore-active/ns2-runtime/metadata \
              tools/ns2/test_nso_process_handoff.cpp \
              -o "build-ns2-a64/handoff-${compiler//+/}"
            "build-ns2-a64/handoff-${compiler//+/}"
          done
      - name: Guard ExeFS to KProcess signed-page admission (Clang and GCC)
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'code_num_pages = static_cast<s32>(code_size / PageSize)' \
            vendor/sources/eden/src/core/hle/kernel/k_process.cpp
          for compiler in clang++ g++; do
            "${compiler}" -std=c++20 -O2 -Wall -Wextra -Werror \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              -Ivendor/encore-active/ns2-helpers/include -Ivendor/encore-active/ns2-runtime/metadata \
              tools/ns2/test_kprocess_code_admission.cpp \
              -o "build-ns2-a64/kprocess-code-${compiler//+/}"
            "build-ns2-a64/kprocess-code-${compiler//+/}"
          done
      - name: Compile maintained SVC owner and test bounded native trace
        shell: bash
        run: |
          set -euo pipefail
          for compiler in clang++ g++; do
            "${compiler}" -std=c++20 -Wall -Wextra -Werror -O2 \
              -fsanitize=undefined -fno-sanitize-recover=all \
              -Ivendor/encore-active/ns2-helpers/include \
              tools/ns2/test_svc_trace.cpp \
              -o "build-ns2-a64/svc-trace-${compiler//+/}"
            "build-ns2-a64/svc-trace-${compiler//+/}"
          done
          clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
            -DEDEN_NS2_SVC_TRACE=1 \
            -Ibuild-ns2-a64/fmt/include \
            -Ivendor/encore-active/ns2-helpers/include \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/encore-active/ns2-runtime/kernel/core/hle/kernel/svc.cpp
      - name: Syntax-check actual unified NPDM and ExeFS loader owners
        shell: bash
        run: |
          set -euo pipefail
          # Exactly the source owners selected by the single PS5 CMake graph:
          # shared NS1/NS2 metadata + ExeFS and the reviewed native NSO loader.
          for source in \
            vendor/encore-active/ns2-runtime/metadata/core/file_sys/program_metadata.cpp \
            vendor/encore-active/ns2-runtime/metadata/core/loader/loader.cpp \
            vendor/encore-active/ns2-runtime/metadata/core/loader/deconstructed_rom_directory.cpp \
            vendor/encore-active/eden-core/src/core/loader/nso.cpp; do
            echo "Checking unified owner: ${source}"
            test -f "${source}"
            clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
              -Ibuild-ns2-a64/fmt/include \
              -Iheadless \
              -Ivendor/encore-active/ns2-helpers/include \
              -Ivendor/encore-active/ns2-runtime/metadata \
              -Ivendor/sources/eden/src/dynarmic/src \
              -Ivendor/sources/eden/src \
              "${source}"
          done

      - name: Compile actual maintained AM command 320 overlay
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
            -Ibuild-ns2-a64/fmt/include \
            -Ivendor/encore-active/eden-core/include \
            -Ivendor/encore-active/ns2-runtime/am \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/encore-active/ns2-runtime/am/core/hle/service/am/service/application_functions.cpp
      - name: Ensure unverified NS2 AM graphics scaling prototype stays retired
        run: python3 -B tools/ns2/check_retired_am_graphics_scale.py
      - name: Syntax-check real Switch 2 GPU TIPC service owner
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
            -Ibuild-ns2-a64/fmt/include \
            -Ivendor/encore-active/ns2-runtime/gpu_session \
            -Ivendor/encore-active/ns2-runtime/hle \
            -Ivendor/encore-active/ns2-runtime/nvdrv_as \
            -Ivendor/encore-active/ns2-runtime/gpu_access_svc \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/encore-active/ns2-runtime/gpu_session/core/hle/service/am/service/gpu_session.cpp
          clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
            -Ibuild-ns2-a64/fmt/include \
            -Ivendor/encore-active/ns2-runtime/gpu_session \
            -Ivendor/encore-active/ns2-runtime/hle \
            -Ivendor/encore-active/ns2-runtime/gpu_access_svc \
            -Ivendor/encore-active/ns2-runtime/nvdrv_as \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/encore-active/ns2-runtime/gpu_session/core/hle/service/am/service/gpu_worker.cpp
          clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
            -Ibuild-ns2-a64/fmt/include \
            -Ivendor/encore-active/ns2-runtime/gpu_session \
            -Ivendor/encore-active/ns2-runtime/hle \
            -Ivendor/encore-active/ns2-runtime/nvdrv_as \
            -Ivendor/encore-active/ns2-runtime/gpu_access_svc \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/encore-active/ns2-runtime/gpu_session/core/hle/service/am/service/gpu_worker_shared.cpp
      - name: Syntax-check real NS2 SelfController and GraphicsSupervisor IPC services
        shell: bash
        run: |
          set -euo pipefail
          for source in \
            vendor/encore-active/ns2-runtime/self_controller/core/hle/service/am/service/self_controller.cpp \
            vendor/encore-active/ns2-runtime/graphics_supervisor/core/hle/service/am/service/graphics_supervisor.cpp \
            vendor/encore-active/ns2-runtime/video_decoder/core/hle/service/am/service/graphics_video_decoder_session.cpp; do
            clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
              -DPS5_NATIVE=1 \
              -Ivendor/encore-active/eden-sync/overrides/h05-syncpoint \
              -Ivendor/encore-active/eden-core/overrides/h01-filesystem \
              -Ibuild-ns2-a64/fmt/include \
              -Ivendor/encore-active/ns2-runtime/self_controller \
              -Ivendor/encore-active/ns2-runtime/graphics_supervisor \
              -Ivendor/encore-active/ns2-runtime/video_decoder \
              -Ivendor/encore-active/ns2-runtime/gpu_session \
              -Ivendor/encore-active/ns2-runtime/nvdrv_as \
              -Ivendor/encore-active/ns2-runtime/hle \
              -Ivendor/encore-active/ns2-runtime/gpu_access_svc \
              -Ivendor/sources/eden/src/dynarmic/src \
              -Ivendor/sources/eden/src \
              "${source}"
          done
      - name: Syntax-check native NVDRV GPU ioctl source owner (GCC)
        shell: bash
        run: |
          set -euo pipefail
          # Clang 18 CI crashes while instantiating the pre-existing
          # ioctl_serialization.h WrapFixedInlOut constrained template.
          # Test this exact owner with a second real C++20 frontend instead.
          g++ -std=c++20 -fsyntax-only -Werror -Wno-unused-parameter \
            -Ibuild-ns2-a64/fmt/include \
            -Ivendor/encore-active/ns2-runtime/nvdrv \
            -Ivendor/encore-active/eden-header-hygiene/include \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/encore-active/ns2-runtime/nvdrv/core/hle/service/nvdrv/devices/nvhost_ctrl_gpu.cpp
      - name: Verify unmodified upstream Eden pin and two warning-free active headers
        run: python3 -B tools/install-eden-header-hygiene.py --verify
      - name: Syntax-check real process-scoped native GPFIFO channel owner (GCC)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -fsyntax-only -Werror -Wno-unused-parameter \
            -Ibuild-ns2-a64/fmt/include \
            -Ivendor/encore-active/ns2-runtime/nvdrv_gpu \
            -Ivendor/encore-active/ns2-runtime/nvdrv_as \
            -Ivendor/encore-active/ns2-runtime/nvdrv \
            -Ivendor/encore-active/ns2-runtime/hle \
            -Ivendor/encore-active/ns2-runtime/gpu_access_svc \
            -Ivendor/encore-active/eden-header-hygiene/include \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/encore-active/ns2-runtime/nvdrv_gpu/core/hle/service/nvdrv/devices/nvhost_gpu.cpp
      - name: Syntax-check research Ampere DMA GPU puller owner (Clang and GCC)
        shell: bash
        run: |
          set -euo pipefail
          for cxx in clang++ g++; do
            "$cxx" -std=c++20 -fsyntax-only -Werror -Wno-unused-parameter \
              -Ibuild-ns2-a64/fmt/include \
              -Iheadless \
              -Ivendor/encore-active/ns2-runtime/gpu_dispatch \
              -Ivendor/encore-active/ns2-runtime/nvdrv_gpu \
              -Ivendor/encore-active/ns2-runtime/hle \
              -Ivendor/encore-active/eden-header-hygiene/include \
              -Ivendor/sources/eden/src/dynarmic/src \
              -Ivendor/sources/eden/src \
              vendor/encore-active/ns2-runtime/gpu_dispatch/video_core/engines/puller.cpp
            # The ordinary host translation omits this conditional branch.
            # Prove the actual PS5 QMD3 -> mapped Ampere capture callback
            # remains syntactically linked to the genuine shader-reader ABI.
            "$cxx" -std=c++20 -fsyntax-only -Werror -Wno-unused-parameter \
              -DPS5_NATIVE=1 -DEDEN_NS2_VULKAN_SHADER_BRIDGE_EXPERIMENTAL=1 \
              -Ibuild-ns2-a64/fmt/include \
              -Iheadless \
              -Ivendor/encore-active/ns2-runtime/ampere \
              -Ivendor/encore-active/ns2-runtime/gpu_dispatch \
              -Ivendor/encore-active/ns2-runtime/nvdrv_gpu \
              -Ivendor/encore-active/ns2-runtime/hle \
              -Ivendor/encore-active/eden-header-hygiene/include \
              -Ivendor/sources/eden/src/dynarmic/src \
              -Ivendor/sources/eden/src \
