name: R09 Min 720p Original — authentic host runner syntax only

# Strictly isolated: does not link/run a 152-stage neural frame, build PS5,
# merge vendor research branches or change pinned vendor dependency.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r09-min-720-original-host-entry.yml'
      - 'tools/graphics/r09_full_gpu_host.cpp'
      - 'headless/vulkan_present_layer_r24.cpp'
      - 'extras/graphics/dlss_nr_min_720_present_handoff.h'
      - 'tools/graphics/check-rdna2-neural-vulkan-tus.py'
      - 'extras/graphics/dlss_nr_min_720_plan_emit.h'
      - 'extras/graphics/dlss_nr_min_720_route_trial.h'
      - 'extras/graphics/dlss_nr_min_graph_geometry.h'
      - 'extras/graphics/test_r09_min_720_readback_dimensions.cpp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r09-720-real-host-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  native-host-runner:
    name: Authentic 720p Original host GPU entry (macro OFF and ON)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Encore feature commit and PINNED vendor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - name: Confirm production vendor pin is unchanged
        shell: bash
        run: |
          set -euo pipefail
          pinned=22b69d6053db41b74edac2633c012f925b84f69e
          test "$(git rev-parse HEAD:vendor)" = "$pinned"
          test "$(git -C vendor rev-parse HEAD)" = "$pinned"
          echo R09_MIN_720_ORIGINAL_AUTHENTIC_HOST_PIN_STILL_MAIN
      - name: Install host-only Vulkan SPIR-V and native C++ dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang glslang-tools spirv-tools libvulkan-dev \
            libavcodec-dev libavutil-dev libswscale-dev
      - name: Compile complete authentic Original GPU runner in both explicit research gates
        shell: bash
        run: |
          set -euo pipefail
          R09_MIN_720_HOST_RUNNER_DUAL=1 \
            python3 -B tools/graphics/check-rdna2-neural-vulkan-tus.py
          R09_MIN_720_PRESENT_TU_DUAL=1 \
            python3 -B tools/graphics/check-rdna2-neural-vulkan-tus.py
          test "$(git rev-parse HEAD:vendor)" = "22b69d6053db41b74edac2633c012f925b84f69e"
          echo R09_MIN_720_HOST_PLUS_POST_NEURAL_FSR_RENDERER_CPP_SYNTAX_ONLY_NO_PS5_BUILD

      - name: Test research vendor #42 readback sizes and actual native C++ owners
        shell: bash
        run: |
          set -euo pipefail
          pinned=22b69d6053db41b74edac2633c012f925b84f69e
          candidate=b26075ab190460014cbffd6c744faf897088375c
          test "$(git rev-parse HEAD:vendor)" = "$pinned"
          test "$(git -C vendor rev-parse HEAD)" = "$pinned"
          # Detached CI-only vendor PR #42 checkout; the engine gitlink
          # remains unchanged. No PS5 build, runtime activation or weights.
          git -C vendor -c credential.helper= fetch --quiet --depth=1 origin "$candidate"
          git -C vendor checkout --quiet --detach "$candidate"
          test "$(git -C vendor rev-parse HEAD)" = "$candidate"
          for cxx in g++ clang++; do
            "$cxx" -std=c++20 -O1 -Wall -Wextra -Werror -UNDEBUG \
              -fsanitize=undefined -fno-sanitize-recover=all \
              -Ivendor/encore-active/eden-vulkan/include \
              extras/graphics/test_r09_min_720_readback_dimensions.cpp \
              -o "/tmp/r09-readback-geometry-${cxx}"
            UBSAN_OPTIONS=halt_on_error=1 "/tmp/r09-readback-geometry-${cxx}"
          done
          R09_MIN_720_READBACK_OWNER_DUAL=1 \
            python3 -B tools/graphics/check-rdna2-neural-vulkan-tus.py
          test "$(git rev-parse HEAD:vendor)" = "$pinned"
          echo R09_MIN_720_VENDOR_42_REAL_NATIVE_OWNERS_AND_HOST_GATE_PASS_NO_GPU_NO_PS5
