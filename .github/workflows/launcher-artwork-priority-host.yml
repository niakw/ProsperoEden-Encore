name: Launcher artwork priority (branch-only host checks)
on:
  push:
    branches:
      - fix/launcher-artwork-priority-20261125
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: launcher-artwork-priority-${{ github.ref }}
  cancel-in-progress: false
jobs:
  host:
    if: github.ref == 'refs/heads/fix/launcher-artwork-priority-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
      - name: Index categories, platform order and first fanart
        run: python3 -B tools/launcher/build-box-art-index.py --self-test
      - name: Icon scheduling, cache and selected media
        if: success() || failure()
        run: python3 -B tools/check-home-media.py
      - name: Native case source and candidate retry contracts
        if: success() || failure()
        run: python3 -B tools/check-launch-case-artwork.py
      - name: Actual C++ rear media selector
        if: success() || failure()
        run: python3 -B tools/check-encore-case-media-selection-host.py
      - name: Install isolated Mesa and SPIR-V host tools
        if: success() || failure()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri glslang-tools spirv-tools
      - name: Original case geometry in independent EGL contexts
        if: success() || failure()
        run: python3 -B tools/check-loading-artwork-egl-host.py
      - name: Compile and validate the same case shader for Vulkan 1.1
        if: success() || failure()
        run: |
          python3 -B tools/graphics/build-vulkan-hud-shaders.py --case-only --source-dir headless --include-dir headless --output /tmp/loading-case-spv.h --glslang glslangValidator --spirv-val spirv-val
      - name: Source contracts for the single-owner loading transition
        if: success() || failure()
        run: |
          python3 -B tools/check-ps5-unified-dynamic-loading-host.py
          python3 -B tools/check-ps5-vulkan-loading-stages-host.py
