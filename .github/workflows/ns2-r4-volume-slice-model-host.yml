name: NS2 R4 3D volume-slice research model and exact-source witness
# Validates a host-only policy model + immutable PR #36 source witness.
# Does NOT compile the active TextureCache header or run PS5 Vulkan.
on:
  push:
    branches: [research/ns2-upstream-optimization-audit-20261110]
    paths:
      - 'research/ns2/test_volume_slice_admission.cpp'
      - '.github/workflows/ns2-r4-volume-slice-model-host.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ns2-r4-model-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-witness-and-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout research-only model
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            research/ns2/test_volume_slice_admission.cpp
            .github/workflows/ns2-r4-volume-slice-model-host.yml
      - name: Verify immutable vendor R4 source and eligibility guards
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/niakw/Prospero.Eden-Encore-vendor/a6df3c45f4119bd21cb8ee42ff5fe0d21b2664e1/encore-active/eden-vulkan/vulkan-cache/video_core/texture_cache/texture_cache.h'
          curl --fail --location --silent --show-error --retry 2 "${url}" -o "${RUNNER_TEMP}/r4-texture-cache.h"
          test "$(git hash-object "${RUNNER_TEMP}/r4-texture-cache.h")" = 38e93fdcf8e7403b726668c552f22fe5b6cb9c60
          python3 - "${RUNNER_TEMP}/r4-texture-cache.h" <<'PY'
          from pathlib import Path
          import sys
          src = Path(sys.argv[1]).read_text()
          start = src.index("bool TextureCache<P>::BlitImage(")
          end = src.index("const auto result = GetBlitImages(dst, src, copy);", start)
          active = src[start:end]
          checks = (
              "CaptureGraphicsTicket(maxwell3d)",
              "IsGraphicsCurrent(maxwell3d, *ticket)",
              "copy.operation != Fermi2D::Operation::SrcCopy",
              "copy.filter != Fermi2D::Filter::Point",
              "MarkModification(slot_images[dst_slice->id])",
              "runtime.CopyImage(",
              "if (copy_native_volume_slice())",
          )
          for needle in checks:
              assert needle in active, f"missing R4 active source contract: {needle}"
          assert active.count("IsGraphicsCurrent(maxwell3d, *ticket)") >= 2
          print("R4_PINNED_ACTIVE_SOURCE_WITNESS_PASS (text/source only)")
          PY
      - name: Run conservative 3D slice model on Clang and GCC with sanitizers
        shell: bash
        run: |
          set -euo pipefail
          fixture=research/ns2/test_volume_slice_admission.cpp
          for compiler in clang++ g++; do
            for optimization in 1 2; do
              output="${RUNNER_TEMP}/r4-${compiler//+/p}-O${optimization}"
              "${compiler}" -std=c++20 -O"${optimization}" -Wall -Wextra -Werror \
                -fsanitize=address,undefined -fno-sanitize-recover=all \
                -fno-omit-frame-pointer "${fixture}" -o "${output}"
              "${output}"
            done
          done
          echo 'R4_HOST_MODEL_PASS: 4 source-policy model runs; active C++/PS5 GPU still UNQUALIFIED'
