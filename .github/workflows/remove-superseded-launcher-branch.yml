name: Remove superseded launcher branch
on:
  push:
    branches:
      - fix/launcher-artwork-transition-clean-20261123
permissions:
  contents: write
jobs:
  remove-superseded-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Delete closed superseded launcher branch
        run: |
          set -euo pipefail
          git push origin --delete fix/launcher-artwork-transition-20261123
