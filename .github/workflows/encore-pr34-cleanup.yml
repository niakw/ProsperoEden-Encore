name: One-shot cleanup PR34 qualification branch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/encore-pr34-cleanup.yml'
permissions:
  contents: read
jobs:
  delete-pr34-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete PR34 head only if merge and exact SHA are confirmed
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          branch="qualification/p1p2-latest-vendor-20261110"
          expected="363f09c526d27d23bdca289c04d68b163af120de"
          merged="$(gh api "repos/${repo}/pulls/34" --jq '.merged')"
          test "$merged" = "true"
          if ! current="$(gh api "repos/${repo}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null)"; then
            echo "Branch already absent"; exit 0
          fi
          if [[ "$current" != "$expected" ]]; then
            echo "Ref moved: refusing deletion"; exit 1
          fi
          gh api --method DELETE "repos/${repo}/git/refs/heads/${branch}"
          echo "Deleted $branch at $expected"
