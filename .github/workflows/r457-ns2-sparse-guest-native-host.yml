name: R457 native sparse 12GiB owner qualification (host, no PS5 build)
on:
  pull_request:
    paths:
      - 'src/ns2_sparse_guest.cpp'
      - 'src/ns2_sparse_guest.h'
      - 'src/host_memory.cpp'
      - 'headless/CMakeLists.txt'
      - 'tools/ns2/test_r457_native_sparse_owner.cpp'
      - 'tools/ns2/check_r457_sparse_kernel_source.py'
      - vendor
      - '.github/workflows/r457-ns2-sparse-guest-native-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-syscall-owner-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Compile exact native owner and mock syscalls with Clang C++20 UBSan
        run: |
          set -euo pipefail
          clang++ -std=c++20 -O1 -Wall -Wextra -Werror -pedantic \
            -DPS5_NATIVE=1 -fsanitize=undefined -fno-sanitize-recover=all \
            -Isrc -Iheadless src/ns2_sparse_guest.cpp \
            tools/ns2/test_r457_native_sparse_owner.cpp -o /tmp/r457-native-owner
          /tmp/r457-native-owner
          python3 -B tools/ns2/check_r457_sparse_kernel_source.py
      - name: Verify production sparse backing and maintained guest PTE owner
        run: |
          set -euo pipefail
          grep -F 'set(EDEN_NS2_SPARSE_BACKING ON)' headless/CMakeLists.txt
          grep -F 'target_compile_definitions(core PRIVATE EDEN_NS2_SPARSE_BACKING=1)' headless/CMakeLists.txt
          grep -F 'EDEN_NS2_SPARSE_BACKING' src/host_memory.cpp
          selected="$(git rev-parse HEAD:vendor)"
          test "$selected" = "$(git -C vendor rev-parse HEAD)"
          case "$selected" in
            1ec7b429238d1175a76dc94b7c0a7f1c2eb62864|fe9edd661d6f0824c7339865d50aa9cf99cab150|c339fd06f02e42e67d5416ae82194ba619b7ee68|47568425c71d534b72cc966d1500412c9ae4fc16|447e08718c9b6625508da6ce63796ed1f4285d2f|97fdc316fcf5b42e08c26845887f298feac2a424|99ca67babe955398e157c6b28b22a79cbb88967e|7bd7a85e6c1886035c75395c86b05b231375bbf5|7b42e7f4ba6887fe6d7b539a1d2c50e6782603f6|0267753219c4b6a6f3fa086a356b698cd5295f78|78a903a7479f0f58f3cbd3c2fcfd329012a11e10|13ee2fff7be6c0bac225b377a4367b1d0b3073a0|c8e6f2f8dd2b0554e1c7d5bf6e31ef66a9885767|4c252a3f4ccbbdc0ef945727da8c0e4b31a7d028|72faa8edd26f6fcb16b08f321211fb94427c4ebb|a946785d1ad02752ae47f9b32032e99bdbb53e02) ;;
            *) echo "Unreviewed sparse guest vendor pin $selected" >&2; exit 1 ;;
          esac
