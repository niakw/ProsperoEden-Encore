name: P0 PS5 recoverable session incident receipt (host only)
on:
  pull_request:
    paths:
      - 'headless/diagnostics.h'
      - 'headless/main.cpp'
      - 'src/memory_pages.cpp'
      - 'tools/check-p0-session-failure-receipt-host.py'
      - '.github/workflows/p0-session-failure-receipt-host.yml'
  push:
    branches: [main]
    paths:
      - 'headless/diagnostics.h'
      - 'headless/main.cpp'
      - 'src/memory_pages.cpp'
      - 'tools/check-p0-session-failure-receipt-host.py'
      - '.github/workflows/p0-session-failure-receipt-host.yml'
permissions:
  contents: read
jobs:
  persistent-recoverable-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Actual C++ quiet receipt, append retention, kernel RC and sandbox rules O0/O2
        run: python3 -B tools/check-p0-session-failure-receipt-host.py
