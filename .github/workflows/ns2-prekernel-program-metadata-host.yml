name: NS2 pre-kernel real ProgramMetadata qualification
on:
  pull_request:
    paths:
      - 'vendor'
      - 'tools/ns2/test_program_metadata.cpp'
      - '.github/workflows/ns2-prekernel-program-metadata-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  program-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 1
      - name: Compile and execute maintained ProgramMetadata parser
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfmt-dev
          mkdir -p build-ns2-prekernel
          clang++ -std=c++20 -O1 -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -ffunction-sections -fdata-sections -Wl,--gc-sections \
            -I/usr/include \
            -Ivendor/encore-active/ns2-helpers/include \
            -Ivendor/encore-active/ns2-runtime/metadata \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            tools/ns2/test_program_metadata.cpp \
            vendor/encore-active/ns2-runtime/metadata/core/file_sys/program_metadata.cpp \
            -o build-ns2-prekernel/npdm-real-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            build-ns2-prekernel/npdm-real-test
