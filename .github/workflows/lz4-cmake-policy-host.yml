name: LZ4 CMake policy staging host
on:
  pull_request:
    paths:
      - 'tools/stage-lz4-cmake-policy.py'
      - 'tools/check-lz4-cmake-policy-host.py'
      - 'tools/prepare-build.sh'
      - '.github/workflows/lz4-cmake-policy-host.yml'
  push:
    branches: [main]
    paths:
      - 'tools/stage-lz4-cmake-policy.py'
      - 'tools/check-lz4-cmake-policy-host.py'
      - 'tools/prepare-build.sh'
      - '.github/workflows/lz4-cmake-policy-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - run: python3 -B tools/check-lz4-cmake-policy-host.py
