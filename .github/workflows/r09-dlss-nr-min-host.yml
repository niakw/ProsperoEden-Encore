name: R09 DLSS-NR Min — isolated host proof

# Small, non-PS5 PR gate. Never builds the native console application,
# loads private neural weights or touches main. A tiny public-input Vulkan
# compute witness runs only under a host software driver (Lavapipe).
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r09-dlss-nr-min-host.yml'
      - 'extras/graphics/dlss_nr_min_*.h'
      - 'extras/graphics/test_dlss_nr_min_*.cpp'
      - 'extras/graphics/r09_min_shaders/**'
      - 'extras/graphics/r09_min_vk_spatial_smoke.cpp'
      - 'extras/graphics/r09_min_vk_vit_reuse_smoke.cpp'
      - 'extras/graphics/test_dlss_nr_min_vendor_source_guard.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r09-min-host-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  min-host:
    name: R09 Min C++20 + Vulkan synthetic GPU witness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR SHA (no PS5 build)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Sparse fetch exact pinned vendor headers only
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          expected="$(git rev-parse HEAD:vendor)"
          rm -rf vendor
          git -c credential.helper= clone --quiet --filter=blob:none \
            --no-checkout --single-branch --branch main \
            https://github.com/niakw/Prospero.Eden-Encore-vendor.git vendor
          git -C vendor fetch --quiet --depth=1 origin "$expected"
          git -C vendor sparse-checkout set \
            encore-active/eden-vulkan/include
          git -C vendor checkout --quiet --detach "$expected"
          test "$(git -C vendor rev-parse HEAD)" = "$expected"
          test -f vendor/encore-active/eden-vulkan/include/video_core/renderer_vulkan/nr_rdna2_native_graph_schedule.h
      - name: Audit the six actual pinned vendor ViT sources with seven failing mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 extras/graphics/test_dlss_nr_min_vendor_source_guard.py --vendor vendor
          echo R09_MIN_VIT_PINNED_SOURCE_GUARD_NO_PRODUCTION_CHANGES

      - name: C++20 host assertions with GCC and Clang under UBSan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-local/r09-min
          for unit in \
              test_dlss_nr_min_policy \
              test_dlss_nr_min_spatial_math \
                test_dlss_nr_min_spatial_abi \
              test_dlss_nr_min_graph_geometry \
              test_dlss_nr_min_vit_memory_audit \
              test_dlss_nr_min_vit_reuse_plan \
              test_dlss_nr_min_qkv_capacity \
              test_dlss_nr_min_720_route_trial \
              test_dlss_nr_min_720_vit_runtime_capacity; do
            test -f "extras/graphics/${unit}.cpp"
          done
          for cxx in g++ clang++; do
            for unit in \
                test_dlss_nr_min_policy \
                test_dlss_nr_min_spatial_math \
              test_dlss_nr_min_spatial_abi \
                test_dlss_nr_min_graph_geometry \
              test_dlss_nr_min_vit_memory_audit \
              test_dlss_nr_min_vit_reuse_plan \
              test_dlss_nr_min_qkv_capacity \
              test_dlss_nr_min_720_route_trial \
              test_dlss_nr_min_720_vit_runtime_capacity; do
              "$cxx" -std=c++20 -O1 -Wall -Wextra -Werror -UNDEBUG \
                -fsanitize=undefined -fno-sanitize-recover=all \
                -Iextras/graphics -Iheadless \
                -Ivendor/encore-active/eden-vulkan/include \
                "extras/graphics/${unit}.cpp" \
                -o ".build-local/r09-min/${unit}-${cxx}"
              UBSAN_OPTIONS=halt_on_error=1 ".build-local/r09-min/${unit}-${cxx}"
              echo "R09_MIN_HOST_PASS ${unit} ${cxx}"
            done
          done
          echo R09_MIN_HOST_ONLY_PASS_NO_PS5_BUILD_NO_GPU_INFERENCE

      - name: Compile and validate standalone Vulkan 1.1 spatial shaders
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -o Acquire::Retries=3 --no-install-recommends glslang-tools spirv-tools
          for shader in peripheral_pack peripheral_synthetic_delta peripheral_detail_transfer; do
            glslangValidator -V --target-env vulkan1.1 -S comp \
              "extras/graphics/r09_min_shaders/${shader}.comp" \
              -o ".build-local/r09-min/${shader}.spv"
            spirv-val --target-env vulkan1.1 ".build-local/r09-min/${shader}.spv"
            spirv-dis ".build-local/r09-min/${shader}.spv" \
              > ".build-local/r09-min/${shader}.spvasm"
            grep -Eq 'OpExecutionMode .* LocalSize 8 8 1' \
              ".build-local/r09-min/${shader}.spvasm"
            for offset in '0 Offset 0' '1 Offset 8' '2 Offset 16' '3 Offset 24'; do
              grep -Fq "$offset" ".build-local/r09-min/${shader}.spvasm"
            done
            if grep -Eq 'OpCapability (CooperativeMatrix|RayTracingKHR)' \
                ".build-local/r09-min/${shader}.spvasm"; then
              echo "Unsupported NVIDIA/RTX shader capability"; exit 1
            fi
            echo "R09_MIN_SPIRV_PASS ${shader}"
          done

      - name: Execute actual Vulkan pack/detail-transfer under Lavapipe
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -o Acquire::Retries=3 --no-install-recommends libvulkan-dev mesa-vulkan-drivers
          icd="$(dpkg -L mesa-vulkan-drivers |
            grep -E '/[^/]*(lvp|lavapipe)[^/]*[.]json$' | head -n 1 || true)"
          test -n "$icd" && test -f "$icd"
          export VK_ICD_FILENAMES="$icd"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -UNDEBUG \
            -Iextras/graphics \
            extras/graphics/r09_min_vk_spatial_smoke.cpp -lvulkan \
            -o .build-local/r09-min/vk-spatial-readback
          for shape in square widescreen; do
            for mode in positive identity; do
              args=()
              if [[ "$shape" == widescreen ]]; then args+=(--widescreen); fi
              if [[ "$mode" == identity ]]; then args+=(--identity); fi
              .build-local/r09-min/vk-spatial-readback \
                .build-local/r09-min/peripheral_pack.spv \
                .build-local/r09-min/peripheral_synthetic_delta.spv \
                .build-local/r09-min/peripheral_detail_transfer.spv \
                "${args[@]}"
            done
          done
          echo R09_MIN_HOST_VULKAN_GPU_READBACK_4_SHAPES_MODES_PASS

      - name: Execute eight synthetic ViT dispatches with reused buffers
        shell: bash
        run: |
          set -euo pipefail
          glslangValidator -V --target-env vulkan1.1 -S comp \
            extras/graphics/r09_min_shaders/vit_synthetic_reuse.comp \
            -o .build-local/r09-min/vit_synthetic_reuse.spv
          spirv-val --target-env vulkan1.1 \
            .build-local/r09-min/vit_synthetic_reuse.spv
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -UNDEBUG \
            -Iextras/graphics -Iheadless \
            -Ivendor/encore-active/eden-vulkan/include \
            extras/graphics/r09_min_vk_vit_reuse_smoke.cpp -lvulkan \
            -o .build-local/r09-min/vk-vit-reuse
          icd="$(dpkg -L mesa-vulkan-drivers |
            grep -E '/[^/]*(lvp|lavapipe)[^/]*[.]json$' | head -n 1 || true)"
          test -n "$icd" && test -f "$icd"
          export VK_ICD_FILENAMES="$icd"
          .build-local/r09-min/vk-vit-reuse \
            .build-local/r09-min/vit_synthetic_reuse.spv
          sudo apt-get install -y -o Acquire::Retries=3 --no-install-recommends vulkan-validationlayers
          R09_MIN_VALIDATE_SYNC=1 .build-local/r09-min/vk-vit-reuse \
            .build-local/r09-min/vit_synthetic_reuse.spv
          # Deliberately unsafe ONLY on the software Vulkan ICD, negative
          # synchronization oracle. Do not inspect corrupted GPU output.
          R09_MIN_VALIDATE_SYNC=1 .build-local/r09-min/vk-vit-reuse \
            .build-local/r09-min/vit_synthetic_reuse.spv \
            --negative-missing-barrier
          echo R09_MIN_VIT_VULKAN_SYNCHRONIZATION_POSITIVE_AND_NEGATIVE_PASS
