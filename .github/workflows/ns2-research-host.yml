              -Ivendor/encore-active/ns2-runtime/hle \
              -Ivendor/encore-active/ns2-runtime/gpu_access_svc \
              -Ivendor/sources/eden/src \
              vendor/encore-active/ns2-runtime/ampere/video_core/ns2_shader_spirv_compile.cpp
          done
      - name: Execute actual Maxwell CFG and IR handoff spy (Clang and GCC)
        shell: bash
        run: |
          set -euo pipefail
          for cxx in clang++ g++; do
            "${cxx}" -std=c++20 -O0 -g0 -DFMT_HEADER_ONLY \
              -Werror -Wno-unused-parameter -pthread \
              -Ibuild-ns2-a64/fmt/include \
              -Ivendor/encore-active/ns2-runtime/ampere \
              -Ivendor/sources/eden/src \
              tools/ns2/test_ampere_maxwell_cfg.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/ir_bridge.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/probe.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/lower_bridge.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/maxwell_image.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/maxwell_environment.cpp \
              vendor/sources/eden/src/shader_recompiler/frontend/maxwell/control_flow.cpp \
              vendor/sources/eden/src/shader_recompiler/frontend/maxwell/decode.cpp \
              vendor/sources/eden/src/shader_recompiler/frontend/maxwell/opcodes.cpp \
              vendor/sources/eden/src/shader_recompiler/frontend/maxwell/indirect_branch_table_track.cpp \
              vendor/sources/eden/src/shader_recompiler/frontend/ir/condition.cpp \
              -o "build-ns2-a64/ampere-cfg-${cxx//+/}"
            "build-ns2-a64/ampere-cfg-${cxx//+/}"
          done
      - name: Syntax-check GMMU shader capture with and without session cache (GCC)
        shell: bash
        run: |
          set -euo pipefail
          for mode in baseline bridge; do
            args=()
            if [[ "$mode" == bridge ]]; then
              args+=(-DEDEN_NS2_VULKAN_SHADER_BRIDGE_EXPERIMENTAL=1)
            fi
            g++ -std=c++20 -fsyntax-only -Wno-unused-parameter "${args[@]}" \
              -Ibuild-ns2-a64/fmt/include \
              -Ivendor/encore-active/ns2-runtime/ampere \
              -Ivendor/encore-active/ns2-runtime/nvdrv_gpu \
              -Ivendor/encore-active/ns2-runtime/hle \
              -Ivendor/sources/eden/src/dynarmic/src \
              -Ivendor/sources/eden/src \
              vendor/encore-active/ns2-runtime/ampere/video_core/native_shader_capture.cpp
          done
      - name: Compile and run Switch 1/2 content-format recognition fixtures
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Ivendor/encore-active/ns2-helpers/include -Ivendor/encore-active/ns2-runtime/metadata \
            tools/ns2/test_content_formats.cpp \
            -o build-ns2-a64/ns2-content-format-test
          build-ns2-a64/ns2-content-format-test
      - name: Compile and run Switch 2 graphics HLE protocol fixtures
        run: python3 tools/check-ns2-graphics-hle-host.py
      - name: P1.3/P4.2 verify real VI2 NVMap handle rollback under allocation failures
        run: python3 -B tools/ns2/check_native_vi2_oom_host.py
      - name: P1.3/P4.2 verify real VI2 vblank event registration under OOM
        run: python3 -B tools/ns2/check_native_vi2_vsync_oom_host.py
      - name: P2.7 prove VI2 release timer initialized before first QueueBuffer
        run: python3 -B tools/ns2/check_native_vi2_present_release_order_host.py
      - name: P1.2 verify GPU 211/214 staged ledger node ownership
        run: python3 -B tools/ns2/check_gpu_worker_staged_ledger_host.py
      - name: P1.2 prevent TIPC 111 registration allocation after NVMap lock
        run: python3 -B tools/ns2/check_gpu_worker_registered_handles_oom_host.py
      - name: P2.7 verify NS2 GPU worker teardown fence on all live GPU objects
        run: python3 -B tools/ns2/check_gpu_worker_teardown_gpu_drain_host.py
      - name: Execute unified ProgramMetadata parser against synthetic Switch 1/2 NPDM
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -O1 -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -ffunction-sections -fdata-sections -Wl,--gc-sections \
            -Ibuild-ns2-a64/fmt/include \
            -Ivendor/encore-active/ns2-helpers/include -Ivendor/encore-active/ns2-runtime/metadata -Ivendor/encore-active/ns2-helpers/include \
            -Ivendor/sources/eden/src/dynarmic/src -Ivendor/sources/eden/src \
            tools/ns2/test_program_metadata.cpp \
            vendor/encore-active/ns2-runtime/metadata/core/file_sys/program_metadata.cpp \
            -o build-ns2-a64/npdm-real-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            build-ns2-a64/npdm-real-test

  research-host:
    name: NS2 parsing and source-owner guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node 24
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 1
      - name: Python syntax
        run: |
          python3 -m py_compile tools/check-ns2-npdm-host.py tools/check-ns2-source-selection.py tools/check-ns2-renderer-selector-host.py tools/ns2_patch_inventory.py
      - name: Patch inventory parser self-test
        run: python3 tools/ns2_patch_inventory.py --self-test
      - name: Ensure the experimental compiler selectors preserve the PS5/NCZ owners
        run: python3 tools/check-ns2-source-selection.py
      - name: Exercise native NS2 renderer CMake selector fail-closed cases
        run: python3 tools/check-ns2-renderer-selector-host.py
      - name: Run C++20 ACID layout host regressions (Clang and GCC)
        shell: bash
        run: |
          set -euo pipefail
          command -v clang++
          command -v g++
          python3 tools/check-ns2-npdm-host.py
          PATH="/usr/bin:/bin" python3 tools/check-ns2-npdm-host.py
      - name: Test real Dynarmic RETAA/RETAB decoder table
        run: python3 tools/check-ns2-reta-host.py
      - name: Explain scope
        run: |
          echo "Research host checks only: no full Dynarmic, Eden native PS5 build, game or console claims."
