name: P0 PS5 stop-timeout fail-closed policy
on:
  pull_request:
    paths:
      - 'headless/stop_limit.cpp'
      - 'headless/crash_report.cpp'
      - 'headless/main.cpp'
      - 'src/lifecycle.c'
      - 'tools/check-ps5-stop-fail-closed.py'
      - '.github/workflows/p0-stop-fail-closed-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tools/check-ps5-stop-fail-closed.py
