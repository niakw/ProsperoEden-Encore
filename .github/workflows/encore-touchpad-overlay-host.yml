name: Encore touchpad overlay qualification (host only)
on:
  pull_request:
    paths:
      - 'headless/in_game_overlay*.h'
      - 'headless/in_game_overlay_style.h'
      - 'headless/pad.cpp'
      - 'headless/devices.h'
      - 'headless/devices_check.cpp'
      - 'headless/main.cpp'
      - 'headless/graphics.cpp'
      - 'headless/hud.h'
      - 'headless/vulkan_hud.frag'
      - 'headless/vulkan_hud.vert'
      - 'headless/vulkan.cmake'
      - 'headless/prosperoeden/ui/fonts/montserrat-medium.pefont'
      - 'tools/launcher/bake_vulkan_menu_font.py'
      - 'tools/launcher/bake_vulkan_menu_font.cpp'
      - 'tools/launcher/build_noto_subsets.py'
      - 'tools/launcher/noto_fallbacks.json'
      - 'headless/quick_overlay_font.cpp'
      - 'headless/quick_overlay_font.h'
      - 'tools/graphics/build-vulkan-hud-shaders.py'
      - 'headless/vulkan_window_adapt_r08.cpp'
      - 'tools/check-fc27-f06-native-pad-transition-host.py'
      - 'tools/check-ps5-autocontrol-context.py'
      - 'tools/check-overlay-touchpad-source.py'
      - 'tools/check-overlay-i18n.py'
      - 'tools/overlay-style-check.cpp'
      - '.github/workflows/encore-touchpad-overlay-host.yml'
  push:
    branches: [main, fix/overlay-pr28-postmerge]
    paths:
      - 'headless/in_game_overlay*.h'
      - 'headless/in_game_overlay_style.h'
      - 'headless/pad.cpp'
      - 'headless/devices.h'
      - 'headless/devices_check.cpp'
      - 'headless/main.cpp'
      - 'headless/graphics.cpp'
      - 'headless/hud.h'
      - 'headless/vulkan_hud.frag'
      - 'headless/vulkan_hud.vert'
      - 'headless/vulkan.cmake'
      - 'headless/prosperoeden/ui/fonts/montserrat-medium.pefont'
      - 'tools/launcher/bake_vulkan_menu_font.py'
      - 'tools/graphics/build-vulkan-hud-shaders.py'
      - 'headless/vulkan_window_adapt_r08.cpp'
      - 'tools/check-fc27-f06-native-pad-transition-host.py'
      - 'tools/check-ps5-autocontrol-context.py'
      - 'tools/check-encore-ux.py'
      - 'tools/overlay-style-check.cpp'
      - 'tools/check-overlay-touchpad-source.py'
      - '.github/workflows/encore-touchpad-overlay-host.yml'
permissions:
  contents: read
jobs:
  touchpad-overlay-host:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate extracted controller touchpad input against guest controls
        run: python3 -B tools/check-fc27-f06-native-pad-transition-host.py
      - name: Validate immutable prelaunch controller mapping
        run: python3 -B tools/check-ps5-autocontrol-context.py
      - name: Validate overlay and Vulkan compositor source contracts
        run: |
          python3 -B tools/check-overlay-touchpad-source.py
          python3 -B tools/check-overlay-i18n.py
      - name: Check 40 launcher palette, accent and contrast combinations
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -Iheadless tools/overlay-style-check.cpp -o /tmp/overlay-style-check
          /tmp/overlay-style-check
      - name: Validate quick-menu fragment GLSL in host-only mode
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends glslang-tools spirv-tools python3-fonttools
          mkdir -p /tmp/eden-hud-generated
          python3 -B tools/launcher/bake_vulkan_menu_font.py \
            --output /tmp/eden-hud-generated/vulkan_menu_font.glsl \
            --map-output /tmp/eden-hud-generated/vulkan_menu_font_map.h \
            --fallback-dir /tmp/eden-hud-generated/noto-fallback
          python3 -B tools/graphics/build-vulkan-hud-shaders.py \
            --glslang "$(command -v glslangValidator)" \
            --spirv-val "$(command -v spirv-val)" \
            --source-dir headless \
            --include-dir /tmp/eden-hud-generated \
            --output /tmp/eden-hud-generated/eden_vulkan_hud_shaders.h \
            --spv-dir /tmp/eden-hud-generated
