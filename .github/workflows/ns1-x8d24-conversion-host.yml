name: NS1 X8D24 Vulkan conversion
on:
  push:
    paths:
      - 'vendor'
      - 'headless/x8d24_conversion.glsl'
      - 'headless/convert_abgr8_to_x8d24.frag'
      - 'headless/convert_x8d24_to_abgr8.frag'
      - 'headless/vulkan.cmake'
      - 'tools/check-ns1-x8d24-conversion-host.py'
      - '.github/workflows/ns1-x8d24-conversion-host.yml'
  pull_request:
    paths:
      - 'vendor'
      - 'headless/x8d24_conversion.glsl'
      - 'headless/convert_abgr8_to_x8d24.frag'
      - 'headless/convert_x8d24_to_abgr8.frag'
      - 'headless/vulkan.cmake'
      - 'tools/check-ns1-x8d24-conversion-host.py'
      - '.github/workflows/ns1-x8d24-conversion-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Install GLSL and SPIR-V validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends glslang-tools spirv-tools
      - name: Validate exact X8D24 runtime owners and compile both shaders
        run: python3 -B tools/check-ns1-x8d24-conversion-host.py --compile
