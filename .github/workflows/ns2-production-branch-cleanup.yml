name: NS2 production branch cleanup (one-shot)
on:
  push:
    branches: [main]
    paths:
      - 'docs/audits/NS2_SOURCE_CLEANUP_TRIGGER_2026-11-11.txt'
permissions:
  contents: write
  pull-requests: read
jobs:
  remove-reviewed-branches:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify production ancestry, closed PRs, then delete only named refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Preserve combined R2/R3/R4 research PRs #56 and vendor #45.
          git merge-base --is-ancestor 53a43f02f30fbe4e9772a2e5ce692aa6182b8066 HEAD
          for pr in 44 49 50 51 53; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.state')"
            test "$state" = closed || { echo "PR $pr not closed ($state)"; exit 1; }
          done
          ref="research/ns2-upstream-optimization-audit-20261110"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ref" --jq '.ref' >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref" >/dev/null
            echo "Deleted $ref"
          fi
          ref="research/ns2-r2-stage-backing-cmake-20261111"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ref" --jq '.ref' >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref" >/dev/null
            echo "Deleted $ref"
          fi
          ref="research/ns2-r3-gob16-cmake-selection-20261110"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ref" --jq '.ref' >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref" >/dev/null
            echo "Deleted $ref"
          fi
          ref="research/ns2-r4-volume-active-native-20261111"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ref" --jq '.ref' >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref" >/dev/null
            echo "Deleted $ref"
          fi
          ref="fix/r457-launcher-ux-console-20261111"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ref" --jq '.ref' >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref" >/dev/null
            echo "Deleted $ref"
          fi
          ref="research/r457-console-boot-blockers-20261111"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ref" --jq '.ref' >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref" >/dev/null
            echo "Deleted $ref"
          fi
          ref="research/r457-ns2-sparse-physical-runtime-20261111"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ref" --jq '.ref' >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref" >/dev/null
            echo "Deleted $ref"
          fi
          ref="integration/ns2-main-production-20261111"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ref" --jq '.ref' >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref" >/dev/null
            echo "Deleted $ref"
          fi
