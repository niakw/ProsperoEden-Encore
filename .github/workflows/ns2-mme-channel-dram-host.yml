name: NS2 channel-shared MME data RAM (host only)

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  mme-channel-dram:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
      - name: Verify native channel owner selects one shared MME data RAM
        run: python3 -B tools/check-ns2-native-gpfifo-fd-scope.py
      - name: Execute real TU104 MME 3D-to-Compute sharing and channel isolation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-ns2-mme
          for cxx in clang++ g++; do
            "$cxx" -std=c++20 -O1 -Wall -Wextra -Werror \
              -fsanitize=undefined -fno-sanitize-recover=all \
              -Ivendor/encore-active/eden/src \
              tools/ns2/test_ampere_turing_macro.cpp \
              -o "build-ns2-mme/mme-channel-${cxx//+/}"
            "build-ns2-mme/mme-channel-${cxx//+/}"
          done
          echo "NS2_MME_CHANNEL_DRAM_HOST_PASS shared_3d_compute=1 isolated_channels=1 rollback=1"
