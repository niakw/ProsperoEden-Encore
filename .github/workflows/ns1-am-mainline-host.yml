name: NS1 AM/HID active source test against main

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  source-and-behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout main and current vendor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Verify active vendor and AM/HID mock sanitizer tests
        run: |
          set -euo pipefail
          python3 -B tools/check-active-cmake-source-boundary.py
          python3 -B tools/audit/check-r23-controller-applet-host.py
          python3 -B tools/audit/check-r23-am-applets-host.py
          echo "Host source and mock ASan/UBSan only; no PS5 guest execution." >> "$GITHUB_STEP_SUMMARY"
