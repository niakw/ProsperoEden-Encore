name: P0 consolidated vendor diagnostics engine pair
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selected-vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Verify exact selected graph and focused host contracts
        run: |
          set -euo pipefail
          expected=5336659f7ccce1b378bae78587ae5592a11a61f6
          selected="$(git rev-parse HEAD:vendor)"
          checked="$(git -C vendor rev-parse HEAD)"
          test "$selected" = "$expected"
          test "$checked" = "$expected"
          test "$(git -C vendor hash-object encore-active/ns2-astc/include/video_core/texture_cache/texture_cache.h)" = c7cb95ecaf388b925fc29582499bbd4b54a77f75
          test "$(git -C vendor hash-object tests/ns1_r23_18_tir_host.py)" = 753df3ca146cba983057801df36dcf9db0b5fc6b
          test "$(git -C vendor hash-object tests/fc27_deferred_page_protection_host.py)" = 9138b47b504e0fa8ea41c03f7c726787990e5260
          test "$(git -C vendor hash-object encore-active/ns2-helpers/include/core/loader/ns2_svc_trace.h)" = 86e8e7e96b5eda5b6b98ccd3c7e6ce76d4275c86
          test "$(git -C vendor hash-object encore-active/ns2-runtime/gpu_access_svc/core/hle/kernel/svc.cpp)" = 09ae2494b2b6f620a25ab549c06c69045a9fb73d
          test "$(git -C vendor hash-object tests/ns2_recent_svc_fault_trace_host.py)" = 79d8d7294e37e141d6c669d9b55fa5a02d94287e
          test "$(git -C vendor hash-object encore-active/eden-core/src/core/file_sys/romfs_factory.cpp)" = 4775cf98c3bfbc587402928bad424dcb471047a0
          test "$(git -C vendor hash-object tests/ns2_romfs_program_index_fallback_host.py)" = abac08b40623febec02c58d2703b4ec3676b88f0
          test "$(git -C vendor hash-object encore-active/ns2-runtime/gpu_dispatch/video_core/control/channel_state.cpp)" = dd30183f72a9a9dfc2a17700db263f85e4d77596
          python3 -B vendor/tests/ns2_romfs_program_index_fallback_host.py
          test "$(git -C vendor hash-object encore-active/eden-vulkan/vulkan_rasterizer.cpp)" = 49e7a97dfafffe8b5433b4c77bcc1b8ce0800cbb
          python3 -B vendor/tests/native_msaa_attribute_handle_rebind_host.py
          python3 -B vendor/tests/r457_native_emit_invalid_warning_host.py
          python3 -B vendor/tests/p0_guest_fault_context_source.py
          python3 -B vendor/tests/p0_mkw_blocking_boundaries_source.py
          python3 -B vendor/tests/fc27_ssa_definition_storage_host.py
          python3 -B vendor/tests/fc27_ssbo_search_pruning_host.py
          python3 -B vendor/tests/ps5_ir_bfs_adaptive_host.py
          python3 -B tools/check-fc27-prmt-engine-selection.py
          python3 -B vendor/tests/fc27_maxwell_prmt_operand_forms_source.py
          python3 -B vendor/tests/fc27_cpu_write_download_race_host.py
          python3 -B vendor/tests/fc27_gpu_page_sibling_preservation_host.py
          test ! -e vendor/encore-active/eden-core/overrides/core/deferred_cached_updates.h
          python3 -B vendor/tests/fc27_deferred_page_protection_host.py
          python3 -B vendor/tests/ns2_dynamic_texture_found_bit_limit_host.py
          python3 -B vendor/tests/ns2_duskbloods_tld4_imad_host.py
          python3 -B vendor/tests/ns2_ampere_hsetp2_cbuf_host.py
          python3 -B vendor/tests/ns2-kprocess-memory-budget-source.py
          python3 -B vendor/tests/ns2_alias_64g_upstream_parity_host.py
          python3 -B vendor/tests/ns2_a64_v81_v85_source.py
          python3 -B vendor/tests/ns2_qmd_rejected_dispatch_release_host.py
          python3 -B vendor/tests/ns2_ldsm_m88_modes_host.py
          python3 -B vendor/tests/shader_bitfield_uextract_fold_host.py
          python3 -B vendor/tests/ns2_getinfo_page_size_source.py
          python3 -B vendor/tests/ns2_getinfo_vamm_region_source.py
          python3 -B vendor/tests/ps5-late-upstream-fixes-source.py
          python3 -B vendor/tests/ps5-full-clear-skip-upload-source.py
          python3 -B vendor/tests/vulkan_static_pipeline_cache_source.py
          python3 -B vendor/tests/shutdown_teardown_lifetime_source.py
          python3 -B vendor/tests/shutdown_general_channel_lifetime_source.py
          python3 -B vendor/tests/fc27_waited_pipeline_inline_source.py
          python3 -B vendor/tests/fc27_pipeline_teardown_and_syncwait_source.py
          python3 -B vendor/tests/ps5_host1x_wait_notification_host.py
          python3 -B vendor/tests/ns2_gpu_partition_new_sdk_source.py
          python3 -B vendor/tests/ns2_syncpt_bootstrap_source.py
          python3 -B vendor/tests/ns2_recent_svc_fault_trace_host.py
          python3 -B vendor/tests/ns2_ipc_started_thread_handoff_source.py
          python3 -B vendor/tests/ns2_gpu_access_svc_info_types_source.py
          python3 -B vendor/tests/ns2_gpu_identity_mapping_source.py
          python3 -B vendor/tests/ns2_nvhost_unknown_node_fallback_source.py
          python3 -B vendor/tests/ns2_smmu_34bit_capacity_source.py
          python3 -B vendor/tests/ns2_syncpoint_shim_source.py
          python3 -B tools/ns2/check_native_gpu_worker_sparse_ipc_host.py
          python3 -B tools/check-ns2-source-selection.py
          python3 -B vendor/tests/ns2_font_service_source.py
          python3 -B vendor/tests/ns2_backport_manifest_preserved_source.py
          python3 -B vendor/tests/ns2_sw_blitter_native_tiling_source.py
          python3 -B vendor/tests/ns2_native_tiling_activation_source.py
          python3 -B vendor/tests/fc27_release_npad_detailed_source.py
          echo ENCORE_VENDOR_P0_CONSOLIDATED_ENGINE_PAIR_PASS
