name: Prepare Encore R2 release draft (no build or assets)
on:
  push:
    branches:
      - release/encore-r2-draft-20261109
    paths:
      - 'docs/releases/ENCORE_R2_DRAFT_2026-11-09.md'
      - '.github/workflows/prepare-encore-r2-draft.yml'
permissions:
  contents: write
jobs:
  create-private-draft:
    name: Create hidden prerelease draft from approved notes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout draft release notes only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Create draft prerelease without assets or PS5 build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET_SHA: '94602df5b6b510c2e1c37978d359452ad51ec968'
          RELEASE_TAG: 'encore-R2-preview-20261109'
        shell: bash
        run: |
          set -euo pipefail
          # GitHub gives an unpublished draft a temporary "untagged-..." URL.
          # Looking it up by tag returns 404 until publication: select the ID
          # from the authenticated release collection instead.
          existing_id="$(gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "encore-R2-preview-20261109") | .id' | head -n 1)"
          if [[ -z "$existing_id" ]]; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_TARGET_SHA" \
              --title 'Eden Encore R2 Preview — post-R1 development (draft)' \
              --notes-file docs/releases/ENCORE_R2_DRAFT_2026-11-09.md \
              --draft --prerelease
            existing_id="$(gh api "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select(.tag_name == "encore-R2-preview-20261109") | .id' | head -n 1)"
          fi
          test -n "$existing_id"
          status="$(gh api "repos/$GH_REPO/releases/$existing_id" --jq '.draft')"
          if [[ "$status" != "true" ]]; then
            echo "::error::Refusing to touch an already-published release"
            exit 1
          fi
          gh api -X PATCH "repos/$GH_REPO/releases/$existing_id" \
            -f name='Eden Encore R2 Preview — post-R1 development (draft)' \
            -f body="$(cat docs/releases/ENCORE_R2_DRAFT_2026-11-09.md)" \
            -F draft=true -F prerelease=true >/dev/null
          result="$(gh api "repos/$GH_REPO/releases/$existing_id")"
          printf '%s' "$result" | jq -e '.draft == true and .prerelease == true and (.assets | length) == 0 and .tag_name == "encore-R2-preview-20261109"' >/dev/null
          printf '%s' "$result" | jq '{id, tag_name, draft, prerelease, assets_count:(.assets|length), html_url}'
