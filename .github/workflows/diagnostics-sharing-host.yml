name: Diagnostics sharing host contract (no PS5 build)
on:
  pull_request:
    paths:
      - 'headless/diagnostics_sharing_policy.h'
      - 'headless/diagnostics_report_queue.h'
      - 'headless/CMakeLists.txt'
      - 'headless/prosperoeden/eden_services.h'
      - 'headless/prosperoeden/eden_services.cpp'
      - 'headless/prosperoeden/frontend.cpp'
      - 'headless/diagnostics_native_client.cpp'
      - 'headless/diagnostics_native_client.h'
      - 'tools/diagnostics/**'
      - 'headless/settings_store.h'
      - '.github/workflows/diagnostics-sharing-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tools/diagnostics/test_diagnostic_report_projection.py
      - run: python3 -B tools/diagnostics/check_native_client_source.py
      - run: |
          c++ -std=c++20 -Wall -Wextra -Werror -Iheadless tools/diagnostics/test_report_queue.cpp -o /tmp/diagnostics-queue-host
          /tmp/diagnostics-queue-host
