name: NS2 real SPIR-V emitter (research)

on:
  push:
    branches:
      - research/ns2-ps5-compatibility
    paths:
      - 'headless/ns2/ampere/**'
      - 'tools/ns2/test_ampere_real_spirv.cpp'
      - 'tools/check-ns2-spirv-host.py'
      - '.github/workflows/ns2-research-spirv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maxwell-spirv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 1
      - name: Install pinned SPIR-V compiler and validator dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libboost-dev spirv-tools
          mkdir -p build-ns2-deps
          git clone --depth 1 --branch 12.1.0 https://github.com/fmtlib/fmt.git build-ns2-a64/fmt
          test "$(git -C build-ns2-a64/fmt rev-parse HEAD)" = "407c905e45ad75fc29bf0f9bb7c5c2fd3475976f"
          git clone --depth 1 --branch v1.0.5 https://github.com/eden-emulator/sirit.git build-ns2-deps/sirit
          test "$(git -C build-ns2-deps/sirit rev-parse HEAD)" = "b870b062998244231a4f08004d3b25151732c5c5"
          git clone --depth 1 --branch vulkan-sdk-1.4.341.0 https://github.com/KhronosGroup/SPIRV-Headers.git build-ns2-deps/spirv-headers
          test "$(git -C build-ns2-deps/spirv-headers rev-parse HEAD)" = "04f10f650d514df88b76d25e83db360142c7b174"
      - name: Compile real SPIR-V emitter and validate direct/dispatcher graphics shaders
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check-ns2-spirv-host.py
