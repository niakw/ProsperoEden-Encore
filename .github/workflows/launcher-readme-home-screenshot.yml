name: Publish authentic Encore Home screenshot

on:
  push:
    branches: [dev/ps5-sparse-jit]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: encore-readme-home-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-home:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[preview-ready]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout authentic launcher sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: true

      - name: Install software renderer and screenshot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3-pil libegl1-mesa-dev libgl1-mesa-dev libstb-dev nlohmann-json3-dev mesa-utils libgl1-mesa-dri ca-certificates git pkg-config

      - name: Verify the original Eden Encore wallpaper is packaged
        run: |
          test -s assets/encore-background.jpg
          test -s headless/prosperoeden/ui/art/backdrop.tga
          test "$(stat -c %s headless/prosperoeden/ui/art/backdrop.tga)" -ge 1000000
          grep -Fq 'load("art/backdrop.tga", &backdrop_)' headless/prosperoeden/pe/ui/textures.cpp
          grep -Fq 'PE_PREVIEW_BRANDED_HOME' headless/prosperoeden/host/fake_services.cpp

      - name: Render the authentic Encore C++ and OpenGL home screen in English
        env:
          PE_LANG: en-US
          PE_PREVIEW_BRANDED_HOME: "1"
          PE_PREVIEW_HOME_ONLY: "1"
          PE_PREVIEW_JOBS: "2"
          PROSPEROEDEN_LAUNCHER_BUILD: ${{ runner.temp }}/encore-readme-home
        run: |
          bash tools/launcher/preview.sh build/readme-home 1920 1080
          test -s build/readme-home/01-home.png
          # The old screenshot retained synthetic sunset scenery after an
          # async Game media scan even when Home::home() cleared the hero.
          # Validate the source itself was never created for this render.
          test ! -e build/readme-home/preview-hero.tga
          echo "EDEN_ORIGINAL_WALLPAPER_PREVIEW_NO_SYNTHETIC_HERO: PASS"

      - name: Verify the real screenshot and replace READMEs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat, ImageChops
          import re
          import shutil
          # Brand image is the USER-SUPPLIED source: assets/encore-background.jpg
          # -> packaged ui/art/backdrop.tga -> production Backdrop::draw().
          # The host-only branded fixture removes synthetic hero overlays.
          assert Path("assets/encore-background.jpg").stat().st_size > 100_000
          assert Path("headless/prosperoeden/ui/art/backdrop.tga").stat().st_size > 1000000
          screenshot = Path("build/readme-home/01-home.png")
          with Image.open(screenshot) as raw:
              assert raw.format == "PNG" and raw.size == (1920, 1080)
              rgb = raw.convert("RGB")
              assert max(ImageStat.Stat(rgb).stddev) > 22, "Unexpected blank Home capture"
              assert rgb.getbbox()
          # A new path also invalidates GitHub's CDN/browser cached preview.
          # Compare against the old capture that user reported as wrong.
          previous_capture = Path("assets/screenshots/encore-home.png")
          published = Path("assets/screenshots/eden-encore-home-wallpaper-en.png")
          if previous_capture.exists():
              with Image.open(previous_capture) as previous:
                  old = previous.convert("RGB").resize((1920, 1080))
                  # Compare the BACKGROUND region, not whole-frame text.
                  # Earlier CI passed because English text changed while the
                  # synthetic scenery behind it stayed effectively identical.
                  viewport = (1100, 130, 1840, 750)
                  changed = ImageStat.Stat(ImageChops.difference(
                      rgb.crop(viewport), old.crop(viewport))).mean
                  print("EDEN_WALLPAPER_BACKGROUND_REGION_CHANGE", changed)
                  assert max(changed) > 9.0, (
                      "Original Eden wallpaper still hidden by the synthetic Home hero",
                      changed)
          published.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(screenshot, published)
          alt = ("Eden Encore Home in English, showing the original Eden wallpaper "
                 "from the actual C++/OpenGL launcher")
          for filename in ("README.md", "README.fr.md"):
              path = Path(filename)
              source = path.read_text(encoding="utf-8")
              pattern = (r'<p align="center"><img src="assets/'
                         r'(?:encore-background\.jpg|screenshots/(?:encore-home|eden-encore-home-wallpaper-en)\.png)"'
                         r' alt="[^"]+" width="860"></p>')
              new = ('<p align="center"><img src="assets/screenshots/eden-encore-home-wallpaper-en.png"'
                     f' alt="{alt}" width="860"></p>')
              source, count = re.subn(pattern, lambda _: new, source)
              assert count == 1, (filename, "expected exactly one known Encore Home preview", count)
              path.write_text(source, encoding="utf-8")
          print("REAL_EDEN_WALLPAPER_ENGLISH_HOME_SCREENSHOT_PREPARED")
          PY

      - name: Persist real Home capture and README links on the same branch
        if: ${{ github.ref == 'refs/heads/dev/ps5-sparse-jit' }}
        run: |
          git add assets/screenshots/eden-encore-home-wallpaper-en.png README.md README.fr.md
          if git diff --cached --quiet; then
            echo "Native screenshot is unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "docs(ui): capture English Home with original Eden wallpaper [skip ci]"
          git push origin HEAD:dev/ps5-sparse-jit
