name: One-shot compile pinned Encore Overrides C++ snapshot
on:
  push:
    branches: [feat/overrides-compiled-catalog-95f21ed]
    paths:
      - '.github/workflows/one-shot-compile-overrides-snapshot.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'niakw/ProsperoEden-Encore'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Compile exact 9460-profile source into native C++ and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/sync-encore-overrides.py \
            --source vendor/sources/encore-overrides \
            --output headless/encore_overrides_generated.h
          python3 -B tools/check-vendored-overrides.py
          cat > /tmp/encore-override-snapshot.cpp <<'CPP'
          #include "headless/encore_overrides_generated.h"
          static_assert(Eden::EncoreOverrides::kAuthoredProfileCount == 4);
          static_assert(Eden::EncoreOverrides::kDatabaseRevision >= 7);
          static_assert(Eden::EncoreOverrides::kTitleProfiles.size() == 468);
          static_assert(Eden::EncoreOverrides::GeneralProfile(1).filter == 1);
          static_assert(Eden::EncoreOverrides::HasSpecificProfile(0x040074A01BF12000ULL));
          static_assert(Eden::EncoreOverrides::HasSpecificProfile(0x0400C3F00006E000ULL));
          static_assert(Eden::EncoreOverrides::HasSpecificProfile(0x0100C49025D3E000ULL));
          static_assert(!Eden::EncoreOverrides::HasSpecificProfile(0x0100000000010000ULL));
          int main() { return 0; }
          CPP
          for cxx in clang++ g++; do
            "$cxx" -std=c++20 -Wall -Wextra -Werror -fsyntax-only -I. /tmp/encore-override-snapshot.cpp
          done
          python3 -B tools/check-video-presets.py
          echo COMPILED_OVERRIDES_PROFILE_ABI_PASS
      - name: Publish only generated headers to integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- headless/encore_overrides_generated.h
          if test -f headless/glyph_overrides_generated.h; then
            git add -- headless/glyph_overrides_generated.h
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(overrides): regenerate compiled FSR1 and 467 native NS2 profiles'
          git push origin HEAD:refs/heads/feat/overrides-compiled-catalog-95f21ed
