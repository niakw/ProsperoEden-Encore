name: R457 native MSAA texture-handle pair (host only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Verify exact engine gitlink and selected rasterizer regression
        run: |
          set -eu
          selected="$(git rev-parse HEAD:vendor)"
          test "$selected" = "$(git -C vendor rev-parse HEAD)"
          test "$(git -C vendor hash-object encore-active/eden/src/video_core/renderer_vulkan/vulkan_rasterizer.cpp)" = "01c6880e5a8836da45601b0a3cb7c0fd6c46cf35"
          python3 -B vendor/tests/native_msaa_attribute_handle_rebind_host.py
          python3 -B vendor/tests/fc27_gpu_page_sibling_preservation_host.py
          python3 -B vendor/tests/fc27_deferred_page_protection_host.py
          echo "ENCORE_R457_MSAA_ENGINE_VENDOR_PAIR_PASS"
