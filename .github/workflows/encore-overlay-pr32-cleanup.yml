name: One-shot cleanup of merged Encore overlay branches
on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/encore-overlay-pr32-cleanup.yml'
permissions:
  contents: read
jobs:
  remove-merged-overlay-branches:
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.number == 32 && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'fix/overlay-pr28-postmerge') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete only the unchanged PR28 and PR32 heads (idempotent)
        shell: bash
        run: |
          set -euo pipefail
          for branch in feat/dualsense-touchpad-encore-overlay fix/overlay-pr28-postmerge; do
            if [[ "$branch" == feat/* ]]; then
              expected=5c1a0dfe4f97cbc83b04d390a17a9e9660a5752d
            else
              expected=5413ea7b11277ee691119fb86282865d201d52f7
            fi
            if ! current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null)"; then
              echo "Already absent: $branch"
              continue
            fi
            if [[ "$current" != "$expected" ]]; then
              echo "Ref moved; refusing to delete $branch ($current != $expected)" >&2
              exit 1
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted $branch at $expected"
          done
