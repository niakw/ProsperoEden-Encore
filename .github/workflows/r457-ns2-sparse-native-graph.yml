name: R457 NS2 sparse native CMake + real C++ syntax (no app build)
on:
  pull_request:
    paths:
      - '.github/workflows/r457-ns2-sparse-native-graph.yml'
      - 'tools/ns2/check_r457_sparse_native_graph.py'
      - 'src/ns2_sparse_guest.cpp'
      - 'src/host_memory.cpp'
      - 'headless/CMakeLists.txt'
      - vendor
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Supersede only an older revision of this PR/ref. Independent reviewed
  # candidate branches must not cancel each other at cache or syntax steps.
  group: r457-sparse-real-cmake-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-three-source-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PROSPEROEDEN_GIT_DEPS_ROOT: .deps/repos
      PROSPEROEDEN_DEPS_OFFLINE: '1'
    steps:
      - name: Checkout sparse production and production NS2 vendor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Restore exact cached native compile graph
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/prosperoeden-deps
            ~/.cache/ps5-eden-headless.*
            ~/.cache/prosperoeden-mkpfs
            .deps
          # The single historical run-specific cache may be expired.
          # Fall back only to compatible native dependency caches published by
          # the actual build workflow; keep the strict real build.ninja proof.
          key: prospero-eden-encore-040-Linux-fc370fe9ce80cd597292415e2be5ec6a07a034248d03b6fd2f8cc2be59ef6d3e-42924336057
          restore-keys: |
            prospero-eden-encore-040-Linux-fc370fe9ce80cd597292415e2be5ec6a07a034248d03b6fd2f8cc2be59ef6d3e-
            prospero-eden-encore-040-Linux-
            prosperoeden-040-zbic-Linux-
      - name: Configure genuine native source and syntax-check selected sparse and storage TUs
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "$HOME/.cache" -path '*/native-local/build.ninja' -type f | wc -l)" -eq 1
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang-18 libclang-18-dev lld-18 llvm-18 llvm-18-dev llvm-18-tools \
            llvm-spirv-18 libllvmspirvlib-18-dev cmake ninja-build ccache make \
            nasm meson rsync git glslang-tools spirv-tools bison flex autoconf \
            python3 python3-venv python3-pip python3-mako python3-yaml pkg-config \
            libboost-container-dev libssl-dev libzstd-dev
          bash tools/ci/link-sibling-deps.sh
          test -s ../mihawk-vulkan-review/.deps/native/radv-release/lib/libvulkan_radeon.ps5.a
          python3 -B tools/isolate-radv.py
          bash tools/build-agc-driver-stub.sh
          python3 -m pip install --user --break-system-packages "meson==1.12.1"
          export PATH="$HOME/.local/bin:$PATH"
          bash tools/build-opengl-sdk.sh
          native="$(dirname "$(find "$HOME/.cache" -path '*/native-local/build.ninja' -type f -print -quit)")"
          scratch="$(dirname "$native")"
          test -f "$scratch/source/CMakeLists.txt"
          export PS5_PAYLOAD_SDK="$scratch/sdk"
          export EDEN_NATIVE_C_DEPS="$scratch/cdeps"
          # Some recovered historic caches contain libc++ but omit the
          # FreeBSD C headers. Restore ONLY missing C headers from the
          # existing exact pinned PS5 SDK fork; never use Linux libc.
          sdk_c_include="$PS5_PAYLOAD_SDK/target/include"
          if [[ ! -s "$sdk_c_include/stdlib.h" ]]; then
            sdk_fork="$GITHUB_WORKSPACE/../mihawk-sdk-review"
            test "$(git -C "$sdk_fork" rev-parse HEAD)" = "95c08f27386fc698f6bbe21dde3030140a41d10b"
            test -s "$sdk_fork/include/freebsd/stdlib.h"
            mkdir -p "$sdk_c_include"
            rsync -a --ignore-existing "$sdk_fork/include/freebsd/." "$sdk_c_include/"
            echo "R457_NATIVE_SDK_C_HEADERS_RESTORED pinned_fork=95c08f27"
          fi
          test -s "$sdk_c_include/stdlib.h"
          test -s "$sdk_c_include/sys/cdefs.h"
          test -s "$PS5_PAYLOAD_SDK/target/include/c++/v1/cstdlib"
          # Reconfigure with the same PS5 dependency roots/profile as the
          # actual native builder. The minimal cached reconfigure picked up
          # -isystem /usr/include from host package discovery (not PS5 libc).
          export PKG_CONFIG_LIBDIR="$scratch/empty-pkgconfig"
          export PKG_CONFIG_PATH=
          mkdir -p "$PKG_CONFIG_LIBDIR"
          cmake -S "$scratch/source" -B "$native" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/headless/ps5.cmake" \
            -DPS5_NATIVE=ON -DCMAKE_BUILD_TYPE=Release -DENABLE_LTO=OFF \
            -DCMAKE_PROJECT_yuzu_INCLUDE="$GITHUB_WORKSPACE/headless/inject.cmake" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DEDEN_PS5_VULKAN=ON -DEDEN_VULKAN_DRIVER=RADV \
            -DCMAKE_FIND_USE_SYSTEM_ENVIRONMENT_PATH=ON \
            -DENABLE_QT=OFF -DYUZU_CMD=OFF -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_TESTS=OFF -DBUILD_TESTING=OFF -DENABLE_OPENGL=ON -DEDEN_PS5_OPENGL=ON \
            -DENABLE_CUBEB=OFF -DENABLE_WEB_SERVICE=OFF -DENABLE_LIBUSB=OFF \
            -DYUZU_CRASH_DUMPS=OFF -DYUZU_USE_EXTERNAL_FFMPEG=OFF \
            -DFFMPEG_DIR="$scratch/ffmpeg-native/install" \
            -DOPENSSL_INCLUDE_DIR="$scratch/cdeps/include" \
            -DOPENSSL_SSL_LIBRARY="$scratch/cdeps/lib/libssl.a" \
            -DOPENSSL_CRYPTO_LIBRARY="$scratch/cdeps/lib/libcrypto.a" \
            -DOpenSSL_FORCE_SYSTEM=ON -DZLIB_INCLUDE_DIR="$scratch/cdeps/include" \
            -DZLIB_LIBRARY="$scratch/cdeps/lib/libz.a" -DENABLE_WERROR=OFF \
            -Dzstd_FORCE_BUNDLED=ON -DBoost_FORCE_BUNDLED=ON -Dfmt_FORCE_BUNDLED=ON \
            -DDYNARMIC_ENABLE_NO_EXECUTE_SUPPORT=ON -DDYNARMIC_IGNORE_ASSERTS=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_OPENGL=OFF -DSDL_OPENGLES=OFF \
            -DSDL_RENDER=OFF -DSDL_GPU=OFF
          python3 -B tools/ns2/check_r457_sparse_native_graph.py "$native"
