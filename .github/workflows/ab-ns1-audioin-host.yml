name: A/B NS1 AudioIn isolated host verification

on:
  pull_request:
    paths:
      - "headless/audio.cpp"
      - "headless/audio_device_session_ps5.cpp"
      - "headless/CMakeLists.txt"
      - "headless/audio_in_silence.h"
      - "headless/main.cpp"
      - "tests/ab_ns1_audioin_silence_host.cpp"
      - "tools/audit/check-ab-ns1-audioin-timeline-host.py"
      - "tools/audit/check-ab-ns1-guest-release-host.py"
      - ".github/workflows/ab-ns1-audioin-host.yml"
  workflow_dispatch:
  push:
    branches:
      - dev/ab-ns1-corrective-batches-2026-11-10
    paths:
      - ".github/workflows/ab-ns1-audioin-host.yml"
      - "headless/audio.cpp"
      - "headless/audio_in_silence.h"
      - "headless/audio_device_session_ps5.cpp"
      - "headless/CMakeLists.txt"
      - "tools/audit/check-ab-ns1-audioin-timeline-host.py"
      - "tools/audit/check-ab-ns1-guest-release-host.py"
      - "tests/ab_ns1_audioin_silence_host.cpp"

permissions:
  contents: read

jobs:
  host-silence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout isolated patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Freeze the isolated PR head; pull_request default is a moving merge tree.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify capture-only native routing
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'make_unique<SilentAudioInputStream>(system, channels)' headless/audio.cpp
          grep -Fq 'SetSystemChannels(channels);' headless/audio.cpp
          grep -Fq 'CHECK(input->GetSystemChannels() == channels);' headless/devices_check.cpp
          grep -Fq 'MakeSilentAudioInSamples(samples)' headless/audio.cpp
          grep -Fq 'audio_input_device_id = "ps5";' headless/main.cpp
          grep -Fq 'list(REMOVE_ITEM eden_c00_audio_sources "device/device_session.cpp")' headless/CMakeLists.txt
          grep -Fq 'audio_device_session_ps5.cpp' headless/CMakeLists.txt
          grep -Fq 'IsValidAudioInBufferShape(buffer.size, channel_count)' headless/audio_device_session_ps5.cpp
          grep -Fq 'IsValidVirtualAddressRange(Common::ProcessAddress{buffer.samples}' headless/audio_device_session_ps5.cpp
          grep -Fq 'samples.size() != buffer.size / sizeof(s16)' headless/audio_device_session_ps5.cpp
          if grep -Fq 'make_unique<NullSinkStreamImpl>' headless/audio.cpp; then
            echo "::error::AudioIn must not use an empty capture stream"
            exit 1
          fi

      - name: Compile and execute real silence helper with ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I. tests/ab_ns1_audioin_silence_host.cpp -o /tmp/ab-ns1-audioin-host
          /tmp/ab-ns1-audioin-host
          echo "A_B_NS1_AUDIOIN_HOST_SILENCE_PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "No PS5 compiler, native ELF, or guest memory write is tested." >> "$GITHUB_STEP_SUMMARY"
          
      - name: Compile and run extracted real SilentAudioInputStream host timeline under sanitizers
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/audit/check-ab-ns1-audioin-timeline-host.py
          echo "Extracted native AudioIn class: ASan/UBSan, timed advancement, Stop, resume, Finalize PASS." >> "$GITHUB_STEP_SUMMARY"
          echo "This is not a real guest DeviceSession / PS5 runtime verification." >> "$GITHUB_STEP_SUMMARY"

      - name: Compile and run actual DeviceSession ReleaseBuffer body against bad guest buffers
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/audit/check-ab-ns1-guest-release-host.py
          echo "AudioIn guest release extracted method: valid/invalid lengths, channel and guest span tests under ASan/UBSan PASS." >> "$GITHUB_STEP_SUMMARY"
          echo "Native audio_core compilation and PS5 guest run still required." >> "$GITHUB_STEP_SUMMARY"
