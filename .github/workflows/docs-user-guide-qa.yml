name: Encore user guide locales (documentation only)
on:
  push:
    branches: [main]
    paths:
      - 'docs/i18n/**'
      - 'LANGUAGES.md'
      - 'README.md'
      - 'INSTALL.md'
      - 'SETTINGS.md'
      - 'TROUBLESHOOTING.md'
      - 'SUPPORT.md'
      - 'ACCESSIBILITY.md'
      - '.github/workflows/docs-user-guide-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  user-guide-coverage:
    name: Check 29-language manuals and local links (no build)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout published documentation and locale catalogs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            docs/i18n
            LANGUAGES.md
            README.md
            INSTALL.md
            SETTINGS.md
            TROUBLESHOOTING.md
            SUPPORT.md
            ACCESSIBILITY.md
            headless/prosperoeden/ui/lang
      - name: Validate available languages, localized safety guidance and links
        run: python3 -B docs/i18n/check_user_docs.py
