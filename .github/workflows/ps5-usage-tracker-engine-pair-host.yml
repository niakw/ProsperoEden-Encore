name: PS5 Vulkan usage-tracker engine and vendor selected source (host)

on:
  pull_request:
    paths:
      - "headless/CMakeLists.txt"
      - "tools/check-ps5-usage-tracker-selection-host.py"
      - ".github/workflows/ps5-usage-tracker-engine-pair-host.yml"
  push:
    branches:
      - ci/nov14-buffer-usage-64-vendor-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-paired-buffer-usage:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Checkout exact engine and current vendor gitlink
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Verify exact integrated vendor tracker and host sanitizers
        run: |
          set -euo pipefail
          selected="$(git -C vendor rev-parse HEAD)"
          test "$selected" = "$(git ls-tree HEAD -- vendor | awk '{print $3}')"
          case "$selected" in
            fe9edd661d6f0824c7339865d50aa9cf99cab150|c339fd06f02e42e67d5416ae82194ba619b7ee68|47568425c71d534b72cc966d1500412c9ae4fc16) ;;
            *) echo "Unreviewed integrated vendor graph $selected" >&2; exit 1 ;;
          esac
          test "$(git -C vendor rev-parse HEAD)" = "$(git ls-tree HEAD -- vendor | awk '{print $3}')"
          python3 -B tools/check-ps5-usage-tracker-selection-host.py
          python3 -B vendor/tests/ps5_buffer_usage_granularity_host.py
          python3 -B tools/check-active-source-inventory.py
          python3 -B tools/check-eden-optimization-coverage.py
      - name: Verify historical pinned tracker and frozen F07 oracles
        run: |
          set -euo pipefail
          git -C vendor fetch --no-tags --depth=1 origin 1ec7b429238d1175a76dc94b7c0a7f1c2eb62864
          git -C vendor checkout --detach FETCH_HEAD
          test "$(git -C vendor rev-parse HEAD)" = "1ec7b429238d1175a76dc94b7c0a7f1c2eb62864"
          python3 -B tools/check-ps5-usage-tracker-selection-host.py
          python3 -B tools/check-active-source-inventory.py
          python3 -B tools/check-eden-optimization-coverage.py
      - name: Distinguish native and host testing
        if: always()
        run: |
          echo "Host-source qualification only. Actual PS5 CMake/native compiler, ABI/link, FC27 textures/HUD and shader/texture GPU barriers still require PS5 validation. No engine main gitlink, app binary, or console runtime has changed in this host gate." >> "$GITHUB_STEP_SUMMARY"
