name: PS5 Vulkan UsageTracker active source (host)

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify-buffer-usage:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Checkout engine and current vendor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Verify encore-active owner and host behavior
        run: |
          set -euo pipefail
          python3 -B tools/check-active-cmake-source-boundary.py
          python3 -B tools/check-ps5-usage-tracker-selection-host.py
          python3 -B vendor/tests/ps5_buffer_usage_granularity_host.py
      - name: Boundary
        if: always()
        run: echo "Host-source qualification only; PS5 GPU behavior still requires console validation." >> "$GITHUB_STEP_SUMMARY"
