name: NS1 R23 conditional Phi bindless native shader source owner (host)
on:
  push:
    branches:
      - research/ns1-r23-conditional-phi-native-20261111
  pull_request:
    paths:
      - vendor
      - "headless/CMakeLists.txt"
      - ".github/workflows/ns1-r23-58-phi-native.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coherent-shader-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Check exact research vendor and single shader IR TU
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor rev-parse HEAD)" = "f6ff240f8883d809c1250655aced4cd0b0fb4018"
          python3 -B vendor/tests/ns1_r23_58_conditional_phi.py
          python3 - <<'PY'
          from pathlib import Path
          text=Path('headless/CMakeLists.txt').read_text()
          assert 'list(REMOVE_ITEM eden_r23_phi_units "ir_opt/texture_pass.cpp")' in text
          assert 'list(APPEND eden_r23_phi_units "${EDEN_R23_PHI_CPP}")' in text
          assert 'target_include_directories(shader_recompiler BEFORE PUBLIC "${PORT_BUILD_DIR}/include")' in text
          assert Path('vendor/encore-active/eden-shader/src/shader_recompiler/ir_opt/texture_pass.cpp').is_file()
          assert Path('vendor/encore-active/eden-shader/include/shader_recompiler/frontend/ir/breadth_first_search.h').is_file()
          print('R23_PHI_NATIVE_SINGLE_SOURCE_AND_HEADER_OWNER_PASS')
          PY
