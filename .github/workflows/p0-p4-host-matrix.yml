name: Eden P0-P4 host qualification (sharded)

on:
  # Production qualification follows main after PRs have been merged.
  # No PS5 build or release is scheduled by this host-only matrix.
  push:
    branches: [main]
    paths:
      - 'vendor'
      - 'headless/**'
      # Pure language/catalog edits have a dedicated i18n gate. They do not
      # change the GPU/NS2 source owners, and running full native shards
      # for every locale commit can indefinitely queue genuine H/G tests.
      - '!headless/prosperoeden/ui/lang/**'
      - '!headless/prosperoeden/fr_fr_embedded.h'
      - 'tools/**'
      - '!tools/launcher/launcher.pot'
      - '!tools/launcher/strings.py'
      - '!tools/check-language-runtime.py'
      - 'docs/EDEN_POST_F07_CHANGED_SOURCE_REGISTER_2026-11-08.json'
      # A release sign-off changes its finite acceptance contract without
      # changing executable source. Requalify at the exact resulting SHA.
      - 'docs/NS2_P1_P2_EXIT_CONTRACT.json'
      - '.github/workflows/ns2-p1-p2-exit.yml'
      - '.github/workflows/p0-p4-host-matrix.yml'
  pull_request:
    paths:
      - 'vendor'
      - 'headless/**'
      # Pure language/catalog edits have a dedicated i18n gate. They do not
      # change the GPU/NS2 source owners, and running full native shards
      # for every locale commit can indefinitely queue genuine H/G tests.
      - '!headless/prosperoeden/ui/lang/**'
      - '!headless/prosperoeden/fr_fr_embedded.h'
      - 'tools/**'
      - '!tools/launcher/launcher.pot'
      - '!tools/launcher/strings.py'
      - '!tools/check-language-runtime.py'
      - 'docs/EDEN_POST_F07_CHANGED_SOURCE_REGISTER_2026-11-08.json'
      # A staged R23/C0x vendor patch can invalidate strict source-owner
      # qualification even before a vendor gitlink bump; verify the *PR head*
      # source graph, while production main builds remain a separate workflow.
      - 'docs/audits/patchsets/**'
      - '.github/workflows/p0-p4-host-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every candidate is still tested at its exact SHA, but obsolete
  # intermediate runs never qualify the current main. Supersede them
  # instead of exhausting host runners with outdated P0-P4 matrices.
  # Keep workflow_dispatch distinct so an explicit release qualification
  # is not cancelled by a concurrent source push.
  group: eden-p0-p4-host-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Fast, exact native Vulkan ABI witness. Uses only pinned vendor headers,
  # the runner C++ compiler and syntax-only parsing; no apt installation,
  # PS5 SDK, linking or GPU execution. Catch owner incompatibilities before
  # the much longer sharded host qualification.
  native-vulkan-syntax:
    name: Native Vulkan Task/Mesh C++20 syntax
    runs-on: ubuntu-24.04
    # Hosted Linux runner package mirrors may take several minutes before
    # clang can parse the maintained Vulkan owners. An 8-minute timeout
    # cancelled apt itself and never tested any C++ source.
    timeout-minutes: 20
    steps:
      - name: Checkout exact SHA and pinned vendor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
          persist-credentials: false
          fetch-depth: 1
      # Full-source Vulkan syntax includes FFmpeg codec declarations through
      # the actual Host1x headers. Install just the missing headers, without
      # a redundant apt index refresh or any PS5 binary/build.
      - name: Provide system codec declarations for native Vulkan headers
        run: sudo apt-get install -y -o Acquire::Retries=3 --no-install-recommends libavcodec-dev libavutil-dev libswscale-dev
      - name: Syntax-check maintained native Vulkan sources
        run: python3 -B tools/ns2/check_task_mesh_vulkan_tus_host.py

  host-qualify:
    name: Host qualification shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout exact SHA and pinned vendor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
          persist-credentials: false
          fetch-depth: 1
      - name: Install host-only C++/Vulkan/video test dependencies
        run: |
          set -euo pipefail
          # Hosted images can ship unrelated, intermittently failing external
          # feeds. Only Ubuntu distribution packages are required here.
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'packages.microsoft.com' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          # Bound mirror hangs and retry transient fetch faults instead of
          # leaving one of four otherwise green shards stuck in apt forever.
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update -qq
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 --no-install-recommends clang g++ libboost-dev libvulkan-dev mesa-vulkan-drivers libavcodec-dev libavutil-dev libswscale-dev libfmt-dev libssl-dev libzstd-dev libx11-dev libxcb1-dev libxext-dev libxrandr-dev libwayland-dev
      - name: Run SHA-pinned P0-P4 tests (parallel within shard)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/ns2/qualify_host_batch.py --scope core --jobs 2 --shard '${{ matrix.shard }}/4'
      - name: Preserve per-SHA host receipt, even for failed witnesses
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0-p4-host-${{ github.event.pull_request.head.sha || github.sha }}-shard-${{ matrix.shard }}
          path: .build-local/p4-host-batch-*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  host-receipt:
    name: Verify P4 host SHA and witness coverage
    needs: [native-vulkan-syntax, host-qualify]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact engine and pinned vendor for receipt verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
          persist-credentials: false
          fetch-depth: 1
      - name: Collect the four independently generated host receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: p0-p4-host-${{ github.event.pull_request.head.sha || github.sha }}-shard-*
          path: .build-local/host-receipts/
          merge-multiple: true
      - name: Reject mixed SHA, missing shards and skipped witness paths
        run: |
          # An all-green witness manifest must also have the native Vulkan
          # syntax gate green. The verifier runs after failures to report
          # missing receipts, but must never publish a green result alone.
          test "${{ needs['native-vulkan-syntax'].result }}" = success
          test "${{ needs['host-qualify'].result }}" = success
          python3 -B tools/ns2/aggregate_p4_host_receipts.py --self-test
          python3 -B tools/ns2/aggregate_p4_host_receipts.py
      - name: Upload the verified pair receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0-p4-host-verified-${{ github.event.pull_request.head.sha || github.sha }}
          path: .build-local/p4-host-verified-*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
