name: Vulkan HUD shader — isolated SPIR-V rebuild (short)
on:
  pull_request:
    paths:
      - 'headless/vulkan_hud.frag'
      - 'headless/vulkan_hud.vert'
      - 'headless/vulkan.cmake'
      - 'headless/prosperoeden/ui/fonts/montserrat-medium.pefont'
      - 'tools/launcher/bake_vulkan_menu_font.py'
      - 'tools/launcher/bake_vulkan_menu_font.cpp'
      - 'tools/launcher/build_noto_subsets.py'
      - 'tools/launcher/noto_fallbacks.json'
      - 'headless/quick_overlay_font.cpp'
      - 'headless/quick_overlay_font.h'
      - 'tools/graphics/build-vulkan-hud-shaders.py'
      - 'tools/graphics/test-vulkan-hud-pipelines.cpp'
      - 'headless/window_adapt_pass_r08.h'
      - 'headless/vulkan_blit_screen_r08.cpp'
      - 'headless/vulkan_renderer_r08.cpp'
      - 'headless/vulkan_window_adapt_r08.cpp'
      - 'tools/check-ps5-unified-dynamic-loading-host.py'
      - '.github/workflows/hud-shader-isolated-compile.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'headless/vulkan_hud.frag'
      - 'headless/loading_wordmark.glsl'
      - 'headless/loading_scene.glsl'
      - '.github/workflows/hud-shader-isolated-compile.yml'
permissions:
  contents: read
jobs:
  compile-hud-shader:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install glslang and SPIR-V validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends glslang-tools spirv-tools python3-fonttools libvulkan-dev mesa-vulkan-drivers
      - name: Verify one dynamic native loading scene, not a frozen jacket copy
        run: python3 -B tools/check-ps5-unified-dynamic-loading-host.py
      - name: Build shader from real source, validate bytecode, and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eden-hud-generated
          python3 -B tools/launcher/bake_vulkan_menu_font.py \
            --output /tmp/eden-hud-generated/vulkan_menu_font.glsl \
            --map-output /tmp/eden-hud-generated/vulkan_menu_font_map.h \
            --fallback-dir /tmp/eden-hud-generated/noto-fallback
          python3 -B tools/graphics/build-vulkan-hud-shaders.py \
            --glslang "$(command -v glslangValidator)" \
            --spirv-val "$(command -v spirv-val)" \
            --source-dir headless \
            --include-dir /tmp/eden-hud-generated \
            --output /tmp/eden-hud-generated/eden_vulkan_hud_shaders.h \
            --spv-dir .
          # The loader module must not reference a descriptor or the font atlas.
          spirv-dis vulkan_hud.frag.spv -o /tmp/hud-boot.spvasm
          spirv-dis vulkan_hud.frag.quick.spv -o /tmp/hud-menu.spvasm
          ! grep -q 'DescriptorSet' /tmp/hud-boot.spvasm
          grep -q 'DescriptorSet 0' /tmp/hud-menu.spvasm
          sha256sum headless/vulkan_hud.frag \
            /tmp/eden-hud-generated/vulkan_menu_font.glsl \
            /tmp/eden-hud-generated/eden_vulkan_hud_shaders.h \
            vulkan_hud.frag.spv
          sha256sum vulkan_hud.frag.quick.spv /tmp/eden-hud-generated/vulkan_menu_font_data.h
      - name: Compile exact boot and Unicode pipelines on a real Mesa host driver
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -I/tmp/eden-hud-generated \
            tools/graphics/test-vulkan-hud-pipelines.cpp -lvulkan -o /tmp/eden-hud-pipelines
          ICD="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$ICD"
          VK_ICD_FILENAMES="$ICD" MESA_SHADER_CACHE_DISABLE=true LP_NUM_THREADS=2 timeout 45s /tmp/eden-hud-pipelines
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: current-hud-spv-vulkan1.1
          path: |
            vulkan_hud.frag.spv
            vulkan_hud.frag.quick.spv
          retention-days: 7
