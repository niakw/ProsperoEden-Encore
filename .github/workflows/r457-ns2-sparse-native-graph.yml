name: R457 NS2 sparse native CMake + real C++ syntax (no app build)
on:
  pull_request:
    paths:
      - '.github/workflows/r457-ns2-sparse-native-graph.yml'
      - 'tools/ns2/check_r457_sparse_native_graph.py'
      - 'src/ns2_sparse_guest.cpp'
      - 'src/host_memory.cpp'
      - 'headless/CMakeLists.txt'
      - vendor
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r457-sparse-real-cmake-native
  cancel-in-progress: true
jobs:
  native-three-source-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PROSPEROEDEN_GIT_DEPS_ROOT: .deps/repos
      PROSPEROEDEN_DEPS_OFFLINE: '1'
    steps:
      - name: Checkout sparse research and exact experimental vendor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Restore exact cached native compile graph
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/prosperoeden-deps
            ~/.cache/ps5-eden-headless.*
            ~/.cache/prosperoeden-mkpfs
            .deps
          key: prospero-eden-encore-040-Linux-fc370fe9ce80cd597292415e2be5ec6a07a034248d03b6fd2f8cc2be59ef6d3e-42924336057
      - name: Configure genuine native source and compile three maintained TUs for syntax only
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "$HOME/.cache" -path '*/native-local/build.ninja' -type f | wc -l)" -eq 1
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang-18 libclang-18-dev lld-18 llvm-18 llvm-18-dev llvm-18-tools \
            llvm-spirv-18 libllvmspirvlib-18-dev cmake ninja-build ccache make \
            nasm meson rsync git glslang-tools spirv-tools bison flex autoconf \
            python3 python3-venv python3-pip python3-mako python3-yaml pkg-config \
            libboost-container-dev libssl-dev libzstd-dev
          bash tools/ci/link-sibling-deps.sh
          test -s ../mihawk-vulkan-review/.deps/native/radv-release/lib/libvulkan_radeon.ps5.a
          python3 -B tools/isolate-radv.py
          bash tools/build-agc-driver-stub.sh
          python3 -m pip install --user --break-system-packages "meson==1.12.1"
          export PATH="$HOME/.local/bin:$PATH"
          bash tools/build-opengl-sdk.sh
          native="$(dirname "$(find "$HOME/.cache" -path '*/native-local/build.ninja' -type f -print -quit)")"
          scratch="$(dirname "$native")"
          test -f "$scratch/source/CMakeLists.txt"
          export PS5_PAYLOAD_SDK="$scratch/sdk"
          export EDEN_NATIVE_C_DEPS="$scratch/cdeps"
          cmake -S "$scratch/source" -B "$native" -G Ninja \
            -DCMAKE_PROJECT_yuzu_INCLUDE="$GITHUB_WORKSPACE/headless/inject.cmake" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DEDEN_PS5_VULKAN=ON \
            -DEDEN_RESEARCH_NS2_SPARSE_GUEST_BACKING=ON
          python3 -B tools/ns2/check_r457_sparse_native_graph.py "$native"
