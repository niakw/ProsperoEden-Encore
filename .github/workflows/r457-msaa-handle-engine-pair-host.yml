name: R457 native MSAA texture-handle pair (host only)
on:
  pull_request:
    paths:
      - 'vendor'
      - 'tools/check-vendored-vulkan-fork.py'
      - '.github/workflows/r457-msaa-handle-engine-pair-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Verify exact engine gitlink and selected rasterizer regression
        run: |
          set -eu
          selected="$(git rev-parse HEAD:vendor)"
          test "$selected" = "$(git -C vendor rev-parse HEAD)"
          test "$(git -C vendor hash-object encore-active/eden-vulkan/vulkan_rasterizer.cpp)" = "1c40cc3b968c76fc505f5cea63218b93e89b4529"
          python3 -B vendor/tests/native_msaa_attribute_handle_rebind_host.py
          echo "ENCORE_R457_MSAA_ENGINE_VENDOR_PAIR_PASS"
