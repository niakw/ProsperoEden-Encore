name: Encore touchpad overlay qualification (host only)
on:
  pull_request:
    paths:
      - 'headless/in_game_overlay*.h'
      - 'headless/in_game_overlay_style.h'
      - 'headless/pad.cpp'
      - 'headless/devices.h'
      - 'headless/devices_check.cpp'
      - 'headless/main.cpp'
      - 'headless/graphics.cpp'
      - 'headless/hud.h'
      - 'headless/vulkan_hud.frag'
      - 'headless/vulkan_window_adapt_r08.cpp'
      - 'tools/check-fc27-f06-native-pad-transition-host.py'
      - 'tools/check-ps5-autocontrol-context.py'
      - 'tools/check-overlay-touchpad-source.py'
      - 'tools/overlay-style-check.cpp'
      - '.github/workflows/encore-touchpad-overlay-host.yml'
  push:
    branches: [main, fix/overlay-pr28-postmerge]
    paths:
      - 'headless/in_game_overlay*.h'
      - 'headless/in_game_overlay_style.h'
      - 'headless/pad.cpp'
      - 'headless/devices.h'
      - 'headless/devices_check.cpp'
      - 'headless/main.cpp'
      - 'headless/graphics.cpp'
      - 'headless/hud.h'
      - 'headless/vulkan_hud.frag'
      - 'headless/vulkan_window_adapt_r08.cpp'
      - 'tools/check-fc27-f06-native-pad-transition-host.py'
      - 'tools/check-ps5-autocontrol-context.py'
      - 'tools/check-encore-ux.py'
      - 'tools/overlay-style-check.cpp'
      - 'tools/check-overlay-touchpad-source.py'
      - '.github/workflows/encore-touchpad-overlay-host.yml'
permissions:
  contents: read
jobs:
  touchpad-overlay-host:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate extracted controller touchpad input against guest controls
        run: python3 -B tools/check-fc27-f06-native-pad-transition-host.py
      - name: Validate immutable prelaunch controller mapping
        run: python3 -B tools/check-ps5-autocontrol-context.py
      - name: Validate overlay and Vulkan compositor source contracts
        run: python3 -B tools/check-overlay-touchpad-source.py
      - name: Check 40 launcher palette, accent and contrast combinations
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -Iheadless tools/overlay-style-check.cpp -o /tmp/overlay-style-check
          /tmp/overlay-style-check
      - name: Validate quick-menu fragment GLSL in host-only mode
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends glslang-tools spirv-tools
          glslangValidator -V --target-env vulkan1.1 -S frag \
            -Iheadless headless/vulkan_hud.frag -o /tmp/encore-hud.spv
          spirv-val --target-env vulkan1.1 /tmp/encore-hud.spv
