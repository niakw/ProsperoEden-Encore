name: PS5 native cached CMake graph and focused C++ syntax (no app build)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p5-native-ninja-graph-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout current main with pinned vendor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          fetch-depth: 1

      - name: Restore tenth native run cache for read-only diagnosis
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/prosperoeden-deps
            ~/.cache/ps5-eden-headless.*
            ~/.cache/prosperoeden-mkpfs
            .deps
          key: prospero-eden-encore-040-Linux-fc370fe9ce80cd597292415e2be5ec6a07a034248d03b6fd2f8cc2be59ef6d3e-42887138500

      - name: Inspect exact duplicate output from the cached graph
        if: steps.restore.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t graphs < <(find "$HOME/.cache" -path '*/native-local/build.ninja' -type f -print)
          test "${#graphs[@]}" -eq 1
          graph="${graphs[0]}"
          echo "Cached graph: $graph"
          echo "CACHED_NINJA_GRAPH_SOURCE sha=89e0f8c2bc378fedb849d90dade1e99f3cf8697c"
          echo "Cached tenth build, inspected historical graph context:"
          sed -n '33668,33675p' "$graph" | cut -c 1-1200
          echo "All build statements containing the conflicting Vulkan header:"
          grep -n -F 'fsr31_temporal_upscaler.h' "$graph" | cut -c 1-1800 | head -20 || true
          python3 - "$graph" <<'PY_GRAPH'
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text().splitlines()
          for i, line in enumerate(lines, 1):
              if line.startswith("build ") and "fsr31_temporal_upscaler.h" in line:
                  outputs = line.split(":", 1)[0].split()[1:]
                  repeated = sorted({part for part in outputs if outputs.count(part) > 1})
                  print(f"GRAPH_HEADER_EDGE line={i} outputs={len(outputs)} "
                        f"repeated={repeated[:8]} head={outputs[:6]}")
                  if repeated:
                      print("CACHED_NINJA_DUPLICATE_CONFIRMED", repeated[:3])
          PY_GRAPH
          if ninja -f "$graph" -t targets all >/dev/null 2>&1; then
            echo "CACHED_NINJA_GRAPH_PARSE_OK"
          else
            echo "CACHED_NINJA_GRAPH_PARSE_REJECTED_EXPECTED"
          fi

      - name: Reconfigure cached native source using current main, then parse full Ninja graph
        if: steps.restore.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang-18 libclang-18-dev lld-18 llvm-18 llvm-18-dev llvm-18-tools llvm-spirv-18 libllvmspirvlib-18-dev \
            cmake ninja-build ccache make nasm meson rsync git \
            glslang-tools spirv-tools bison flex autoconf \
            python3 python3-venv python3-pip python3-mako python3-yaml pkg-config \
            libboost-container-dev libssl-dev libzstd-dev
          bash tools/ci/link-sibling-deps.sh
          # The tenth-run cache stores the original pinned RADV archive in
          # .deps, but build/radv-isolated and build/stubs are not cache paths.
          # Materialize those native CMake link inputs without compiling Mesa.
          test -s ../mihawk-vulkan-review/.deps/native/radv-release/lib/libvulkan_radeon.ps5.a
          python3 -B tools/isolate-radv.py
          bash tools/build-agc-driver-stub.sh
          # The audited OpenGL SDK lives under .local/ (not in Actions cache),
          # so restore that real pinned dependency instead of faking an SDK or
          # weakening the native CMake guard. This does NOT compile Encore.
          python3 -m pip install --user --break-system-packages "meson==1.12.1"
          export PATH="$HOME/.local/bin:$PATH"
          bash tools/build-opengl-sdk.sh
          mapfile -t graphs < <(find "$HOME/.cache" -path '*/native-local/build.ninja' -type f -print)
          test "${#graphs[@]}" -eq 1
          graph="${graphs[0]}"
          scratch="$(dirname "$(dirname "$graph")")"
          mkdir -p .local
          printf '%s\n' "$scratch" > .local/headless-cache
          export EDEN_NATIVE_C_DEPS="$scratch/cdeps"
          export PROSPEROEDEN_GIT_DEPS_ROOT=.deps/repos
          export PROSPEROEDEN_DEPS_OFFLINE=1
          test -f "$scratch/source/CMakeLists.txt"
          echo "Reconfiguring cached source (NO native compilation) against current main"
          cmake -S "$scratch/source" -B "$scratch/native-local" -G Ninja \
            -DCMAKE_PROJECT_yuzu_INCLUDE="$GITHUB_WORKSPACE/headless/inject.cmake" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          ninja -C "$scratch/native-local" -t targets all >/dev/null
          echo "CURRENT_MAIN_NATIVE_NINJA_GRAPH_PASS"
          # The tenth full build failed in two TUs; later preflight also exposed
          # a const-mutation and an incomplete FSR3 constructor. Compile all with
          # the exact PS5 target flags/headers, WITHOUT object output or link.
          # The same witnesses are now in the mandatory native preflight.
          python3 -B tools/check-native-source-syntax.py "$scratch/native-local" \
            --only video_core/renderer_vulkan/vk_turbo_mode.cpp \
            --only video_core/renderer_vulkan/vk_texture_cache_base.cpp \
            --only headless/vulkan_blit_screen_r08.cpp \
            --only headless/vulkan_renderer_r08.cpp \
            --only headless/vulkan_window_adapt_r08.cpp \
            --only headless/fsr3_optical_session.cpp
          echo "P5_NATIVE_CXX_FAILURES_REQUALIFIED"
          # Broad PS5 syntax-only sweep: real video_core + maintained Vulkan
          # translation units using the actual native compile_commands.json.
          # Collect all errors in one run; do not produce .o/ELF/ZIP.
          python3 -B tools/ci/preflight-native-video-core-syntax.py \
            "$scratch/native-local" --jobs 4 --max-tus 240
          # No full C++ build, package or release is authorized here.

      - name: Reject missing cache
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          echo "::error::Exact tenth-run cache unavailable; native graph was not inspected"
          exit 1
