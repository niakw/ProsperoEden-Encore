name: NS2 research - external homebrew Vulkan corpus
on:
  workflow_dispatch:
  push:
    branches: [research/ns2-ps5-compatibility]
    paths:
      - 'vendor'
      - ".github/workflows/ns2-research-homebrew.yml"
      - "tools/check-ns2-homebrew-corpus.py"
      - "tools/ns2/test_homebrew_vulkan_corpus.cpp"
      - "tools/ns2/build_public_nso_fixture.py"
      - "tools/ns2/test_nso_preflight.cpp"
      - "vendor/**"
permissions:
  contents: read
concurrency:
  group: ns2-homebrew-${{ github.ref }}
  cancel-in-progress: true
jobs:
  blockfall-vulkan-host:
    name: Pinned Blockfall SPIR-V on Mesa Vulkan (no console)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - name: Install standalone Khronos validation and Vulkan runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential libvulkan-dev mesa-vulkan-drivers spirv-tools
      - name: Offline downloader negative cases
        run: |
          python3 -m py_compile tools/check-ns2-homebrew-corpus.py
          python3 tools/check-ns2-homebrew-corpus.py --self-test
      - name: Fetch original immutable public shader modules; verify Git blobs and SPIR-V
        run: |
          python3 tools/check-ns2-homebrew-corpus.py --output build-ns2-homebrew
      - name: Compile independently owned Vulkan compute and graphics smoke test
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            tools/ns2/test_homebrew_vulkan_corpus.cpp \
            -o build-ns2-homebrew/vulkan-test -lvulkan
      - name: Create both real graphics stages and dispatch original compute shader
        shell: bash
        run: |
          set -euo pipefail
          ICD="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$ICD"
          VK_ICD_FILENAMES="$ICD" \
            build-ns2-homebrew/vulkan-test \
              build-ns2-homebrew/app.vert.spv \
              build-ns2-homebrew/app.frag.spv \
              build-ns2-homebrew/app.comp.spv
          echo "This proves host Vulkan shaders only, NOT native NS2/PS5 games."

  hblauncher-aarch64-abi:
    name: Pinned HBLauncher CPU ABI on host and QEMU AArch64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - name: Install independent native AArch64 ABI test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user
      - name: Fetch only the fixed public HBLauncher source revision
        shell: bash
        run: |
          set -euo pipefail
          SHA="18b4748ba98eeac7df17beb5d3418985eb74897c"
          git init -q build-ns2-hblauncher
          git -C build-ns2-hblauncher fetch -q --depth=1 \
            https://github.com/ravensclawx/HBLauncher.git "$SHA"
          git -C build-ns2-hblauncher checkout -q --detach FETCH_HEAD
          test "$(git -C build-ns2-hblauncher rev-parse HEAD)" = "$SHA"
          test -f build-ns2-hblauncher/tests/abi/build.sh
          test -f build-ns2-hblauncher/LICENSE
      - name: Execute real CPU ABI fixtures in x86 host and QEMU AArch64
        shell: bash
        run: |
          set -euo pipefail
          cd build-ns2-hblauncher
          sh tests/abi/build.sh
          file build/tests/runtime_test_aarch64 build/tests/entry_test_aarch64
          echo "HBLauncher ABI: host and AArch64 QEMU PASS; no Switch 2 firmware, console, or Encore loader tested."

  independent-nso-loader-fixture:
    name: Pinned third-party HOS NSO0 into actual Encore ExeFS header guard
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - name: Install cross assembler and standalone NSO0 validation compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu g++
      - name: Compile independently published AArch64 HOS SVC homebrew
        run: |
          python3 -m py_compile tools/ns2/build_public_nso_fixture.py
          python3 tools/ns2/build_public_nso_fixture.py \
            --output build-ns2-homebrew/hello.nso
          file build-ns2-homebrew/hello.elf build-ns2-homebrew/hello.nso
      - name: Validate original Encore NSO0 ABI and hostile inputs
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -Ivendor/encore-active/ns2-helpers/include -Ivendor/encore-active/ns2-experimental/src \
            tools/ns2/test_nso_preflight.cpp \
            -o build-ns2-homebrew/nso-preflight
          build-ns2-homebrew/nso-preflight build-ns2-homebrew/hello.nso
          echo "Real public AArch64 bytes inside NSO0 header; no Encore JIT or Switch 2 boot."
