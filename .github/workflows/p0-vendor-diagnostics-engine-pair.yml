name: P0 consolidated vendor diagnostics engine pair
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selected-vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Verify exact selected graph and focused host contracts
        run: |
          set -euo pipefail
          expected=772f06c8f5b12fdc81066e61f3db2dedfe3eed81
          selected="$(git rev-parse HEAD:vendor)"
          checked="$(git -C vendor rev-parse HEAD)"
          test "$selected" = "$expected"
          test "$checked" = "$expected"
          test "$(git -C vendor hash-object encore-active/eden-vulkan/vulkan_rasterizer.cpp)" = aa3ff8baf97f075d1adf44a9d19335c89403c8e1
          python3 -B vendor/tests/native_msaa_attribute_handle_rebind_host.py
          python3 -B vendor/tests/r457_native_emit_invalid_warning_host.py
          python3 -B vendor/tests/p0_guest_fault_context_source.py
          python3 -B vendor/tests/p0_mkw_blocking_boundaries_source.py
          python3 -B vendor/tests/fc27_ssa_definition_storage_host.py
          python3 -B vendor/tests/fc27_ssbo_search_pruning_host.py
          python3 -B vendor/tests/ps5_ir_bfs_adaptive_host.py
          python3 -B tools/check-fc27-prmt-engine-selection.py
          python3 -B vendor/tests/fc27_maxwell_prmt_operand_forms_source.py
          python3 -B vendor/tests/fc27_cpu_write_download_race_host.py
          python3 -B vendor/tests/ns2_qmd_rejected_dispatch_release_host.py
          python3 -B vendor/tests/ns2_ldsm_m88_modes_host.py
          python3 -B vendor/tests/shader_bitfield_uextract_fold_host.py
          python3 -B vendor/tests/ns2_getinfo_page_size_source.py
          python3 -B vendor/tests/ns2_getinfo_vamm_region_source.py
          echo ENCORE_VENDOR_P0_CONSOLIDATED_ENGINE_PAIR_PASS
