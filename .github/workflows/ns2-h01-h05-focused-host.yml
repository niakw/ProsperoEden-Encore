name: NS2 H01/H05/G01 focused owner host qualification

on:
  push:
    branches: [main]
    paths:
      - 'vendor'
      - 'tools/ns2/test_real_kprocess_metadata.py'
      - 'tools/ns2/test_real_kprocess_init_guest_rollback.py'
      - 'tools/ns2/check_native_exefs_missing_directory_host.py'
      - 'tools/ns2/check_native_exefs_fs_registration_host.py'
      - 'tools/ns2/check_native_nso_arguments_host.py'
      - 'tools/ns2/check_native_nso_patch_extent_host.py'
      - 'tools/ns2/check_native_spirv_descriptor_array_bounds_host.py'
      - 'tools/ns2/check_native_video_real_ffmpeg_frame_host.py'
      - 'tools/ns2/check_native_video_guest_surface_write_owner_host.py'
      - 'tools/ns2/check_native_video_packet_bounds_host.py'
      - 'tools/ns2/check_native_video_real_hevc_eos_host.py'
      - '.github/workflows/ns2-h01-h05-focused-host.yml'
  pull_request:
    paths:
      - 'vendor'
      - 'tools/ns2/test_real_kprocess_metadata.py'
      - 'tools/ns2/test_real_kprocess_init_guest_rollback.py'
      - '.github/workflows/ns2-h01-h05-focused-host.yml'
  workflow_dispatch:

permissions:
  contents: read

# The ordinary NS2 research workflow cancels on every new source SHA. This
# focused, real-owner witness finishes independently at its EXACT pinned SHA.
# It is not P5/PS5 or end-to-end guest hardware qualification.
concurrency:
  group: ns2-h01-h05-owner-${{ github.sha }}
  cancel-in-progress: false

jobs:
  kprocess-metadata-oom:
    name: H01 real KProcess metadata resource-limit fault
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
          persist-credentials: false
          fetch-depth: 1
      - name: Install public ARM64 fixture toolchain
        run: |
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get install -y -o Acquire::Retries=3 --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Build public NSO/NPDM and execute maintained metadata owner with resource-limit OOM
        run: |
          set -euo pipefail
          python3 tools/ns2/build_public_nso_fixture.py --output build-h01/public-nso/hello.nso
          python3 tools/ns2/build_public_exefs_fixture.py --nso build-h01/public-nso/hello.nso --output-dir build-h01/public-exefs
          python3 tools/ns2/test_real_kprocess_metadata.py --npdm build-h01/public-exefs/main.npdm --nso build-h01/public-exefs/main
          python3 tools/ns2/test_real_kprocess_init_guest_rollback.py --npdm build-h01/public-exefs/main.npdm --nso build-h01/public-exefs/main

  exefs-owner:
    name: H01 real ExeFS null/patch admission C++ owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false
          fetch-depth: 1
      - run: python3 -B tools/ns2/check_native_exefs_missing_directory_host.py
      - run: python3 -B tools/ns2/check_native_process_handoff_transaction_host.py
      - run: python3 -B tools/ns2/test_process_run_source.py
      - run: python3 -B tools/ns2/check_process_run_owner.py
      - run: python3 -B tools/ns2/check_native_exefs_fs_registration_host.py
      - run: python3 -B tools/ns2/check_native_nso_arguments_host.py
      - run: python3 -B tools/ns2/check_native_nso_patch_extent_host.py

  video-pixels-and-pump:
    name: H05 genuine FFmpeg pixels + maintained Pump ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false
          fetch-depth: 1
      - name: FFmpeg runtime and compiler headers
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 update -qq
          sudo apt-get install -y -o Acquire::Retries=3 --no-install-recommends libavcodec-dev libavutil-dev libswscale-dev
      - run: python3 -B tools/ns2/check_native_video_packet_bounds_host.py
      - run: python3 -B tools/ns2/check_native_video_real_ffmpeg_frame_host.py
      - run: python3 -B tools/ns2/check_native_video_guest_surface_write_owner_host.py
      - run: python3 -B tools/ns2/check_native_video_real_hevc_eos_host.py

  g01-descriptor-owner:
    name: G01 real SPIR-V singleton and descriptor array owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false
          fetch-depth: 1
      - run: python3 -B tools/ns2/check_native_spirv_descriptor_array_bounds_host.py
