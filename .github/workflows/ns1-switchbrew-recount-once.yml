name: NS1 SwitchBrew one-time source recount
on:
  push:
    branches: [audit/ns1-switchbrew-main-coverage-20261122]
    paths: [.github/workflows/ns1-switchbrew-recount-once.yml]
permissions:
  contents: write
jobs:
  recount:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          submodules: false
      - name: Sparse checkout of exact vendor gitlink
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/niakw/Prospero.Eden-Encore-vendor.git /tmp/encore_v
          git -C /tmp/encore_v sparse-checkout init --cone
          git -C /tmp/encore_v sparse-checkout set sources/eden/src/core/hle/service encore-active/eden-backports/src/core/hle/service encore-active/eden-core/src/core/hle/service
          git -C /tmp/encore_v fetch --quiet origin 224b05e6f8b1a266b0d55d1ded5332f7a2eaed7c --depth=1
          git -C /tmp/encore_v checkout --quiet 224b05e6f8b1a266b0d55d1ded5332f7a2eaed7c
      - name: Recount source-backed IPC commands and patch catalogue
        run: |
          python3 - <<'PY'
          import collections, json, pathlib, re
          root=pathlib.Path.cwd()
          v=pathlib.Path('/tmp/encore_v')
          md=root/'docs/audits/EDEN_ENCORE_NS1_SWITCHBREW_API_COVERAGE_2026-11-21.md'
          lines=md.read_text().splitlines()
          paths={}
          for priority, origin in enumerate(['sources/eden','encore-active/eden-backports','encore-active/eden-core']):
              base=v/origin/'src/core/hle/service'
              for f in base.rglob('*'):
                  if f.suffix not in ('.cpp','.h'): continue
                  key=f.relative_to(base).as_posix()
                  paths[key]=(priority,f)
          defs={}
          entries=collections.defaultdict(list)
          pat=re.compile(r'\{\s*(\d{1,6})\s*,\s*([^"{}\n]{1,190}?)\s*,\s*"([^"]{1,150})"\s*\}')
          fn=re.compile(r'([A-Za-z_]\w*)::([A-Za-z_]\w*)\s*\([^;{}]{0,650}\)\s*(?:const\s*)?(?:noexcept\s*)?(?:->[^;{}]{0,80})?\{',re.S)
          def normal(s): return re.sub(r'[^a-z0-9]','',s.lower())
          for rel, (_,path) in paths.items():
              folder=rel.split('/')[0]
              data=path.read_text(errors='replace')
              uri='https://github.com/niakw/Prospero.Eden-Encore-vendor/blob/224b05e6f8b1a266b0d55d1ded5332f7a2eaed7c/'+path.relative_to(v).as_posix()
              for m in pat.finditer(data):
                  handler=m[2].strip()
                  if handler.startswith('//'):continue
                  entries[(int(m[1]),normal(m[3]))].append((folder,handler,uri))
              for m in fn.finditer(data):
                  pos=m.end();depth=1;end=pos
                  while end<len(data) and depth and end-pos<14000:
                      if data[end]=='{':depth+=1
                      if data[end]=='}':depth-=1
                      end+=1
                  defs[(folder,m[1],m[2])]=data[pos:end-1] if depth==0 else data[pos:pos+1800]
          aliases={
              'appletae':'am','appletoe':'am','ihomemenufunctions':'am','icommonstategetter':'am','iselfcontroller':'am',
              'iwindowcontroller':'am','ilibraryappletcreator':'am','iapplicationfunctions':'am','istorage':'am',
              'iappletresource':'hid','irs':'hid','hidbus':'hid','xcd':'hid',
              'ifile':'filesystem','ifilesystem':'filesystem','idirectory':'filesystem','fsp-srv':'filesystem',
              'fsp-ldr':'filesystem','fsp-pr':'filesystem',
              'iapplicationdisplayservice':'nvnflinger','isystemdisplayservice':'nvnflinger',
              'imanagerdisplayservice':'nvnflinger','vi':'nvnflinger','dispdrv':'nvnflinger',
              'hwopus':'audio','audin':'audio','audout':'audio','audren':'audio','auddev':'audio','audrec':'audio','audctl':'audio',
              'sfdnsres':'sockets','bsd':'sockets','ssl':'ssl','csrng':'spl','spl':'spl','nvdrv':'nvdrv',
              'lr':'ncm','ncm':'ncm','ns':'ns','nifm':'nifm','ngct':'ngc','ngc':'ngc','pm':'pm',
              'pdm':'pdm','caps':'caps','nfc':'nfc','nfp':'nfp','pl':'font','set':'set',
              'bpc':'bpc','apm':'apm','ptm':'ptm','applet':'am','hid':'hid',
              'pctl':'pctl','sm':'sm','acc':'acc','mii':'mii','ldn':'ldn',
              'lm':'lm','erpt':'erpt','eupld':'erpt','grc':'grc','bcat':'bcat',
          }
          def get_family(label):
              a=label.split(',')[0].strip().split(' ')[0].strip('[]').split(':')[0].lower()
              return aliases.get(a,a)
          def kind(h,folder):
              if 'nullptr' in h:return 'NULL'
              m=re.search(r'([A-Za-z_]\w*)::([A-Za-z_]\w*)\s*>?\s*$',h)
              if not m:return 'RACCORDÉ'
              body=defs.get((folder,m[1],m[2]))
              if body is None:return 'RACCORDÉ'
              clean=re.sub(r'//[^\n]*|/\*[\s\S]*?\*/','',body)
              if re.search(r'UNIMPLEMENTED|NOT_IMPLEMENTED|ResultNotImplemented|not implemented|Stubbed',body,re.I):
                  return 'STUB' if len(clean)<320 else 'PARTIEL'
              if len(clean.strip())<90 and re.search(r'return\s+(?:ResultSuccess|0|true|false)\s*;',clean):
                  return 'STUB'
              return 'IMPL-SRC'
          seen=set(); stats=collections.Counter(); out=[]; examples=collections.defaultdict(list)
          for line in lines:
              p=[s.strip() for s in line.split('|')]
              if not line.startswith('|') or len(p)!=8 or '| 2026-11-21 |' not in line:
                  out.append(line);continue
              state=p[5]
              if state.startswith(('META','DUP')):
                  out.append(line);continue
              if not re.fullmatch(r'\d+',p[2].strip(chr(96))):
                  out.append(line);continue
              key=(p[1],p[2],p[3])
              if key in seen:
                  raise RuntimeError('Unexpected duplicate unmarked: '+str(key))
              seen.add(key)
              folder=get_family(p[1]); idnum=int(p[2].strip(chr(96))); title=p[3].strip(chr(96))
              candidates=[x for x in entries.get((idnum,normal(title)),[]) if x[0]==folder]
              if candidates:
                  statuses=[kind(x[1],x[0]) for x in candidates]
                  if len(set(statuses))>1 and 'IMPL-SRC' in statuses and 'NULL' in statuses:
                      status='Q'
                  else:
                      status=next((z for z in ['IMPL-SRC','PARTIEL','RACCORDÉ','STUB','NULL'] if z in statuses),'Q')
              else:status='Q'
              if status=='Q' and state.startswith('**STUB**'):status='STUB-BASE'
              if status=='Q' and state.startswith('**D**'):status='D-BASE'
              stats[status]+=1
              if len(examples[status])<7:examples[status].append('/'.join(key))
              if status in ('IMPL-SRC','PARTIEL','RACCORDÉ','STUB','NULL'):
                  record=next((x for x in candidates if kind(x[1],x[0])==status),candidates[0])
                  p[5]='**'+status+'** ([source C++]('+record[2]+'))'
                  p[6]='2026-11-22'
                  line='| '+' | '.join(p[1:-1])+' |'
              out.append(line)
          assert len(seen)==4736,(len(seen),len(stats))
          assert sum(stats.values())==4736
          print('NS1_SOURCE_COUNTER',json.dumps(dict(stats),sort_keys=True),flush=True)
          print('NS1_SAMPLE',json.dumps(dict(examples),sort_keys=True),flush=True)
          # SVC: preserve their independently qualified historic D/P/E statuses, and identify all 80 C++-located Q as SRC-LOCATED only.
          svc=collections.Counter()
          for line in out:
              if re.match(r'^\| '+chr(96)+r'0x[0-9A-Fa-f]+'+chr(96)+r' \|',line) and '2026-11-21' in line:
                  m=re.search(r'\*\*(Q|D|PARTIEL|E)\*\*',line)
                  if m:svc[m[1]]+=1
          assert sum(svc.values())==117,svc
          src_verified=stats['IMPL-SRC']
          potential=stats['RACCORDÉ']
          screen=(
          '## Compteur recalculé à partir des tables C++ (22/11/2026)\n\n'
          '**Périmètre :** moteur 452fd7fe (branche issue de main), vendor/gitlink 224b05e6. Relevé statique des tables '
          'FunctionInfo et définitions des méthodes dans sources/eden, avec priorité aux chemins de remplacement '
          'eden-backports et eden-core quand le chemin relatif coïncide. Cette méthode ne remplace pas la '
          'preuve de sélection effective CMake et ne déduit **aucune validation PS5**.\n\n'
          '| Statut mesuré | IPC | Description |\n|---|---:|---|\n'
          f'| **IMPL-SRC — handler et corps C++ non trivial identifiés** | **{src_verified}** | Candidat source, non certifié ABI ni PS5 |\n'
          f'| **RACCORDÉ — handler non nul, corps non démontré** | **{potential}** | Ne pas compter comme implémenté |\n'
          f'| **PARTIEL — branches non implémentées dans le corps** | **{stats["PARTIEL"]}** | Contrat incomplet |\n'
          f'| **STUB — corps minimal/no-op détecté** | **{stats["STUB"]+stats["STUB-BASE"]}** | Dont {stats["STUB-BASE"]} issus de la référence antérieure |\n'
          f'| **NULL — handler explicitement nul localisé** | **{stats["NULL"]}** | Trou trouvé dans les sources rapprochées |\n'
          f'| **D-BASE — rejet dans le snapshot initial, owner actuel non corrélé** | **{stats["D-BASE"]}** | Non confirmé sur runtime actif |\n'
          f'| **Q — non rapprochée sans ambiguïté** | **{stats["Q"]}** | Ne signifie ni implémenté ni absent |\n'
          '| **TOTAL IPC DISTINCTES** | **4 736** | Hors 27 doublons et 23 codes erreurs |\n\n'
          '**SVC** : 80 corps de fonction repérés dans la référence 21/11 (Q non encore qualifiés à 224b), '
          '33 rejets D, 3 partiels, 1 ID absent E. Aucun SVC ajouté artificiellement au compteur IMPL-SRC '
          'de ce scanner IPC. **Le nombre de fonctions NS1 entièrement implémentées et vérifiées est toujours '
          'indéterminé : le résultat ci-dessus est un minimum de corps non triviaux rapprochés, pas un total '
          'de couverture fonctionnelle.**\n\n'
          '### Graphique de provenance source\n\n'
          f'- IMPL-SRC : {src_verified} / 4 736 IPC\n'
          f'- RACCORDÉ : {potential} / 4 736 IPC\n'
          f'- STUB : {stats["STUB"]+stats["STUB-BASE"]} / 4 736 IPC\n'
          f'- PARTIEL : {stats["PARTIEL"]} / 4 736 IPC\n'
          f'- NULL : {stats["NULL"]} / 4 736 IPC\n'
          f'- D-BASE : {stats["D-BASE"]} / 4 736 IPC\n'
          f'- Q : {stats["Q"]} / 4 736 IPC\n\n'
          '**Méthode et limites** : jointure stricte interface/famille, commande ID, nom du handler; '
          'fonctions au même nom mais de familles différentes exclues; pas de classement par simple présence '
          'dun service. Corps déclarés ailleurs ou par macro restent RACCORDÉ/Q. '
          'Les branches conditionnelles et retours factices peuvent nécessiter une requalification manuelle.\n\n'
          )
          target='## Bilan corrigé — catalogue NS1 sur la branche issue de '
          start=next(i for i,x in enumerate(out) if x.startswith(target))
          end=next(i for i,x in enumerate(out) if x.startswith('## Tableau SVC —'))
          prefix='\n'.join(out[:end])
          prefix=prefix.replace('## Tableau SVC —', '## Tableau SVC —')
          # Insert the fresh counted view before the original summary, retaining the original historical breakdown below.
          out.insert(start,screen.rstrip())
          md.write_text('\n'.join(out)+'\n')
          print('NS1_AUDIT_MARKDOWN_UPDATED',len(out),flush=True)
          
          PY
      - name: Commit catalogue only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audits/EDEN_ENCORE_NS1_SWITCHBREW_API_COVERAGE_2026-11-21.md
          git diff --cached --check
          git commit -m 'docs(ns1): recount SwitchBrew handlers against pinned active source'
          git push origin HEAD:audit/ns1-switchbrew-main-coverage-20261122
