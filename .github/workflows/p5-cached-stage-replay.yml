name: P5 recovered native package from cached objects (no full rebuild)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p5-cached-stage-replay.yml'
      - 'tools/package-headless-native.sh'
      - 'headless/check_package.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact CMake and pinned vendor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact canonical FTP and release ZIP naming before costly cache replay
        run: |
          set -euo pipefail
          python3 -B tools/ci/check-ftp-archive-root.py --self-test
          echo "P5_REPLAY_ZIP_NAME_CONTRACT_PASS"

      - name: Restore completed objects from twelfth failed native build
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/prosperoeden-deps
            ~/.cache/ps5-eden-headless.*
            ~/.cache/prosperoeden-mkpfs
            .deps
          key: prospero-eden-encore-040-Linux-fc370fe9ce80cd597292415e2be5ec6a07a034248d03b6fd2f8cc2be59ef6d3e-42924336057

      - name: Refuse cache misses rather than rebuild 1399 objects
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          echo "::error::Exact twelfth-run object cache missing; no native compile authorized"
          exit 1

      - name: Recreate only external native SDK link dependencies
        if: steps.restore.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang-18 libclang-18-dev lld-18 llvm-18 llvm-18-dev llvm-18-tools llvm-spirv-18 libllvmspirvlib-18-dev \
            cmake ninja-build ccache make nasm meson rsync git \
            glslang-tools spirv-tools bison flex autoconf \
            python3 python3-venv python3-pip python3-mako python3-yaml pkg-config \
            libboost-container-dev libssl-dev libzstd-dev \
            imagemagick librsvg2-bin unzip binutils coreutils
          bash tools/ci/link-sibling-deps.sh
          test -s ../mihawk-vulkan-review/.deps/native/radv-release/lib/libvulkan_radeon.ps5.a
          python3 -B tools/isolate-radv.py
          bash tools/build-agc-driver-stub.sh
          python3 -m pip install --user --break-system-packages "meson==1.12.1"
          export PATH="$HOME/.local/bin:$PATH"
          bash tools/build-opengl-sdk.sh
          echo "P5_REPLAY_EXTERNAL_LINK_DEPS_PASS"

      - name: Reconfigure and relink from restored native objects
        if: steps.restore.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t graphs < <(find "$HOME/.cache" -path '*/native-local/build.ninja' -type f -print)
          test "${#graphs[@]}" -eq 1
          native="$(dirname "${graphs[0]}")"
          scratch="$(dirname "$native")"
          test -f "$scratch/source/CMakeLists.txt"
          test -f "$native/src/shader_recompiler/libshader_recompiler.a"
          test -f "$native/src/video_core/libvideo_core.a"
          mkdir -p .local
          printf '%s\n' "$scratch" > .local/headless-cache
          export PATH="$HOME/.local/bin:$PATH"
          # Match the real native builder before BOTH CMake configure and LLD.
          # Otherwise CMake writes -L/target/lib, and the link wrapper exits
          # before invoking the linker (PS5_PAYLOAD_SDK: unbound variable).
          export PS5_PAYLOAD_SDK="$scratch/sdk"
          export EDEN_NATIVE_C_DEPS="$scratch/cdeps"
          export PROSPEROEDEN_GIT_DEPS_ROOT=.deps/repos
          export PROSPEROEDEN_DEPS_OFFLINE=1
          test -s "$PS5_PAYLOAD_SDK/target/lib/libkernel.so"
          test -s "$PS5_PAYLOAD_SDK/target/lib/libc++.a"
          # Current checkout differs from the failed run only by build-system
          # fixes. Recompile the one source that embeds the Git SHA, so
          # package provenance matches the actual replayed application.
          cmake -S "$scratch/source" -B "$native" -G Ninja \
            -DCMAKE_PROJECT_yuzu_INCLUDE="$GITHUB_WORKSPACE/headless/inject.cmake" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DEDEN_ENCORE_SOURCE_COMMIT="$GITHUB_SHA"
          ninja -C "$native" -t targets all >/dev/null
          echo "P5_CACHED_NATIVE_GRAPH_PASS"
          python3 - "$native" <<'PY_REPLAY'
          import json
          from pathlib import Path
          import shlex
          import subprocess
          import sys

          native = Path(sys.argv[1]).resolve()
          db = json.loads((native / "compile_commands.json").read_text())
          expected = (
              "vendor/sources/ps5-fsr3-optical-flow/src/ps5_framegen.cpp",
              "vendor/sources/eden/src/shader_recompiler/backend/spirv/emit_spirv_atomic.cpp",
              "vendor/sources/eden/src/shader_recompiler/backend/glsl/emit_glsl_atomic.cpp",
              "vendor/sources/eden/src/shader_recompiler/backend/glasm/emit_glasm_memory.cpp",
              "vendor/sources/eden/src/shader_recompiler/frontend/maxwell/translate/impl/atomic_operations_global_memory.cpp",
              "headless/main.cpp",
          )
          for relative in expected:
              matches = [entry for entry in db if entry["file"].endswith("/" + relative)]
              assert len(matches) == 1, (relative, len(matches))
              entry = matches[0]
              cmd = (list(entry["arguments"]) if "arguments" in entry
                     else shlex.split(entry["command"]))
              assert "-c" in cmd and "-o" in cmd, relative
              obj = Path(entry["directory"]) / cmd[cmd.index("-o") + 1]
              obj.parent.mkdir(parents=True, exist_ok=True)
              if relative == "headless/main.cpp":
                  assert any("EDEN_NATIVE_SOURCE_COMMIT" in flag and
                             "${" not in flag and __import__("os").environ["GITHUB_SHA"] in flag
                             for flag in cmd), ("Launcher compile SHA drift", relative)
                  print("P5_REPLAY_NATIVE_SHA_RECOMPILE_PASS", flush=True)
              if relative.endswith("/ps5_framegen.cpp"):
                  assert any("PS5_FRAMEGEN_VULKAN_HEADER" in arg for arg in cmd), cmd
                  assert any("VK_NO_PROTOTYPES" in arg for arg in cmd), cmd
                  assert any("VOLK_NAMESPACE" in arg for arg in cmd), cmd
                  assert "-include" in cmd and any(
                      "mihawk_volk.h" in arg for arg in cmd), cmd
                  assert not any("SHELL:-include" in arg for arg in cmd), cmd
                  print("P5_REPLAY_FSR3_FORCED_INCLUDE_FLAGS_PASS", flush=True)
              print("P5_REPLAY_COMPILE_REAL_OBJECT", relative, flush=True)
              subprocess.run(cmd, cwd=entry["directory"], check=True)
              assert obj.is_file() and obj.stat().st_size > 0, obj

          # Never invoke Ninja's global build target: existing 1399-step
          # objects remain untouched. Repack ONLY the shader archive by
          # executing its native Ninja archive rule after five exact TUs.
          def final_command(target):
              commands = subprocess.check_output(
                  ["ninja", "-C", str(native), "-t", "commands", target],
                  text=True).splitlines()
              assert commands, target
              return commands[-1]

          for owner in (
              "src/shader_recompiler/libshader_recompiler.a",
              "src/video_core/libvideo_core.a",
          ):
              # Both owners changed: CAS implementations are in shader_recompiler;
              # namespaced FSR3 symbols live in video_core. Repack each static
              # archive from cached objects, otherwise the link would still
              # resolve the OLD ps5_framegen.cpp.o from the failed run.
              archive = final_command(owner)
              assert owner in archive and " -E rm -f " in archive, archive[-600:]
              subprocess.run(archive, cwd=native, shell=True,
                             executable="/bin/bash", check=True)
              print("P5_REPLAY_NATIVE_ARCHIVE_REPACK_PASS", owner, flush=True)

          # Explicitly resolve every native Vulkan dispatch reference from the
          # real FrameGen object through namespace-isolated volk pointers.
          framegen = next(e for e in db if e["file"].endswith(expected[0]))
          framecmd = (list(framegen["arguments"]) if "arguments" in framegen
                      else shlex.split(framegen["command"]))
          frameobj = native / framecmd[framecmd.index("-o") + 1]
          nm = subprocess.check_output(["llvm-nm-18", "-u", str(frameobj)],
                                       text=True)
          assert "vkCreateImage" in nm and "_ZN4volk" in nm, (
              "Expected volk-namespaced Vulkan dispatch, not global vk* calls", nm[:1500])
          print("P5_REPLAY_FSR3_VOLK_DISPATCH_PASS", flush=True)

          # The command generated by CMake already wraps Clang/LLD via
          # tools/link-headless-native.sh and points at the restored objects.
          # Run ONLY that link command; staging is a separate verified step.
          link = final_command("bin/eden-headless")
          assert "link-headless-native.sh" in link, link[:400]
          # The exact twelfth native build linked the CMake-built static LZ4
          # object archive. In the isolated cache replay, CMake re-detects
          # host liblz4 and substitutes -llz4, which the PS5 LLD cannot find.
          # Reuse the ORIGINAL native archive, never host/system LZ4.
          expected_lz4 = native / "_deps/lz4-build/liblz4.a"
          assert expected_lz4.is_file() and expected_lz4.stat().st_size > 0, (
              "Twelfth-run static LZ4 archive missing from recovered cache")
          if " -llz4 " in link:
              assert link.count(" -llz4 ") == 1
              link = link.replace(" -llz4 ", " _deps/lz4-build/liblz4.a ")
          else:
              assert " _deps/lz4-build/liblz4.a " in link, (
                  "Expected original exact static LZ4 linker dependency", link[-1600:])
          print("P5_REPLAY_PINNED_LZ4_ARCHIVE_PASS", flush=True)
          print("P5_REPLAY_FINAL_LINK_START no_full_build=1", flush=True)
          subprocess.run(link, cwd=native, shell=True, executable="/bin/bash",
                         check=True)
          binary = native / "bin/eden-headless"
          assert binary.is_file() and binary.stat().st_size > 0, binary
          print("P5_REPLAY_FINAL_LINK_PASS binary_bytes=" + str(binary.stat().st_size)
                + " candidate_for_strict_stage=1 no_console=1", flush=True)
          PY_REPLAY

      - name: Prepare host packaging tool and fixed guest fixture (no emulator compile)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build-native-tool.sh
          bash tools/build-core-fixture.sh
          test -s ../ps5-native-app-boilerplate/runtime/libc.prx
          (cd ../ps5-native-app-boilerplate/runtime && sha256sum --check --strict libc.prx.sha256)
          python3 -B tools/check-daily-art-converter-host.py
          python3 -B tools/launcher/build-box-art-index.py --self-test
          python3 -B tools/launcher/build-box-art-index.py --download --output headless/prosperoeden/ui/box-art-index.tsv
          test -s headless/prosperoeden/ui/box-art-index.tsv
          echo "P5_REPLAY_HOST_PACKAGING_INPUTS_PASS"

      - name: Sign and stage recovered native app (no emulator compile)
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(cat .local/headless-cache)
          test -s "$scratch/native-local/bin/eden-headless"
          test -s "$scratch/native-local/bin/eden-headless.map"
          export EDEN_PACKAGE_DIR="$GITHUB_WORKSPACE/build/release/PPSA99008"
          export PS5_PAYLOAD_SDK="$scratch/sdk"
          export PS5_ELEVATION_SDK="$GITHUB_WORKSPACE/../ps5-native-app-boilerplate/.deps/native/ps5-payload-sdk"
          mkdir -p build/release
          bash tools/package-headless-native.sh --integration
          python3 -B headless/check_package.py --check
          python3 -B tools/ci/check-staged-app.py build/release/PPSA99008
          python3 -B tools/ci/check-release-experiments.py build/release/PPSA99008
          test "$(ls -A build/release)" = PPSA99008
          echo "P5_REPLAY_STRICT_NATIVE_STAGE_PASS title=PPSA99008"

      - name: Upload verified FTP title folder
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Eden-Encore-PS5-FTP-PPSA99008
          path: build/release/
          if-no-files-found: error
          retention-days: 14

      - name: Assemble checksummed distribution ZIPs and crash symbols
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/ci/make-dist.py build/release/PPSA99008
          mkdir -p build/symbols
          python3 -B tools/ci/write-crash-provenance.py \
            --app build/release/PPSA99008 \
            --native build/headless-native \
            --output build/headless-native/crash-provenance.json \
            --app-title PPSA99008
          cp build/headless-native/crash-provenance.json build/symbols/crash-provenance.json
          # The receipt fingerprints link.map: ship the exact same-run map alongside ELF.
          install -m 0644 build/headless-native/link.map build/symbols/link.map
          python3 -B - <<'PY_SYMBOLS'
          import hashlib
          import json
          from pathlib import Path

          symbols = Path("build/symbols")
          manifest = json.loads((symbols / "crash-provenance.json").read_text())
          elfs = list(symbols.glob("Prospero.Eden-Encore-R*.elf"))
          assert len(elfs) == 1, f"expected exactly one release ELF, found {elfs}"
          for key, path in (("unstripped_elf", elfs[0]),
                            ("link_map", symbols / "link.map")):
              expected = manifest["files"][key]
              assert path.is_file() and not path.is_symlink(), key
              assert path.stat().st_size == expected["size_bytes"], key
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              assert digest.hexdigest() == expected["sha256"], key
          print("P5_SYMBOL_BUNDLE_MANIFEST_MATCH_PASS")
          PY_SYMBOLS
          python3 -B tools/ci/check-ftp-archive-root.py dist
          # The checksummed filenames are RELATIVE TO dist/, not repo root.
          # Do not --ignore-missing: both archives MUST exist and match hashes.
          test "$(wc -l < dist/SHA256SUMS)" -eq 2
          (cd dist && sha256sum --check --strict SHA256SUMS)
          echo "P5_REPLAY_DISTRIBUTION_ZIPS_PASS"

      - name: Upload recovered, verified PS5 release bundle (no GitHub Release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Prospero.Eden-Encore-recovered-bundle
          path: |
            dist/
            build/symbols/
          if-no-files-found: error
          retention-days: 14
