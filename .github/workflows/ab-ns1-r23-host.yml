name: A/B NS1 R23 selected semantic host qualification

on:
  pull_request:
    paths:
      - "headless/r23_f2i_conversion_ps5.cpp"
      - "headless/r23_channel_state_cache_ps5.h"
      - "tools/audit/check-r23-channel-state-host.py"
      - "headless/r23_bcat_delivery_cache_file_ps5.cpp"
      - "headless/r23_ips_layer_ps5.cpp"
      - "headless/r23_audren_debug_ps5.cpp"
      - "headless/r23_controller_applet_ps5.cpp"
      - "tools/audit/check-r23-controller-applet-host.py"
      - "tools/audit/check-r23-ips-audren-host.py"
      - "headless/CMakeLists.txt"
      - "tools/audit/check-r23-f2i-bcat-host.py"
      - "tools/audit/check-r23-ips-audren-host.py"
      - "tools/audit/check-r23-ips-long-line-host.py"
      - "tools/audit/check-r23-viewport-host.py"
      - "tools/prepare-vulkan-port.py"
      - ".github/workflows/ab-ns1-r23-host.yml"
  push:
    branches:
      - dev/ab-ns1-corrective-batches-2026-11-10
    paths:
      - "headless/r23_controller_applet_ps5.cpp"
      - "tools/audit/check-r23-controller-applet-host.py"
      - "headless/CMakeLists.txt"
      - ".github/workflows/ab-ns1-r23-host.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout isolated corrective HEAD and pinned vendor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Validate complete maintained sources and execute extracted F2I/BCAT cases
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor rev-parse HEAD)" = "22b69d6053db41b74edac2633c012f925b84f69e"
          python3 -B tools/audit/check-r23-f2i-bcat-host.py
          python3 -B tools/audit/check-r23-ips-audren-host.py
          python3 -B tools/audit/check-r23-ips-long-line-host.py
          python3 -B tools/audit/check-r23-viewport-host.py
          python3 -B tools/audit/check-r23-channel-state-host.py
          python3 -B tools/audit/check-r23-controller-applet-host.py
          echo "R23 source checks plus #131 extracted real applet method tested with mock HID under sanitizers. No PS5 test." >> "$GITHUB_STEP_SUMMARY"
          echo "No native PS5 ELF, real Maxwell header compiler include receipt, actual shader guest behavior, or BCAT title-level test." >> "$GITHUB_STEP_SUMMARY"
