name: NUP v1 host preflight

on:
  push:
    branches: [main]
    paths:
      - tools/check-nup-v1-host.py
      - tools/check-nup-v1-payload-host.py
      - tools/check-nup-v1-vfs-host.py
      - tools/nup-v1-vfs-host.cpp
      - headless/nup_v1_vfs.h
      - headless/nup_v1_vfs.cpp
      - headless/nup_v1_native_vfs.h
      - headless/nup_v1_native_vfs.cpp
      - headless/nup_v1_native_content.h
      - headless/nup_v1_native_content.cpp
      - headless/nup_v1_native_aoc.h
      - headless/nup_v1_native_aoc.cpp
      - headless/nup_v1_aoc_service.cpp
      - headless/nup_v1_romfs_factory.cpp
      - headless/metadata_bridge.cpp
      - tools/check-nup-v1-service-parity-host.py
      - headless/nup_v1_native_loader.h
      - headless/nup_v1_native_loader.cpp
      - headless/nup_v1_loader_route.cpp
      - headless/CMakeLists.txt
      - headless/game_files.h
      - tools/check-nup-v1-game-discovery.py
      - headless/nup_v1_runtime.cmake
      - tools/check-nup-v1-runtime-cmake.py
      - tools/nup-v1-native-host.cpp
      - tools/nup-v1-real-romfs-host.cpp
      - tools/check-nup-v1-real-romfs-host.py
      - tools/nup-v1-content-fixture.py
      - tools/check-nup-v1-native-host.py
      - tools/check-nup-v1-native-abi.py
      - tools/nup-native-host-stub/**
      - .github/workflows/nup-v1-host.yml
  pull_request:
    paths:
      - tools/check-nup-v1-host.py
      - tools/check-nup-v1-payload-host.py
      - tools/check-nup-v1-vfs-host.py
      - tools/nup-v1-vfs-host.cpp
      - headless/nup_v1_vfs.h
      - headless/nup_v1_vfs.cpp
      - headless/nup_v1_native_vfs.h
      - headless/nup_v1_native_vfs.cpp
      - headless/nup_v1_native_content.h
      - headless/nup_v1_native_content.cpp
      - headless/nup_v1_native_aoc.h
      - headless/nup_v1_native_aoc.cpp
      - headless/nup_v1_aoc_service.cpp
      - headless/nup_v1_romfs_factory.cpp
      - headless/metadata_bridge.cpp
      - tools/check-nup-v1-service-parity-host.py
      - headless/nup_v1_native_loader.h
      - headless/nup_v1_native_loader.cpp
      - headless/nup_v1_loader_route.cpp
      - headless/CMakeLists.txt
      - headless/game_files.h
      - tools/check-nup-v1-game-discovery.py
      - headless/nup_v1_runtime.cmake
      - tools/check-nup-v1-runtime-cmake.py
      - tools/nup-v1-native-host.cpp
      - tools/nup-v1-real-romfs-host.cpp
      - tools/check-nup-v1-real-romfs-host.py
      - tools/nup-v1-content-fixture.py
      - tools/check-nup-v1-native-host.py
      - tools/check-nup-v1-native-abi.py
      - tools/nup-native-host-stub/**
      - .github/workflows/nup-v1-host.yml
  workflow_dispatch:

permissions:
  contents: read

# Multiple small NUP commits must not consume the host runner queue with
# obsolete builds. Keep only the newest verification for each branch/PR.
concurrency:
  group: nup-v1-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate NUP v1 structure and reject corrupted fixtures
        run: python3 tools/check-nup-v1-host.py --self-test
      - name: Stream raw and zstd payloads and reject bad hashes / frames
        run: python3 tools/check-nup-v1-payload-host.py --self-test
      - name: Compile and exercise isolated NUP C++ VFS (host only)
        run: python3 tools/check-nup-v1-vfs-host.py
      - name: Compile and exercise inactive native FileSys adapter (host ABI stub)
        run: python3 tools/check-nup-v1-native-host.py
      - name: Compile native adapter against pinned actual vendor VFS API
        run: python3 tools/check-nup-v1-native-abi.py
      - name: Build actual pinned vendor RomFS tables from synthetic NUP trees
        run: python3 tools/check-nup-v1-real-romfs-host.py
      - name: Configure unified NUP loader owners (no console build)
        run: python3 tools/check-nup-v1-runtime-cmake.py
      - name: Compile unified NUP game discovery with legacy formats
        run: python3 tools/check-nup-v1-game-discovery.py
      - name: Check maintained AoC and RomFS source parity (no full core build)
        run: python3 tools/check-nup-v1-service-parity-host.py
