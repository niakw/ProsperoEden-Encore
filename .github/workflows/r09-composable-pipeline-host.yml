name: R09 composable video pipeline graph (host-only)

# Fast policy-only gate: multiple spatial passes, optional neural,
# real-frame generation and arbitrary safe order. No Vulkan execution,
# no proprietary model, no vendor pin changes and no PS5 build.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r09-composable-pipeline-host.yml'
      - 'extras/graphics/neural_pipeline_composer.h'
      - 'extras/graphics/test_neural_pipeline_composer.cpp'
      - 'extras/graphics/neural_pipeline_recipe.h'
      - 'extras/graphics/test_neural_pipeline_recipe.cpp'
      - 'extras/graphics/r09_min_shaders/pipeline_resample_host.comp'
      - 'extras/graphics/r09_composable_vk_spatial_chain.cpp'
      - 'extras/graphics/r09_native_fsr_sgsr_gpu_witness.cpp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r09-composable-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  topology-and-ownership:
    name: Ordered multi-stage graph and safety invariants (GCC / Clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout isolated research commit only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Compile and execute exhaustive stage-order contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-local/r09-composable
          for cxx in g++ clang++; do
            for test_name in test_neural_pipeline_composer test_neural_pipeline_recipe; do
              "$cxx" -std=c++20 -O1 -Wall -Wextra -Werror -UNDEBUG \
                -fsanitize=undefined -fno-sanitize-recover=all \
                -Iextras/graphics \
                "extras/graphics/${test_name}.cpp" \
                -o ".build-local/r09-composable/${test_name}-${cxx}"
              UBSAN_OPTIONS=halt_on_error=1 \
                ".build-local/r09-composable/${test_name}-${cxx}"
              echo "R09_COMPOSABLE_VIDEO_GRAPH_CXX_PASS ${test_name} compiler=${cxx}"
            done
          done
          echo R09_ORDERED_NEURAL_SPATIAL_COMPOSE_FG_PRESENT_CONTRACTS_PASS
          echo R09_VERSIONED_SEQUENCE_WITH_REAL_GPU_BINDING_GATE_PASS
          echo R09_COMPOSABLE_PS5_RUNTIME_DEFAULT_OFF_NO_GPU_EXECUTION

  vulkan-multi-image-spatial:
    name: REAL Vulkan multi-image chained spatial outputs (1 / 2 / 3 passes)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout isolated research branch without vendor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Install only host Vulkan / SPIR-V / Khronos validation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            g++ libvulkan-dev mesa-vulkan-drivers \
            glslang-tools spirv-tools vulkan-validationlayers
      - name: Compile host shader and validate SPIR-V ABI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-local/r09-composable-gpu
          glslangValidator -V --target-env vulkan1.1 -S comp \
            extras/graphics/r09_min_shaders/pipeline_resample_host.comp \
            -o .build-local/r09-composable-gpu/resample.spv
          spirv-val --target-env vulkan1.1 \
            .build-local/r09-composable-gpu/resample.spv
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -UNDEBUG \
            -Iextras/graphics \
            extras/graphics/r09_composable_vk_spatial_chain.cpp \
            -lvulkan -o .build-local/r09-composable-gpu/chain
      - name: Execute TRUE GPU readback of every VkImage intermediate with Vulkan validation
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 \
            -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd" && test -f "$icd"
          export VK_ICD_FILENAMES="$icd"
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          for passes in 1 2 3; do
            .build-local/r09-composable-gpu/chain \
              .build-local/r09-composable-gpu/resample.spv "$passes"
          done
          # Non-toy 16:9 320x180 -> 640x360 -> 960x540 -> 1280x720,
          # real VkImage and VkImageView from GPU owners bound to the
          # versioned Recipe then fail-closed if a fence proof is removed.
          .build-local/r09-composable-gpu/chain \
            .build-local/r09-composable-gpu/resample.spv 3 --recipe-720p
          # Deliberate Vulkan hazard, only sync validator output is
          # checked. NEVER inspect corrupted GPU image contents.
          .build-local/r09-composable-gpu/chain \
            .build-local/r09-composable-gpu/resample.spv 2 \
            --negative-missing-barrier
          echo R09_KHRONOS_SYNC_VALIDATION_ZERO_ERRORS_POSITIVE_AND_NEGATIVE_REJECTED
          echo R09_REAL_GPU_MULTI_IMAGE_1_2_3_SPATIAL_STAGES_AND_ORACLE_PASS
          echo R09_REAL_VKIMAGE_BOUND_VERSIONED_RECIPE_720P_HOST_PASS
          echo R09_ONLY_PUBLIC_HOST_SHADERS_NO_TRAINED_NEURAL_NO_PS5

  native-fsr-sgsr-shader-spv:
    name: Compile genuine vendor FSR1 EASU/RCAS + SGSR/Edge shaders
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout isolated engine without vendor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Sparse checkout exact pinned vendor GLSL and AMD FSR headers
        shell: bash
        run: |
          set -euo pipefail
          pin=22b69d6053db41b74edac2633c012f925b84f69e
          test "$(git rev-parse HEAD:vendor)" = "$pin"
          git -c credential.helper= clone --quiet --filter=blob:none \
            --no-checkout https://github.com/niakw/Prospero.Eden-Encore-vendor.git \
            /tmp/r09-native-spatial-vendor
          git -C /tmp/r09-native-spatial-vendor sparse-checkout set \
            sources/eden/src/video_core/host_shaders \
            sources/eden/externals/FidelityFX-FSR/ffx-fsr
          git -C /tmp/r09-native-spatial-vendor fetch --quiet --depth=1 origin "$pin"
          git -C /tmp/r09-native-spatial-vendor checkout --quiet --detach "$pin"
          test "$(git -C /tmp/r09-native-spatial-vendor rev-parse HEAD)" = "$pin"
          test "$(git rev-parse HEAD:vendor)" = "$pin"
      - name: Install compiler and SPIR-V validator
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends glslang-tools spirv-tools
      - name: Compile six ORIGINAL vendor FSR1 and SGSR shader entry points
        shell: bash
        run: |
          set -euo pipefail
          base=/tmp/r09-native-spatial-vendor/sources/eden
          glsl_dir="$base/src/video_core/host_shaders"
          fx="$base/externals/FidelityFX-FSR/ffx-fsr"
          out=.build-local/r09-vendor-real-spv
          mkdir -p "$out"
          for entry in \
            vulkan_fidelityfx_fsr.vert \
            vulkan_fidelityfx_fsr_easu_fp32.frag \
            vulkan_fidelityfx_fsr_rcas_fp32.frag \
            sgsr1_shader.vert \
            sgsr1_shader_mobile.frag \
            sgsr1_shader_mobile_edge_direction.frag; do
            stage=frag
            case "$entry" in *.vert) stage=vert;; esac
            glslangValidator -V --target-env vulkan1.1 -S "$stage" \
              "-I$glsl_dir" "-I$fx" "$glsl_dir/$entry" \
              -o "$out/$entry.spv"
            spirv-val --target-env vulkan1.1 "$out/$entry.spv"
            test "$(stat -c%s "$out/$entry.spv")" -gt 256
            echo "R09_AUTHENTIC_VENDOR_SHADER_SPIRV_VALID entry=$entry"
          done
          echo R09_REAL_FSR1_EASU_RCAS_SGSR_EDGE_SPIRV_ALL_SIX_VALID
      - name: Compile genuine vendor graphics-shader Vulkan three-pass witness
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq --no-install-recommends \
            g++ libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Wno-unused-function \
            -UNDEBUG -Iextras/graphics \
            extras/graphics/r09_native_fsr_sgsr_gpu_witness.cpp \
            -lvulkan -o .build-local/r09-vendor-real-spv/native_gpu
      - name: Run authentic vendor EASU → RCAS → SGSR/Edge GPU and independent pixel checks
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 \
            -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd" && test -f "$icd"
          export VK_ICD_FILENAMES="$icd"
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          out=.build-local/r09-vendor-real-spv
          for method in normal edge; do
            frag=sgsr1_shader_mobile.frag
            if [[ "$method" == edge ]]; then
              frag=sgsr1_shader_mobile_edge_direction.frag
            fi
            for pattern in constant gradient; do
              "$out/native_gpu" \
                "$out/vulkan_fidelityfx_fsr.vert.spv" \
                "$out/vulkan_fidelityfx_fsr_easu_fp32.frag.spv" \
                "$out/vulkan_fidelityfx_fsr_rcas_fp32.frag.spv" \
                "$out/sgsr1_shader.vert.spv" \
                "$out/$frag.spv" "$method" "$pattern"
            done
          done
          echo R09_AUTHENTIC_VENDOR_NATIVE_GLSL_EASU_RCAS_SGSR_EDGE_GPU_PASS
          echo R09_HOST_LAVAPIPE_NOT_PS5_NOT_TRAINED_NEURAL_NOT_NATIVE_CPP_OWNER_CALL
