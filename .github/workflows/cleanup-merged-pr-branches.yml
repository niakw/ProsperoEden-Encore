name: Cleanup merged pull request branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-pr-branches.yml'
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: verified-merged-branch-cleanup-${{ github.repository }}
  cancel-in-progress: false
jobs:
  cleanup:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Delete only verified merged same-repository branch heads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repo = os.environ['GH_REPO']
          token = os.environ['GH_TOKEN']
          base = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def api(path, method='GET'):
              with urlopen(Request(base + path, headers=headers, method=method), timeout=25) as response:
                  return json.load(response) if method == 'GET' else None

          def pages(path, maximum=6):
              for page in range(1, maximum + 1):
                  result = api(path + ('&' if '?' in path else '?') + f'per_page=100&page={page}')
                  yield from result
                  if len(result) < 100:
                      break

          branches = list(pages('/branches'))
          open_heads = {
              p['head']['ref'] for p in pages('/pulls?state=open')
              if p['head']['repo'] and p['head']['repo']['full_name'] == repo
          }
          eligible = {}
          for pr in pages('/pulls?state=closed'):
              head = pr['head']
              if (pr['merged_at'] and head['repo'] and
                  head['repo']['full_name'] == repo and head['ref'] not in open_heads):
                  eligible[(head['ref'], head['sha'])] = pr['number']

          # Owner-approved retired heads audited 2026-11-14. Never match a
          # moved ref or an open/protected branch, and re-check ancestry.
          approved_retired = {
              'diag/nov13-ns2-loading-gpu-worker-progress': '88c8da8250c2b86e9334a819248650098608b315',
              'feature/nov13-jxr-selected-wallpaper-only': '194919c6022887e4da38d078ee92787a26bc40cc',
              'fix/nov13-lazy-library-square-home-art': '52c5645d5c3e994537938c681a0b9f16253b6925',
              'fix/nov13-psbc-nir-location-truncation': 'b50e379ec05cc89bf7ccf23b9f5e09b74c60fca4',
              'fix/nov14-ps5-leaf1-apic-topology-fallback': 'ecf411d15e6af4823a2cb194854f587b80776407',
              'fix/nov14-psbc-assert-only-warnings': 'db99c0711104e1527f361e6b2287ac0a04de2822',
              'fix/nov14-radv-ngg-mesh-zero-output-staged': '94a05e21e40fa3001fcc22fe16cb540f45d08371',
              'integration/nov14-motor-vendor-rc': '838a97f8da0079381e3652660d628adde9bbf788',
              'integration/nov14-native-storage-graph-rc8': 'f3218b6aa45aa9a00b99a06b06daf81d32574cb8',
              'integration/nov14-qualified-warning-rc9': '1ef60d07af8d2435f735c2f1364dbdfaf96fd7b8',
              'integration/nov14-romfs-jxr-rc6': '4215d2efeb1fa8fa8fec2dffb98092a441828b59',
              'integration/nov14-sirit-proof-reconcile-rc7': '2bcd64f18cbd6f582139e884e76bf50919dff842',
              'integration/nov14-spirv-scalar-cache-rc5': '560201fbdb04a3a1e5dfc466353e7cf1a7483981',
              'integration/nov14-spirv-scalar-rc5': 'a155697360a329cf269aa04bb4e0fd4031d4c6f1',
              # #124 source reconciliation: the old R457 home-icon branch is
              # superseded by newer main owners and currently points at the
              # fully integrated R458 ancestor. Keep the ancestry gate below.
              'fix/r457-home-canonical-icon-rail': 'c50d6abf32e6ce98d930bf42cf404815a0384855',
          }
          # Exact closed/unmerged heads superseded by merged #187. Their unique
          # commits were reviewed as obsolete rebase/fixture/vendor-pin receipts;
          # the final integration contains the maintained runtime/source owners.
          # This is deliberately an exact branch+SHA allowlist, never a pattern.
          approved_superseded = {
              'integrate/vendor-p0-diagnostics-nov14':
                  ('f5a6ddccec29a139311b993564617a2f7590ccab', 179),
              'integration/p0-vendor-ssa-fresh':
                  ('a2fad7ea3d99b9963ef7d347468a6e9dd2234fca', 183),
              'perf/fc27-ssa-engine-selection':
                  ('950dbf91125dbf419db9d1bccbf26b3465097326', 181),
              'perf/fc27-ssbo-engine-selection':
                  ('5374adcbf3a7a65c75729536bb794dee58fbbda9', 184),
              'perf/fc27-ssbo-pruning-fresh':
                  ('bce11d5f28a26e2a89c4461a49ce04993b7f392a', 185),
          }
          main_ref = next((item for item in branches if item['name'] == 'main'), None)
          if not main_ref:
              raise RuntimeError('Missing main branch in cleanup inventory')
          main_sha = main_ref['commit']['sha']
          removed = []
          skipped = []
          for branch in branches:
              name = branch['name']
              sha = branch['commit']['sha']
              pr_number = eligible.get((name, sha))
              if name in ('main', 'master') or branch.get('protected') or name in open_heads:
                  skipped.append(name)
                  continue
              if not pr_number and approved_retired.get(name) == sha:
                  compare = api(f'/compare/{sha}...{main_sha}')
                  if compare.get('status') in ('ahead', 'identical') and compare.get('behind_by') == 0:
                      pr_number = 'retired-ancestor'
              if not pr_number and name in approved_superseded:
                  approved_sha, superseded_pr = approved_superseded[name]
                  if approved_sha == sha:
                      pr_number = f'superseded-{superseded_pr}'
              if not pr_number:
                  skipped.append(name)
                  continue
              # Exact merged PR head SHA only; never delete later unmerged work.
              ref = quote('heads/' + name, safe='/')
              # Last-minute safety check for every deletion. If a branch
              # has moved, become protected or gained an open PR, retain it.
              current = api('/branches/' + quote(name, safe=''))
              if current['commit']['sha'] != sha or current.get('protected'):
                  skipped.append(name)
                  continue
              if any(p['head']['repo'] and p['head']['repo']['full_name'] == repo and
                     p['head']['ref'] == name for p in pages('/pulls?state=open')):
                  skipped.append(name)
                  continue
              # Verify that current main still contains the reviewed head
              # for explicitly retired refs (including after concurrent merges).
              if pr_number == 'retired-ancestor':
                  now_main = api('/branches/main')['commit']['sha']
                  compare = api(f'/compare/{sha}...{now_main}')
                  if compare.get('status') not in ('ahead', 'identical') or compare.get('behind_by') != 0:
                      skipped.append(name)
                      continue
              try:
                  api(f'/git/refs/{ref}', 'DELETE')
              except HTTPError as exc:
                  if exc.code == 404:
                      # Another serialized cleanup may have removed it after discovery.
                      print(f'ALREADY_REMOVED {name} PR #{pr_number}')
                      continue
                  raise RuntimeError(f'Cannot delete {name} (PR #{pr_number}): HTTP {exc.code}') from exc
              removed.append(f'{name} (receipt {pr_number})')
              print(f'DELETED {name} receipt={pr_number}')

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as out:
                  out.write('### Verified merged branch cleanup\n\n')
                  out.write(f'Deleted **{len(removed)}** verified merged heads. '
                            f'Retained **{len(skipped)}** (main/protected/open/unmatched) refs.\n\n')
                  for entry in removed:
                      out.write(f'- {entry}\n')
          print(f'CLEANUP_RESULT deleted={len(removed)} retained={len(skipped)}')
          PY
