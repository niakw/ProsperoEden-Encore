name: NS2 research host guards

on:
  push:
    branches:
      - research/ns2-ps5-compatibility
    paths:
      - 'headless/ns2/**'
      - 'headless/CMakeLists.txt'
      - 'tools/ns2/**'
      - 'tools/check-ns2-*.py'
      - '.github/workflows/ns2-research-host.yml'
      - 'docs/NS2_PS5_FEASIBILITY_2026-10-30.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ns2-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dynarmic-a64-syntax:
    name: Compile actual maintained A64 frontend with NS2 overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 1
      - name: Host Boost headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libboost-dev
      - name: Pinned fmt 12.1.0 headers (match Eden cpmfile.json)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 12.1.0 https://github.com/fmtlib/fmt.git build-ns2-a64/fmt
          test "$(git -C build-ns2-a64/fmt rev-parse HEAD)" = "407c905e45ad75fc29bf0f9bb7c5c2fd3475976f"
      - name: Copy selected experimental A64 sources like native CMake
        shell: bash
        run: |
          set -euo pipefail
          overlay=headless/ns2/dynarmic/dynarmic
          base=build-ns2-a64/include/dynarmic
          mkdir -p "$base/frontend/A64/decoder" "$base/frontend/A64/translate/impl"
          cp "$overlay/frontend/A64/decoder/a64.h" "$base/frontend/A64/decoder/a64.h"
          cp "$overlay/frontend/A64/decoder/a64.inc" "$base/frontend/A64/decoder/a64.inc"
          for name in a64_branch.cpp impl.h load_store_exclusive.cpp; do
            cp "$overlay/frontend/A64/translate/impl/$name" "$base/frontend/A64/translate/impl/$name"
          done
      - name: Syntax-check actual Encore A64 translator
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
            -DEDEN_NS2_A64_EXPERIMENTAL=1 \
            -Ibuild-ns2-a64/fmt/include \
            -Ibuild-ns2-a64/include \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/encore-active/eden-core/src/dynarmic/frontend/A64/translate/a64_translate.cpp
      - name: Syntax-check actual experimental NPDM and ExeFS loader owners
        shell: bash
        run: |
          set -euo pipefail
          for source in \
            headless/ns2/overrides/core/file_sys/program_metadata.cpp \
            headless/ns2/overrides/core/loader/loader.cpp \
            headless/ns2/overrides/core/loader/deconstructed_rom_directory.cpp; do
            echo "Checking: ${source}"
            clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
              -Ibuild-ns2-a64/fmt/include \
              -Iheadless/ns2/overrides \
              -Iheadless/ns2 \
              -Ivendor/sources/eden/src/dynarmic/src \
              -Ivendor/sources/eden/src \
              "${source}"
          done

      - name: Run actual ProgramMetadata parser against synthetic Switch 1/2 NPDM
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -O1 -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -ffunction-sections -fdata-sections -Wl,--gc-sections \
            -Ibuild-ns2-a64/fmt/include \
            -Iheadless/ns2/overrides -Iheadless/ns2 \
            -Ivendor/sources/eden/src/dynarmic/src -Ivendor/sources/eden/src \
            tools/ns2/test_program_metadata.cpp \
            headless/ns2/overrides/core/file_sys/program_metadata.cpp \
            -o build-ns2-a64/npdm-real-test
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            build-ns2-a64/npdm-real-test

  dynarmic-jit-execution:
    name: Execute actual Dynarmic x86-64 JIT atomic regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 1
      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build libboost-dev
      - name: Install Eden-pinned fmt/xbyak
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-ns2-jit
          git clone --depth 1 --branch 12.1.0 https://github.com/fmtlib/fmt.git build-ns2-jit/fmt
          git clone --depth 1 --branch v7.40.1 https://github.com/herumi/xbyak.git build-ns2-jit/xbyak
          test "$(git -C build-ns2-jit/fmt rev-parse HEAD)" = 407c905e45ad75fc29bf0f9bb7c5c2fd3475976f
          for pkg in fmt xbyak; do
            cmake -S "build-ns2-jit/$pkg" -B "build-ns2-jit/$pkg-build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DFMT_TEST=OFF \
              -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/build-ns2-jit/prefix"
            cmake --build "build-ns2-jit/$pkg-build" --parallel 2
            cmake --install "build-ns2-jit/$pkg-build"
          done
      - name: Copy research overlay into disposable vendor checkout
        shell: bash
        run: |
          set -euo pipefail
          original=vendor/sources/eden/src/dynarmic/src/dynarmic
          overlay=headless/ns2/dynarmic/dynarmic
          cp vendor/encore-active/eden-core/src/dynarmic/frontend/A64/translate/a64_translate.cpp \
             "$original/frontend/A64/translate/a64_translate.cpp"
          for path in frontend/A64/decoder/a64.h frontend/A64/decoder/a64.inc \
              frontend/A64/translate/impl/a64_branch.cpp \
              frontend/A64/translate/impl/impl.h \
              frontend/A64/translate/impl/load_store_exclusive.cpp; do
            cp "$overlay/$path" "$original/$path"
          done
      - name: Build actual x64 Dynarmic core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tools/ns2/jit-host -B build-ns2-jit/runtime -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build-ns2-jit/prefix"
          cmake --build build-ns2-jit/runtime --target ns2_lse_jit_test --parallel 2
      - name: Execute RETA/LDAPR/LSE memory and retry tests
        shell: bash
        run: |
          set -euo pipefail
          if ! ctest --test-dir build-ns2-jit/runtime --output-on-failure; then
            if command -v gdb; then
              gdb -batch -q -ex run -ex 'bt 24' --args build-ns2-jit/runtime/ns2_lse_jit_test || true
            fi
            exit 1
          fi

  research-host:
    name: NS2 parsing and source-owner guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Python syntax
        run: |
          python3 -m py_compile tools/check-ns2-npdm-host.py tools/check-ns2-source-selection.py tools/ns2_patch_inventory.py
      - name: Patch inventory parser self-test
        run: python3 tools/ns2_patch_inventory.py --self-test
      - name: Ensure the experimental compiler selectors preserve the PS5/NCZ owners
        run: python3 tools/check-ns2-source-selection.py
      - name: Run C++20 ACID layout host regressions (Clang and GCC)
        shell: bash
        run: |
          set -euo pipefail
          command -v clang++
          command -v g++
          python3 tools/check-ns2-npdm-host.py
          PATH="/usr/bin:/bin" python3 tools/check-ns2-npdm-host.py
      - name: Test real Dynarmic RETAA/RETAB decoder table
        run: python3 tools/check-ns2-reta-host.py
      - name: Compile and run upstream Ampere ISA/address-map host probes
        run: |
          python3 tools/check-ns2-ampere-host.py
      - name: Explain scope
        run: |
          echo "Research host checks only: no full Dynarmic, Eden native PS5 build, game or console claims."
