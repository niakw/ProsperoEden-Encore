name: A/B NS1 staged vendor patchset integrity (read-only)

on:
  pull_request:
    paths:
      - "docs/audits/patchsets/**"
      - "tools/audit/verify-ab-ns1-corrective-patchsets.py"
      - "tools/audit/check-c04-page-signbits-host.py"
      - ".github/workflows/ab-ns1-corrective-patchsets.yml"
  workflow_dispatch:
  push:
    branches:
      - dev/ab-ns1-corrective-batches-2026-11-10
    paths:
      - ".github/workflows/ab-ns1-corrective-patchsets.yml"
      - "tools/audit/verify-ab-ns1-corrective-patchsets.py"
      - "tools/audit/check-c04-page-signbits-host.py"
      - "docs/audits/patchsets/**"

permissions:
  contents: read

concurrency:
  group: ab-ns1-patchsets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout isolated corrective branch and exact gitlink
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          # Freeze the isolated PR head; pull_request default is a moving merge tree.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Validate C01/C02/C04 and staged R23 viewport/root/glslang/FW23 patches; freeze C03 blobs
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/audit/verify-ab-ns1-corrective-patchsets.py > patchset-witness.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          note = json.loads(Path("patchset-witness.json").read_text())
          assert note["vendor_worktree_clean"]
          assert note["vendor_gitlink"] == "22b69d6053db41b74edac2633c012f925b84f69e"
          assert all(note["units"][key]["patch_staged_and_context_valid"]
                     for key in ("C01", "C02", "C04-SDIV32", "C04-SQSHLU", "C04-A32-SIGNEXT", "C04-PAGETABLE-BIT55", "R23-viewport", "R23-path-root", "R23-glslang-include", "R23-fw23-ns-cmd23"))
          assert all(not row["patch_applied"] and not row["compiled"] and
                     not row["tested_on_ps5"] for row in note["units"].values())
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## A/B NS1 patchset integrity\n")
              out.write("C01/C02/C04, including A32 sign-extension and PageTable bit55 patches, plus R23 context checks passed with exact pinned vendor Git blobs.\n")
              out.write("C03 RADV three-source SHA provenance confirmed. R23 viewport exists in generator only, not active maintained native rasterizer.\n")
              out.write("**No vendor source edits, compiler invocation, ELF or PS5 test.**\n")
          PY
          python3 -B tools/audit/check-c04-page-signbits-host.py
          git -C vendor status --porcelain

      - name: Upload read-only patch provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ab-ns1-patchset-provenance
          path: patchset-witness.json
          if-no-files-found: error
          retention-days: 30
