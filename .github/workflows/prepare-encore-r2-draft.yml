name: Prepare Encore R2 release draft (no build or assets)
on:
  push:
    branches:
      - release/encore-r2-draft-20261109
    paths:
      - 'docs/releases/ENCORE_R2_DRAFT_2026-11-09.md'
      - '.github/workflows/prepare-encore-r2-draft.yml'
permissions:
  contents: write
jobs:
  create-private-draft:
    name: Create hidden prerelease draft from approved notes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout draft release notes only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout exact source candidate (documentation only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
          ref: 'ec8b519182532d3864c5a67dd27aa41aa9d43ff3'
          path: source-candidate
      - name: Validate locale manuals in pinned prerelease source snapshot
        run: python3 -B source-candidate/tools/check-user-doc-locales.py
      - name: Create unpublished prerelease draft without assets or native build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET_SHA: 'ec8b519182532d3864c5a67dd27aa41aa9d43ff3'
          RELEASE_TAG: 'encore-R2-preview-20261109'
        shell: bash
        run: |
          set -euo pipefail
          # Draft releases have temporary "untagged-..." URLs; the stable
          # release ID is the only unambiguous way to update and verify them.
          release_id=438869174
          result="$(gh api "repos/$GH_REPO/releases/$release_id")"
          printf '%s' "$result" | jq -e '.draft == true and .prerelease == true and (.assets | length) == 0' >/dev/null
          gh api -X PATCH "repos/$GH_REPO/releases/$release_id" \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$RELEASE_TARGET_SHA" \
            -f name='Eden Encore R2 Preview — R457 CI native candidate (draft)' \
            -f body="$(cat docs/releases/ENCORE_R2_DRAFT_2026-11-09.md)" \
            -F draft=true -F prerelease=true >/dev/null
          result="$(gh api "repos/$GH_REPO/releases/$release_id")"
          printf '%s' "$result" | jq -e '.id == 438869174 and .draft == true and .prerelease == true and (.assets | length) == 0' >/dev/null
          printf '%s' "$result" | jq '{id, tag_name, target_commitish, draft, prerelease, assets_count:(.assets|length), html_url}'
