name: Prune completed Encore branches (SHA guarded)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/encore-overlay-pr32-cleanup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prune-merged-and-contained:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prune only pinned unchanged heads with no unique work or merged PR
        shell: bash
        run: |
          set -euo pipefail
          # Keep in-flight H01 and G10 development and all unknown branches.
          while IFS='|' read -r branch expected; do
            [[ -n "$branch" ]] || continue
            current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null || true)"
            if [[ -z "$current" ]]; then echo "Already absent: $branch"; continue; fi
            if [[ "$current" != "$expected" ]]; then
              echo "Ref changed, preserving: $branch"
              continue
            fi
            open="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=niakw:${branch}&per_page=100" --jq 'length')"
            if [[ "$open" != "0" ]]; then echo "Open PR, preserving: $branch"; continue; fi
            merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=closed&head=niakw:${branch}&per_page=100" | jq --arg sha "$expected" '[.[] | select(.merged_at != null and .head.sha == $sha)] | length')"
            ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${branch}" --jq '.ahead_by' 2>/dev/null || true)"
            if [[ "$merged" == "0" && "$ahead" != "0" ]]; then
              echo "No merged PR and uncontained changes, preserving: $branch"
              continue
            fi
            # Recheck just before deletion; GH REST has no compare-and-delete.
            again="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null || true)"
            if [[ "$again" != "$expected" ]]; then echo "Moved during check: $branch"; continue; fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted fully qualified branch: $branch"
          done <<'PINNED_HEADS'
          feat/h05-real-vulkan-guest-release-chain-20261110|e235d3e19f0980badd1ab7d0c48d0733aef198fd
          fix/h01-kprocess-oom-owner-proof-20261110|ee49f80a6ea02525dcddd687b5e77c3f59ea339e
          fix/h01-late-run-retirement-owner-proof-20261110|833e91a54d3dd84e28906e55415bcd28759c6990
          fix/h01-n52-source-audit-normalization-20261110|d64aa11f8a886f0b92cff2b737c4e914c044bf5c
          fix/h01-real-shipping-kprocess-metadata-test-20261110|629c9710d9d3a020216b01a7e73233cf98cc7fde
          fix/h01-romfs-pretrace-owner-proof-20261110|693129288028f70075d06f6a6a5696099faa3336
          PINNED_HEADS
