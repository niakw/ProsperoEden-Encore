name: Remove merged R2 draft branch (one-shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-r2-draft-branch.yml'
permissions:
  contents: write
jobs:
  remove-merged-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify exact branch and merge ancestry before deletion
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          expected_branch_sha='25fa7ab59ac96929a420d82c67ab78b7adcc1e31'
          confirmed_merge_sha='2f35b6ad4c01871c67b85c69c2a61cb6aa009d93'
          path="repos/$GH_REPO/git/ref/heads/release/encore-r2-draft-20261109"
          actual="$(gh api "$path" --jq '.object.sha')"
          test "$actual" = "$expected_branch_sha"
          gh api "repos/$GH_REPO/git/commits/$confirmed_merge_sha" |
            jq -e --arg sha "$expected_branch_sha" '.parents | any(.sha == $sha)' >/dev/null
          comparison="$(gh api "repos/$GH_REPO/compare/$confirmed_merge_sha...${GITHUB_SHA}" --jq '.status')"
          test "$comparison" = 'ahead' -o "$comparison" = 'identical'
          echo "Exact draft head and merge ancestry confirmed; safe to delete."
      - name: Delete merged draft branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/release/encore-r2-draft-20261109"
          if gh api "repos/$GH_REPO/git/ref/heads/release/encore-r2-draft-20261109" >/dev/null 2>&1; then
            echo "ERROR: merged release branch still exists" >&2
            exit 1
          fi
          echo "R2_DRAFT_MERGED_BRANCH_DELETED"
