name: A/B R23 actual path sanitizer source A/B host (no PS5 build)

on:
  pull_request:
    paths:
      - "tests/audit_r23_path_sanitizer_host.cpp"
      - ".github/workflows/audit-r23-path-sanitizer-host.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ab-r23-fs-path-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-path-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout frozen audit head and unchanged vendor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify unmodified original Eden source Git blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor rev-parse HEAD)" = "22b69d6053db41b74edac2633c012f925b84f69e"
          test "$(git -C vendor hash-object sources/eden/src/common/fs/path_util.cpp)" = "b4c7eae343df49eaae5327c5efa04a8d13dc4e19"
          test "$(git -C vendor hash-object encore-active/eden-core/src/common/fs/path_util.cpp)" = "d473cfb2fd57e7026a1da3cd6aa933e75b208b66"
          # The historical native compile database schedules this maintained
          # source, not the pristine snapshot. Compare its exact function body.
          python3 -B - <<'PY'
          from pathlib import Path
          old = Path("vendor/sources/eden/src/common/fs/path_util.cpp").read_text()
          selected = Path("vendor/encore-active/eden-core/src/common/fs/path_util.cpp").read_text()
          fixture = Path("tests/audit_r23_path_sanitizer_host.cpp").read_text()
          start = "std::string SanitizePath("
          end = "\\nstd::string GetParentPath("
          def method(src):
              i = src.index(start)
              return src[i:src.index(end, i)].strip()
          original = method(old)
          maintained = method(selected)
          compiled = fixture.split("namespace Pinned {", 1)[1].split("\\n}\nnamespace Upstream {", 1)[0].strip()
          assert original == maintained == compiled, "native selected FS function drift"
          print("R23_FS_SELECTED_NATIVE_MAINTAINED_METHOD_EXACT_BYTES_PASS")
          PY
          grep -Fq 'blob b4c7eae343df49eaae5327c5efa04a8d13dc4e19' tests/audit_r23_path_sanitizer_host.cpp
          grep -Fq 'blob 82ea8f6cb2b3d365b0e3a96457694a81bb0bec7f' tests/audit_r23_path_sanitizer_host.cpp

      - name: Build and execute source-extracted pinned and upstream FS functions under sanitizers
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/audit_r23_path_sanitizer_host.cpp -o /tmp/audit-r23-path
          /tmp/audit-r23-path
          echo "9 source-extracted pinned/maintained/upstream SanitizePath cases, compiled on host under ASan/UBSan." >> "$GITHUB_STEP_SUMMARY"
          echo "Path behavior differs on roots and leading parent components; no PS5 runtime or filesystem security signoff." >> "$GITHUB_STEP_SUMMARY"
