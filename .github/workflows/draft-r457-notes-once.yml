name: One-shot update unpublished R457 draft notes
on:
  push:
    branches: [main]
    paths:
      - docs/audits/ENCORE_DRAFT_RELEASE_CHANGELOG_2026-11-12.md
permissions:
  contents: write
jobs:
  synchronize-draft:
    if: github.repository == 'niakw/ProsperoEden-Encore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Refresh existing draft release without publishing assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          repo='niakw/ProsperoEden-Encore'
          release_id='438869174'
          current=json.loads(subprocess.check_output(
              ['gh','api',f'repos/{repo}/releases/{release_id}'],text=True))
          assert current['draft'] is True, 'Refuse to edit published release'
          assert current['tag_name']=='encore-R2-preview-20261109', 'Wrong draft'
          marker='\n\n## 12 November 2026 — production addendum'
          previous=(current.get('body') or '').split(marker)[0].rstrip()
          addendum=Path('docs/audits/ENCORE_DRAFT_RELEASE_CHANGELOG_2026-11-12.md').read_text()
          payload={'draft':True,'prerelease':True,
                   'name':'Eden Encore R457 — NS1/NS2 native development preview (DRAFT)',
                   'body':previous+marker+'\n\n'+addendum}
          if payload['body']==current.get('body'):
              print('R457_DRAFT_NOTES_ALREADY_CURRENT')
          else:
              p=Path('/tmp/encore-draft-notes-update.json')
              p.write_text(json.dumps(payload,ensure_ascii=False))
              subprocess.run(['gh','api','--method','PATCH',
                  f'repos/{repo}/releases/{release_id}',
                  '--input',str(p)],check=True,stdout=subprocess.DEVNULL)
          verify=json.loads(subprocess.check_output(
              ['gh','api',f'repos/{repo}/releases/{release_id}'],text=True))
          assert verify['draft'] is True and verify['prerelease'] is True
          assert verify['body'].endswith(addendum)
          assert not verify.get('assets'), 'Draft unexpectedly acquired assets'
          print('ENCORE_R457_DRAFT_NOTES_VERIFIED unpublished=1 assets=0')
          PY
