name: NS2 research host guards

on:
  push:
    branches:
      - research/ns2-ps5-compatibility
    paths:
      - 'headless/ns2/**'
      - 'headless/CMakeLists.txt'
      - 'tools/ns2/**'
      - 'tools/check-ns2-*.py'
      - '.github/workflows/ns2-research-host.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ns2-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dynarmic-a64-syntax:
    name: Compile actual maintained A64 frontend with NS2 overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 1
      - name: Host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfmt-dev libboost-dev
      - name: Copy selected experimental A64 sources like native CMake
        shell: bash
        run: |
          set -euo pipefail
          overlay=headless/ns2/dynarmic/dynarmic
          base=build-ns2-a64/include/dynarmic
          mkdir -p "$base/frontend/A64/decoder" "$base/frontend/A64/translate/impl"
          cp "$overlay/frontend/A64/decoder/a64.h" "$base/frontend/A64/decoder/a64.h"
          cp "$overlay/frontend/A64/decoder/a64.inc" "$base/frontend/A64/decoder/a64.inc"
          for name in a64_branch.cpp impl.h load_store_exclusive.cpp; do
            cp "$overlay/frontend/A64/translate/impl/$name" "$base/frontend/A64/translate/impl/$name"
          done
      - name: Syntax-check actual Encore A64 translator
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
            -DEDEN_NS2_A64_EXPERIMENTAL=1 \
            -Ibuild-ns2-a64/include \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/encore-active/eden-core/src/dynarmic/frontend/A64/translate/a64_translate.cpp

  research-host:
    name: NS2 parsing and source-owner guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Python syntax
        run: |
          python3 -m py_compile tools/check-ns2-npdm-host.py tools/check-ns2-source-selection.py tools/ns2_patch_inventory.py
      - name: Patch inventory parser self-test
        run: python3 tools/ns2_patch_inventory.py --self-test
      - name: Ensure the experimental compiler selectors preserve the PS5/NCZ owners
        run: python3 tools/check-ns2-source-selection.py
      - name: Run C++20 ACID layout host regressions (Clang and GCC)
        shell: bash
        run: |
          set -euo pipefail
          command -v clang++
          command -v g++
          python3 tools/check-ns2-npdm-host.py
          PATH="/usr/bin:/bin" python3 tools/check-ns2-npdm-host.py
      - name: Test real Dynarmic RETAA/RETAB decoder table
        run: python3 tools/check-ns2-reta-host.py
      - name: Explain scope
        run: |
          echo "Research host checks only: no full Dynarmic, Eden native PS5 build, game or console claims."
