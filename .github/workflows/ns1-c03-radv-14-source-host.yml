name: NS1 C03 active RADV host preflight (no PS5 build)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c03-selected-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout engine and current vendor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Verify current graphics-driver override and seven split sites
        run: |
          set -euo pipefail
          python3 -B tools/check-active-cmake-source-boundary.py
          python3 -B vendor/tests/c03_radv_transfer_split.py
          python3 -B tools/check-vendored-radv-fork.py
          python3 -B tools/radv-active-inputs.py --self-test
          echo "C03 source/host only: no native PS5 GPU execution." >> "$GITHUB_STEP_SUMMARY"
