name: P5 native preflight focused host checks

on:
  push:
    branches: [main]
    paths:
      - 'vendor'
      - '.github/workflows/p5-native-preflight-host.yml'
      - 'tools/check-jit-stability.py'
      - 'tools/check-performance.py'
      - 'tools/check-native-gpu-thread.py'
      - 'tools/ci/check-staged-app.py'
      - 'tools/check-nlib-ui-recovery.py'
      - 'tools/package-headless-native.sh'
      - 'headless/CMakeLists.txt'
      - 'headless/inject.cmake'
      - 'tools/check-active-cmake-source-boundary.py'
      - 'tools/ns2/check_cpu6_scheduler_tick_host.py'
      - 'tools/check-native-launcher-ui-host.py'
      - 'tools/check-post-f07-delta-register.py'
      - 'docs/EDEN_POST_F07_CHANGED_SOURCE_REGISTER_2026-11-08.json'
      - 'headless/main.cpp'
      - 'headless/prosperoeden/pe/ui/services.hpp'
      - 'headless/prosperoeden/pe/ui/launcher.cpp'
      - 'headless/prosperoeden/eden_services.cpp'
      - 'headless/prosperoeden/pe/ui/library.cpp'
  pull_request:
    paths:
      - 'tools/check-native-gpu-thread.py'
      - 'tools/ci/ps5_g21_gpu_shutdown_receipt.py'
      - '.github/workflows/p5-native-preflight-host.yml'
      - 'vendor'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5-native-host-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-owners:
    name: Check production JIT and native media/storage owners before expensive build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 1
      - name: Verify P5 native CMake ownership before expensive build
        run: python3 -B tools/check-active-cmake-source-boundary.py
      - name: Verify post-F07 reviewed file hashes before expensive host C++
        run: python3 -B tools/check-post-f07-delta-register.py
      - name: Check native launcher C++ namespaces and real update initializers
        run: python3 -B tools/check-native-launcher-ui-host.py
      - name: Verify CPU6 G11 source chain, four CMake profiles, real C++ units and UBSan ticks
        run: python3 -B tools/ns2/check_cpu6_scheduler_tick_host.py
      - name: Verify native performance checker uses shipping JIT, not retired experiment options
        run: python3 -B tools/check-performance.py --source-only
      - name: Check maintained native GPU channel/loading and G21 shutdown ownership
        run: python3 -B tools/check-native-gpu-thread.py --source-only
      - name: Exercise five actual selected GPU destructor bodies with host sanitizers
        run: python3 -B vendor/tests/ps5_gpu_renderer_channel_teardown_host.py
      - name: Verify production JIT owner, no experimental build selector, and package policy
        run: python3 -B tools/check-jit-stability.py
      - name: Execute maintained ROM-storage and Nlib media tests with host C++ compiler
        run: python3 -B tools/check-nlib-ui-recovery.py
