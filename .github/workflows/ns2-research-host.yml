name: NS2 research host guards

on:
  push:
    branches:
      - research/ns2-ps5-compatibility
    paths:
      - 'vendor'
      - 'vendor/**'
      - 'headless/CMakeLists.txt'
      - 'tools/ns2/**'
      - 'tools/check-ns2-*.py'
      - '.github/workflows/ns2-research-host.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ns2-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dynarmic-a64-syntax:
    name: Compile actual maintained A64 frontend with NS2 overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 1
      - name: Host Boost headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libboost-dev
      - name: N65 query actual sparse image tile/miptail memory requirements (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_egl_sparse_requirements_owner.py
      - name: N66/N67 execute native sparse queue submission and semaphore handoff (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_native_sparse_bind.py
      - name: N64 native PS5 VkImage sparse 2D array factory source and Vulkan driver mock
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_egl_sparse_image_owner.py
      - name: N75 generation-independent shared GPU/CPU pool budget (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_shared_gpu_budget.py
      - name: N73 native sparse cache full-residency admission (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_sparse_cache_admission.py
      - name: N72 native scheduler sparse queue lock and submit ordering (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_native_sparse_scheduler.py
      - name: N69 native VMA sparse transaction and device-idle retirement (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_sparse_vma_bind.py
      - name: N63/N68 sparse layer budget and bounded tile/mip-tail coordinates (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_sparse_layer_budget.py
      - name: N62 PS5 native Vulkan sparse VMA allocation and rollback (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_egl_sparse_vma_owner.py
      - name: Pinned fmt 12.1.0 headers (match Eden cpmfile.json)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 12.1.0 https://github.com/fmtlib/fmt.git build-ns2-a64/fmt
          test "$(git -C build-ns2-a64/fmt rev-parse HEAD)" = "407c905e45ad75fc29bf0f9bb7c5c2fd3475976f"
      - name: Copy selected experimental A64 sources like native CMake
        shell: bash
        run: |
          set -euo pipefail
          overlay=vendor/encore-active/ns2-a64/dynarmic
          base=build-ns2-a64/include/dynarmic
          mkdir -p "$base/frontend/A64/decoder" "$base/frontend/A64/translate/impl"
          cp "$overlay/frontend/A64/decoder/a64.h" "$base/frontend/A64/decoder/a64.h"
          cp "$overlay/frontend/A64/decoder/a64.inc" "$base/frontend/A64/decoder/a64.inc"
          for name in a64_branch.cpp impl.h load_store_exclusive.cpp; do
            cp "$overlay/frontend/A64/translate/impl/$name" "$base/frontend/A64/translate/impl/$name"
          done
      - name: Syntax-check actual Encore A64 translator
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
            -DEDEN_NS2_A64_EXPERIMENTAL=1 \
            -Ibuild-ns2-a64/fmt/include \
            -Ibuild-ns2-a64/include \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/encore-active/eden-core/src/dynarmic/frontend/A64/translate/a64_translate.cpp
      - name: Exercise real NS2 ExeFS NSO0 preflight with GCC and Clang
        shell: bash
        run: |
          set -euo pipefail
          for compiler in clang++ g++; do
            "${compiler}" -std=c++20 -O2 -Wall -Wextra -Werror \
              -fsanitize=undefined -fno-sanitize-recover=all \
              -Ivendor/encore-active/ns2-helpers/include -Ivendor/encore-active/ns2-experimental/src \
              tools/ns2/test_nso_preflight.cpp \
              -o "build-ns2-a64/nso-preflight-${compiler//+/}"
            "build-ns2-a64/nso-preflight-${compiler//+/}"
          done
      - name: Verify read-only NSO-to-KProcess handoff contract (Clang and GCC)
        shell: bash
        run: |
          set -euo pipefail
          for compiler in clang++ g++; do
            "${compiler}" -std=c++20 -O2 -Wall -Wextra -Werror \
              -fsanitize=undefined -fno-sanitize-recover=all \
              -Ivendor/encore-active/ns2-helpers/include -Ivendor/encore-active/ns2-experimental/src \
              tools/ns2/test_nso_process_handoff.cpp \
              -o "build-ns2-a64/handoff-${compiler//+/}"
            "build-ns2-a64/handoff-${compiler//+/}"
          done
      - name: Guard ExeFS to KProcess signed-page admission (Clang and GCC)
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'code_num_pages = static_cast<s32>(code_size / PageSize)' \
            vendor/sources/eden/src/core/hle/kernel/k_process.cpp
          for compiler in clang++ g++; do
            "${compiler}" -std=c++20 -O2 -Wall -Wextra -Werror \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              -Ivendor/encore-active/ns2-helpers/include -Ivendor/encore-active/ns2-experimental/src \
              tools/ns2/test_kprocess_code_admission.cpp \
              -o "build-ns2-a64/kprocess-code-${compiler//+/}"
            "build-ns2-a64/kprocess-code-${compiler//+/}"
          done
      - name: Compile maintained SVC owner and test bounded native trace
        shell: bash
        run: |
          set -euo pipefail
          for compiler in clang++ g++; do
            "${compiler}" -std=c++20 -Wall -Wextra -Werror -O2 \
              -fsanitize=undefined -fno-sanitize-recover=all \
              -Ivendor/encore-active/ns2-helpers/include \
              tools/ns2/test_svc_trace.cpp \
              -o "build-ns2-a64/svc-trace-${compiler//+/}"
            "build-ns2-a64/svc-trace-${compiler//+/}"
          done
          clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
            -DEDEN_NS2_SVC_TRACE=1 \
            -Ibuild-ns2-a64/fmt/include \
            -Ivendor/encore-active/ns2-helpers/include \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/sources/eden/src/core/hle/kernel/svc.cpp
      - name: Syntax-check actual experimental NPDM and ExeFS loader owners
        shell: bash
        run: |
          set -euo pipefail
          for source in \
            vendor/encore-active/ns2-experimental/src/core/file_sys/program_metadata.cpp \
            vendor/encore-active/ns2-experimental/src/core/loader/loader.cpp \
            vendor/encore-active/ns2-experimental/src/core/loader/deconstructed_rom_directory.cpp \
            vendor/encore-active/ns2-experimental/src/core/loader/nso.cpp; do
            echo "Checking: ${source}"
            clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
              -Ibuild-ns2-a64/fmt/include \
              -Iheadless \
              -Ivendor/encore-active/ns2-helpers/include -Ivendor/encore-active/ns2-experimental/src \
              -Ivendor/encore-active/ns2-helpers/include \
              -Ivendor/sources/eden/src/dynarmic/src \
              -Ivendor/sources/eden/src \
              "${source}"
          done

      - name: Compile actual maintained AM command 320 overlay
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
            -Ibuild-ns2-a64/fmt/include \
            -Ivendor/encore-active/ns2-runtime/am \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/encore-active/ns2-runtime/am/core/hle/service/am/service/application_functions.cpp
      - name: Syntax-check real AM application proxy command 60 and graphics scaling service
        shell: bash
        run: |
          set -euo pipefail
          for source in application_proxy.cpp graphics_scaling_parameters_functions.cpp; do
            clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
              -Ibuild-ns2-a64/fmt/include \
              -Ivendor/encore-active/ns2-runtime/am \
              -Ivendor/sources/eden/src/dynarmic/src \
              -Ivendor/sources/eden/src \
              "vendor/encore-active/ns2-runtime/am/core/hle/service/am/service/${source}"
          done
      - name: Syntax-check real Switch 2 GPU TIPC service owner
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
            -Ibuild-ns2-a64/fmt/include \
            -Ivendor/encore-active/ns2-runtime/gpu_session \
            -Ivendor/encore-active/ns2-runtime/hle \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/encore-active/ns2-runtime/gpu_session/core/hle/service/am/service/gpu_session.cpp
          clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
            -Ibuild-ns2-a64/fmt/include \
            -Ivendor/encore-active/ns2-runtime/gpu_session \
            -Ivendor/encore-active/ns2-runtime/hle \
            -Ivendor/encore-active/ns2-runtime/nvdrv_as \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/encore-active/ns2-runtime/gpu_session/core/hle/service/am/service/gpu_worker.cpp
          clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
            -Ibuild-ns2-a64/fmt/include \
            -Ivendor/encore-active/ns2-runtime/gpu_session \
            -Ivendor/encore-active/ns2-runtime/hle \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/encore-active/ns2-runtime/gpu_session/core/hle/service/am/service/gpu_worker_shared.cpp
      - name: Syntax-check real NS2 SelfController and GraphicsSupervisor IPC services
        shell: bash
        run: |
          set -euo pipefail
          for source in \
            vendor/encore-active/ns2-runtime/self_controller/core/hle/service/am/service/self_controller.cpp \
            vendor/encore-active/ns2-runtime/graphics_supervisor/core/hle/service/am/service/graphics_supervisor.cpp; do
            clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
              -Ibuild-ns2-a64/fmt/include \
              -Ivendor/encore-active/ns2-runtime/self_controller \
              -Ivendor/encore-active/ns2-runtime/graphics_supervisor \
              -Ivendor/encore-active/ns2-runtime/gpu_session \
              -Ivendor/encore-active/ns2-runtime/hle \
              -Ivendor/sources/eden/src/dynarmic/src \
              -Ivendor/sources/eden/src \
              "${source}"
          done
      - name: Syntax-check native NVDRV GPU ioctl source owner (GCC)
        shell: bash
        run: |
          set -euo pipefail
          # Clang 18 CI crashes while instantiating the pre-existing
          # ioctl_serialization.h WrapFixedInlOut constrained template.
          # Test this exact owner with a second real C++20 frontend instead.
          g++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
            -Ibuild-ns2-a64/fmt/include \
            -Ivendor/encore-active/ns2-runtime/nvdrv \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/encore-active/ns2-runtime/nvdrv/core/hle/service/nvdrv/devices/nvhost_ctrl_gpu.cpp
      - name: Syntax-check real process-scoped native GPFIFO channel owner (GCC)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
            -Ibuild-ns2-a64/fmt/include \
            -Ivendor/encore-active/ns2-runtime/nvdrv_gpu \
            -Ivendor/encore-active/ns2-runtime/nvdrv_as \
            -Ivendor/encore-active/ns2-runtime/nvdrv \
            -Ivendor/encore-active/ns2-runtime/hle \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/encore-active/ns2-runtime/nvdrv_gpu/core/hle/service/nvdrv/devices/nvhost_gpu.cpp
      - name: Compile and run native GPFIFO process and fence host regressions
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra \
            -Ivendor/encore-active/ns2-runtime/hle \
            tools/ns2/test_native_gpu_submission.cpp \
            -o build-ns2-a64/native-gpfifo-test
          build-ns2-a64/native-gpfifo-test
      - name: Syntax-check experimental native 4KiB NVDRV address-space owner (GCC)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
            -Ibuild-ns2-a64/fmt/include \
            -Ivendor/encore-active/ns2-runtime/nvdrv_as \
            -Ivendor/encore-active/ns2-runtime/hle \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/encore-active/ns2-runtime/nvdrv_as/core/hle/service/nvdrv/devices/nvhost_as_gpu.cpp
      - name: Compile/run native GPU characteristics IOCTL host fixtures
        run: python3 tools/check-ns2-native-gpu-ioctl-host.py
      - name: Compile and run upstream Ampere ISA/address-map host probes
        run: |
          python3 tools/check-ns2-ampere-host.py
      - name: Verify pinned PS5 NCZBLOCK reader and source-owner preservation
        shell: bash
        run: |
          set -euo pipefail
          test -f headless/ncz.cpp
          test -f headless/ncz.h
          test -f vendor/encore-active/eden-core/src/core/file_sys/submission_package.cpp
          test -f vendor/encore-active/eden-core/src/core/loader/nsp.cpp
          grep -Fq 'NCZBLOCK' headless/ncz.h
          grep -Fq '::Eden::Ncz::Open(' vendor/encore-active/eden-core/src/core/file_sys/submission_package.cpp
          grep -Fq '".ncz"' vendor/encore-active/eden-core/src/core/loader/nsp.cpp
          grep -Fq 'NCZ/XCZ' headless/CMakeLists.txt
      - name: Compile and run real Ampere 128-bit ISA decoder (Clang and GCC)
        shell: bash
        run: |
          set -euo pipefail
          for cxx in clang++ g++; do
            "$cxx" -std=c++20 -O2 -Wall -Wextra -Werror \
              -Ivendor/encore-active/ns2-runtime/ampere \
              -Ivendor/sources/eden/src \
              tools/ns2/test_ampere_isa_probe.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/probe.cpp \
              -o "build-ns2-a64/ampere-isa-${cxx//+/}"
            "build-ns2-a64/ampere-isa-${cxx//+/}"
          done
      - name: Compile and run real Ampere-to-Maxwell lowering (Clang and GCC)
        shell: bash
        run: |
          set -euo pipefail
          for cxx in clang++ g++; do
            "$cxx" -std=c++20 -O1 -Wall -Wno-unused-parameter \
              -Ivendor/encore-active/ns2-runtime/ampere \
              -Ivendor/sources/eden/src \
              tools/ns2/test_ampere_lower_bridge.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/probe.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/lower_bridge.cpp \
              -o "build-ns2-a64/ampere-lower-${cxx//+/}"
            "build-ns2-a64/ampere-lower-${cxx//+/}"
          done
      - name: NS2 N49 upstream-derived owner parity and 3D image view / R0 shader regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_egl_view_overlay.py
          for cxx in clang++ g++; do
            "${cxx}" -std=c++20 -O2 -Wall -Wextra -Werror -fsanitize=undefined \
              -Ivendor/encore-active/ns2-helpers/include tools/ns2/test_egl_view_type.cpp \
              -o "build-ns2-a64/egl-view-${cxx//+/}"
            "build-ns2-a64/egl-view-${cxx//+/}"
            "${cxx}" -std=c++20 -O1 -Wall -Wno-unused-parameter \
              -Ivendor/encore-active/ns2-runtime/ampere -Ivendor/sources/eden/src \
              tools/ns2/test_egl_ampere_ret.cpp \
              -o "build-ns2-a64/egl-ret-${cxx//+/}"
            "build-ns2-a64/egl-ret-${cxx//+/}"
          done
      - name: N61 2400-frame ASTC texture freshness and injected failure stress
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_astc_frame_churn.py
      - name: N60 real texture-cache dirty-write and partial-ASTC source-owner parity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_egl_astc_texture_cache.py
      - name: N59 bounded ASTC staging transactions and write-race failover (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_egl_astc_staging_bridge.py
      - name: N58 native Vulkan sparse-residency feature and queue admission
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_egl_sparse_device_owner.py
      - name: N57 native PS5 ASTC image layers and compute source parity (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_egl_astc_layer_decode.py
      - name: N56 PS5 native Vulkan driver-cache short-header source guard (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_egl_pipeline_cache.py
      - name: N55 ASTC selective layer planner and bounded staging oracle (Clang/GCC)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_egl_astc_layer_plan.py
      - name: N54 native ASTC scratch source extraction and lifecycle (Clang and GCC ASan)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_astc_scratch_owner.py
      - name: N52 verify and execute real Service Process Run with kernel errors
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_process_run_owner.py
          python3 tools/ns2/test_process_run_source.py
          clang++ -std=c++20 -fsyntax-only -Wno-unused-parameter \
            -Ibuild-ns2-a64/fmt/include \
            -DEDEN_NS2_PROCESS_RUN_GUARD=1 -Ivendor/encore-active/ns2-helpers/include -Ivendor/encore-active/ns2-experimental/src \
            -Ivendor/sources/eden/src/dynarmic/src \
            -Ivendor/sources/eden/src \
            vendor/sources/eden/src/core/hle/service/os/process.cpp
      - name: NS2 N51 native GPU PTE batching source parity and host oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_egl_gpu_range_batch.py
          for cxx in clang++ g++; do
            "${cxx}" -std=c++20 -O2 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all -Ivendor/encore-active/ns2-helpers/include tools/ns2/test_egl_gpu_range_batch.cpp -o "build-ns2-a64/n51-gpu-${cxx//+/}"
            "build-ns2-a64/n51-gpu-${cxx//+/}"
          done
      - name: NS2 N50 real PS5 memory owner parity and remap-run regression
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ns2/check_egl_continuity.py
          for cxx in clang++ g++; do
            "${cxx}" -std=c++20 -O2 -Wall -Wextra -Werror -fsanitize=undefined \
              -Ivendor/encore-active/ns2-helpers/include tools/ns2/test_egl_continuity.cpp \
              -o "build-ns2-a64/egl-continuity-${cxx//+/}"
            "build-ns2-a64/egl-continuity-${cxx//+/}"
          done
      - name: Compile and run Maxwell shader-environment image adapter (Clang and GCC)
        shell: bash
        run: |
          set -euo pipefail
          for cxx in clang++ g++; do
            "$cxx" -std=c++20 -O1 -Wall -Wextra -Wno-unused-parameter \
              -Ivendor/encore-active/ns2-runtime/ampere \
              -Ivendor/sources/eden/src \
              tools/ns2/test_ampere_maxwell_image.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/probe.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/lower_bridge.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/maxwell_image.cpp \
              -o "build-ns2-a64/ampere-image-${cxx//+/}"
            "build-ns2-a64/ampere-image-${cxx//+/}"
          done
      - name: Compile and run bounded guest GPU shader capture (Clang and GCC)
        shell: bash
        run: |
          set -euo pipefail
          for cxx in clang++ g++; do
            "$cxx" -std=c++20 -O1 -Wall -Wextra -Wno-unused-parameter \
              -Ivendor/encore-active/ns2-runtime/ampere \
              -Ivendor/sources/eden/src \
              tools/ns2/test_ampere_gpu_capture.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/probe.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/lower_bridge.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/maxwell_image.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/translation_cache.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/capture.cpp \
              -o "build-ns2-a64/ampere-capture-${cxx//+/}"
            "build-ns2-a64/ampere-capture-${cxx//+/}"
          done
      - name: Compile and run source-verified NS2 translation cache (Clang and GCC)
        shell: bash
        run: |
          set -euo pipefail
          for cxx in clang++ g++; do
            "$cxx" -std=c++20 -O1 -Wall -Wextra -Wno-unused-parameter \
              -Ivendor/encore-active/ns2-runtime/ampere \
              -Ivendor/sources/eden/src \
              tools/ns2/test_ampere_translation_cache.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/probe.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/lower_bridge.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/maxwell_image.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/translation_cache.cpp \
              vendor/encore-active/ns2-runtime/ampere/shader_recompiler/frontend/ampere/capture.cpp \
              -o "build-ns2-a64/ampere-cache-${cxx//+/}"
            "build-ns2-a64/ampere-cache-${cxx//+/}"
          done
      - name: Verify in-flight shader cache invalidation under a deterministic race (Clang and GCC)
        shell: bash
