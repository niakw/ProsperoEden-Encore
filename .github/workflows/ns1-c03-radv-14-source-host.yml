name: NS1 C03 exact 14-source RADV host preflight (no PS5 build)
on:
  push:
    branches:
      - research/ns1-c03-radv-native-selected-20261111
  pull_request:
    paths:
      - vendor
      - "tools/install-vendored-radv.py"
      - "tools/radv-active-inputs.py"
      - "tools/check-vendored-radv-fork.py"
      - "tools/check-active-source-inventory.py"
      - "tools/check-eden-optimization-coverage.py"
      - ".github/workflows/ns1-c03-radv-14-source-host.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c03-selected-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source and exact isolated vendor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Verify pinned vendor revision and 14 selected graphics source owners
        shell: bash
        run: |
          set -euo pipefail
          # Three exact vendor graphs are recognized; the integrated and JXR SHAs
          # retain the 14 original reviewed RADV owners; the staged mesh unit is checked separately. Reject unknown gitlinks.
          selected="$(git -C vendor rev-parse HEAD)"
          expected="$(git ls-tree HEAD -- vendor | awk '{print $3}')"
          test "$selected" = "$expected"
          case "$selected" in
            1ec7b429238d1175a76dc94b7c0a7f1c2eb62864|fe9edd661d6f0824c7339865d50aa9cf99cab150|c339fd06f02e42e67d5416ae82194ba619b7ee68|47568425c71d534b72cc966d1500412c9ae4fc16|447e08718c9b6625508da6ce63796ed1f4285d2f|97fdc316fcf5b42e08c26845887f298feac2a424|5f53497bf6067dd68b6529b56aa7c9cf6eb5f598) ;;
            *) echo "Unreviewed vendor C03 source graph $selected" >&2; exit 1 ;;
          esac
          python3 -B vendor/tests/c03_radv_transfer_split.py
          python3 -B tools/check-vendored-radv-fork.py
          python3 -B tools/radv-active-inputs.py --self-test
          python3 -B tools/check-active-source-inventory.py
          python3 -B tools/check-eden-optimization-coverage.py
          echo "C03 source/host only: no Meson native object, PS5 GPU, or game boot proof" >> "$GITHUB_STEP_SUMMARY"
